name: Sync templateFIX into dev once

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/sync-templatefix-dev-once.yml

permissions:
  contents: write

jobs:
  merge-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Merge templateFIX without committing yet
        run: |
          git fetch origin templateFIX
          git merge --no-commit --no-ff origin/templateFIX
      - name: Remove one-off workflow from merge result
        run: rm .github/workflows/sync-templatefix-dev-once.yml
      - name: Install
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test tests/unit
      - name: Typecheck
        run: bun run typecheck
      - name: Production build
        run: bun run build
      - name: Commit merge and push dev
        run: |
          git config user.name modebrecht
          git config user.email '137332207+modebrecht@users.noreply.github.com'
          git add -A
          git commit -m 'Merge templateFIX into dev'
          git push origin HEAD:dev
