name: QA Orbit DOCX parity

on:
  push:
    branches:
      - qa-docx-orbit-ring-fix

permissions:
  contents: read

jobs:
  orbit-docx:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Orbit DOCX unit regression
        run: bun test tests/unit/dossier-docx-fresh-recipes.test.ts

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Lint touched DOCX surface
        run: >-
          bunx eslint
          src/lib/dossier-docx-template-recipes.ts
          tests/unit/dossier-docx-fresh-recipes.test.ts

      - name: Production build
        run: bun run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Generate DOCX batch containing Orbit
        env:
          DOCX_GALLERY_BATCH_INDEX: 8
          DOCX_GALLERY_DIR: artifacts/orbit-docx-batch
        run: npx playwright test tests/e2e/dossier-docx-gallery.spec.ts --reporter=line --workers=1

      - name: Verify DOCX batch
        shell: bash
        run: |
          count="$(find artifacts/orbit-docx-batch -maxdepth 1 -type f -name '*.docx' | wc -l | tr -d ' ')"
          echo "Generated $count DOCX files"
          test "$count" -eq 4
          while IFS= read -r -d '' docx; do
            unzip -tq "$docx" > /dev/null
            unzip -Z1 "$docx" | grep -Fxq 'word/document.xml'
          done < <(find artifacts/orbit-docx-batch -maxdepth 1 -type f -name '*.docx' -print0)

      - name: Upload Orbit QA DOCX batch
        uses: actions/upload-artifact@v4
        with:
          name: qa-orbit-docx-batch
          path: artifacts/orbit-docx-batch
          if-no-files-found: error
          retention-days: 2

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
