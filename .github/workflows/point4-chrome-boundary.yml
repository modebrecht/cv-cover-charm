name: Point 4 Chrome Boundary Refactor

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/point4-chrome-boundary.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply explicit chrome snapshot boundary
        run: python3 scripts/point4_refactor.py

      - name: Format changed files
        run: npx prettier --write src/components/dossier/DossierHeaderFooterChrome.tsx src/components/dossier/DossierPdfCanvas.tsx src/components/letter/LetterCanvas.tsx src/components/cv/CvCanvas.tsx src/components/cv/CvCanvasBase.tsx src/routes/anschreiben.tsx src/routes/lebenslauf.tsx src/routes/titelblatt.tsx src/routes/index.tsx tests/unit/dossier-chrome-renderer-boundary.test.ts

      - name: Verify before commit
        run: |
          bun install --frozen-lockfile
          bun test tests/unit/dossier-chrome-renderer-boundary.test.ts tests/unit/dossier-chrome-sync.test.ts tests/unit/dossier-chrome-geometry.test.ts
          bun run typecheck

      - name: Commit point 4 refactor
        shell: bash
        run: |
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add src tests/unit/dossier-chrome-renderer-boundary.test.ts
          if git diff --cached --quiet; then
            echo "No refactor changes needed"
            exit 0
          fi
          git commit -m "refactor(dossier): pass chrome snapshots explicitly"
          git push origin HEAD:dev
