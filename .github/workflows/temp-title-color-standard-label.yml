name: Temporary title color label patch

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/temp-title-color-standard-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Rename reset label
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/routes/lebenslauf.tsx')
          text = p.read_text()
          old = '>\n                      Vorlagenfarbe\n                    </button>'
          new = '>\n                      Standardfarbe\n                    </button>'
          if text.count(old) != 1:
              raise SystemExit(f'expected one title color reset label, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/lebenslauf.tsx
      - run: bunx tsc --noEmit
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add src/routes/lebenslauf.tsx
          git commit -m "fix(cv): keep template section label unambiguous"
          git push origin HEAD:dev
