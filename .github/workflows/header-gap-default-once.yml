name: Set shared header gap default once

on:
  push:
    branches:
      - templateFIX

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set 12 mm default and clearer shared control copy
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          path = "src/lib/dossier-chrome.ts"
          replace_once(path, "  headerGapMm: 6,", "  headerGapMm: 12,")
          replace_once(path, "?? fallback.headerGapMm ?? 6", "?? fallback.headerGapMm ?? 12")
          replace_once(path, "design.headerGapMm === (options.headerGapMm ?? 6)", "design.headerGapMm === (options.headerGapMm ?? 12)")
          replace_once(path, "headerGapMm: options.headerGapMm ?? 6,", "headerGapMm: options.headerGapMm ?? 12,")
          replace_once(path, "options.headerGapMm ?? 6", "options.headerGapMm ?? 12")

          path = "src/components/letter/LetterCanvas.tsx"
          replace_once(path, "    headerGapMm: 6,", "    headerGapMm: 12,")
          replace_once(path, "chrome.headerGapMm ?? 6", "chrome.headerGapMm ?? 12")

          path = "src/components/dossier/DossierChromeControls.tsx"
          replace_once(path, "  const headerGap = options.headerGapMm ?? 6;", "  const headerGap = options.headerGapMm ?? 12;")
          replace_once(path, "                  <span>Abstand nach Header</span>", "                  <span>Freiraum unter dem Header</span>")
          replace_once(path, "                {headerGap !== 6 ? (", "                {headerGap !== 12 ? (")
          replace_once(path, "                    onClick={() => patchOptions({ headerGapMm: 6 })}", "                    onClick={() => patchOptions({ headerGapMm: 12 })}")
          replace_once(path, "                    Standardabstand", "                    Standardabstand (12 mm)")

          p = Path(path)
          text = p.read_text()
          marker = '''                <input
                  data-dossier-header-gap-control
                  type="range"
                  min={0}
                  max={40}
                  step={1}
                  value={Math.min(40, Math.max(0, headerGap))}
                  onChange={(event) => patchOptions({ headerGapMm: Number(event.target.value) })}
                  className="w-full accent-primary"
                />
'''
          helper = '''                <span className="text-[11px] leading-relaxed text-muted-foreground">
                  Abstand zwischen Header-Ende und dem ersten Inhalt.
                </span>
'''
          if text.count(marker) != 1:
              raise SystemExit("header gap slider marker missing")
          p.write_text(text.replace(marker, marker + helper, 1))

          path = "tests/unit/dossier-header-gap.test.ts"
          replace_once(path, "defaults to 6 mm and clamps persisted values to 0–40 mm", "defaults to 12 mm and clamps persisted values to 0–40 mm")
          replace_once(path, "expect(DEFAULT_DOSSIER_CHROME_OPTIONS.headerGapMm).toBe(6);", "expect(DEFAULT_DOSSIER_CHROME_OPTIONS.headerGapMm).toBe(12);")
          replace_once(path, "expect(legacy.shared.headerGapMm).toBe(6);", "expect(legacy.shared.headerGapMm).toBe(12);")
          replace_once(path, "expect(controls).toContain(\"<span>Abstand nach Header</span>\");", "expect(controls).toContain(\"<span>Freiraum unter dem Header</span>\");")
          replace_once(path, "expect(controls).toContain(\"headerGapMm: 6\");", "expect(controls).toContain(\"headerGapMm: 12\");")
          replace_once(path, "expect(letterCanvas).toContain(\"chrome.headerGapMm ?? 6\");", "expect(letterCanvas).toContain(\"chrome.headerGapMm ?? 12\");")

          path = "tests/unit/dossier-chrome-geometry.test.ts"
          replace_once(path, "expect(dossierHeaderContentTopMmForOptions(contact, 0)).toBe(37);", "expect(dossierHeaderContentTopMmForOptions(contact, 0)).toBe(43);")
          replace_once(path, "toMatchObject({ top: 37, bottom: 20 })", "toMatchObject({ top: 43, bottom: 20 })")

          Path(".github/workflows/header-gap-default-once.yml").unlink()
          stale = Path(".github/workflows/tmp-header-gap-12.yml")
          if stale.exists():
              stale.unlink()
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format touched files
        run: bunx prettier --write src/lib/dossier-chrome.ts src/components/letter/LetterCanvas.tsx src/components/dossier/DossierChromeControls.tsx tests/unit/dossier-header-gap.test.ts tests/unit/dossier-chrome-geometry.test.ts

      - name: Focused header gap tests
        run: bun test tests/unit/dossier-header-gap.test.ts tests/unit/dossier-chrome-geometry.test.ts

      - name: Unit tests
        run: bun test tests/unit

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add -A
          git commit -m "Set 12 mm default spacing below header"
          git push origin HEAD:templateFIX