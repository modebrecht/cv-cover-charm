name: Temporary title color reset rename

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/temp-rename-title-color-reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Rename ambiguous reset button
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/routes/lebenslauf.tsx')
          text = p.read_text()
          old = '''                    >\n                      Vorlage\n                    </button>'''
          new = '''                    >\n                      Vorlagenfarbe\n                    </button>'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one title color reset button, found {count}')
          p.write_text(text.replace(old, new))
          PY
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/lebenslauf.tsx
      - run: bunx tsc --noEmit
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add src/routes/lebenslauf.tsx
          git commit -m "fix(cv): disambiguate document title color reset"
          git push origin HEAD:dev
