name: Recover dev CV typography

on:
  push:
    branches:
      - recover-dev-cv-typography
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-dev-cv-typography
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply recovery patch once
        shell: bash
        run: |
          if ! grep -q 'CV_DOC_TITLE_DEFAULTS' src/components/cv/types.ts; then
            python scripts/recover-dev-cv-typography.py
          fi

      - name: Enforce explicit typography overrides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wrapper = Path("src/components/cv/CvCanvas.tsx")
          text = wrapper.read_text()
          import_line = 'import "./user-typography.css";'
          if import_line not in text:
              text = text.replace(
                  'import "./full-section-rules.css";\n',
                  'import "./full-section-rules.css";\nimport "./user-typography.css";\n',
                  1,
              )
          wrapper.write_text(text)

          canvas = Path("src/components/cv/CvCanvasBase.tsx")
          text = canvas.read_text()

          old = '''      <div
        data-cv-section={id}
        style={{
          marginTop: layout === "modern" ? "4.8mm" : "4mm",'''
          new = '''      <div
        data-cv-section={id}
        data-cv-user-section-margin={sectionTitleMarginBottomPx === null ? undefined : "true"}
        style={{
          ["--cv-user-section-margin-bottom" as string]:
            sectionTitleMarginBottomPx === null ? undefined : `${sectionTitleMarginBottomPx}px`,
          marginTop: layout === "modern" ? "4.8mm" : "4mm",'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'data-cv-user-section-margin={sectionTitleMarginBottomPx === null ? undefined : "true"}' not in text:
              raise SystemExit("Could not patch main section margin override")

          old = '''          <div
            data-cv-section-title
            style={{
              // Versalien laufen breiter als Gemischtschrift; darum je nach'''
          new = '''          <div
            data-cv-section-title
            data-cv-user-section-size={sectionTitleFontSizePx === null ? undefined : "true"}
            data-cv-user-section-color={sectionTitleColor ? "true" : undefined}
            data-cv-user-section-weight={design.sectionTitleBold === undefined ? undefined : "true"}
            data-cv-user-section-style={design.sectionTitleItalic === undefined ? undefined : "true"}
            data-cv-user-section-decoration={
              design.sectionTitleUnderline === undefined ? undefined : "true"
            }
            style={{
              ["--cv-user-section-font-size" as string]:
                sectionTitleFontSizePx === null ? undefined : `${sectionTitleFontSizePx}px`,
              ["--cv-user-section-color" as string]: sectionTitleColor || undefined,
              ["--cv-user-section-weight" as string]: `${sectionTitleWeight}`,
              ["--cv-user-section-style" as string]: sectionTitleFontStyle,
              ["--cv-user-section-decoration" as string]: sectionTitleDecoration,
              // Versalien laufen breiter als Gemischtschrift; darum je nach'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'data-cv-user-section-size={sectionTitleFontSizePx === null ? undefined : "true"}' not in text:
              raise SystemExit("Could not patch main section title overrides")

          old = '''            <div
              data-cv-accent="section"
              style={{
                width: headingRule === "full" ? "auto" : layout === "modern" ? "15mm" : "18mm",'''
          new = '''            <div
              data-cv-accent="section"
              data-cv-user-section-color={sectionTitleColor ? "true" : undefined}
              style={{
                ["--cv-user-section-color" as string]: sectionTitleColor || undefined,
                width: headingRule === "full" ? "auto" : layout === "modern" ? "15mm" : "18mm",'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'data-cv-accent="section"\n              data-cv-user-section-color=' not in text:
              raise SystemExit("Could not patch main section rule color override")

          old = '''      <div
        data-cv-doc-title
        style={{
          fontSize: `${fontSizePx}px`,'''
          new = '''      <div
        data-cv-doc-title
        data-cv-user-doc-size={
          typeof design.docTitleFontSizePx === "number" && Number.isFinite(design.docTitleFontSizePx)
            ? "true"
            : undefined
        }
        data-cv-user-doc-color={customColor ? "true" : undefined}
        data-cv-user-doc-weight={design.docTitleBold === undefined ? undefined : "true"}
        data-cv-user-doc-style={design.docTitleItalic === undefined ? undefined : "true"}
        data-cv-user-doc-decoration={design.docTitleUnderline === undefined ? undefined : "true"}
        data-cv-user-doc-margin={
          typeof design.docTitleMarginBottomPx === "number" &&
          Number.isFinite(design.docTitleMarginBottomPx)
            ? "true"
            : undefined
        }
        style={{
          ["--cv-user-doc-font-size" as string]: `${fontSizePx}px`,
          ["--cv-user-doc-color" as string]: customColor || undefined,
          ["--cv-user-doc-weight" as string]: `${
            (design.docTitleBold ?? CV_DOC_TITLE_DEFAULTS.bold) ? 700 : 400
          }`,
          ["--cv-user-doc-style" as string]:
            (design.docTitleItalic ?? CV_DOC_TITLE_DEFAULTS.italic) ? "italic" : "normal",
          ["--cv-user-doc-decoration" as string]:
            (design.docTitleUnderline ?? CV_DOC_TITLE_DEFAULTS.underline) ? "underline" : "none",
          ["--cv-user-doc-margin-bottom" as string]: `${marginBottomPx}px`,
          fontSize: `${fontSizePx}px`,'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'data-cv-user-doc-color={customColor ? "true" : undefined}' not in text:
              raise SystemExit("Could not patch document title overrides")

          old = '''    <div
      data-cv-section="sidebar"
      style={{
        marginTop:'''
          new = '''    <div
      data-cv-section="sidebar"
      data-cv-user-section-margin={sectionTitleMarginBottomPx === null ? undefined : "true"}
      style={{
        ["--cv-user-section-margin-bottom" as string]:
          sectionTitleMarginBottomPx === null ? undefined : `${sectionTitleMarginBottomPx}px`,
        marginTop:'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'data-cv-section="sidebar"\n      data-cv-user-section-margin=' not in text:
              raise SystemExit("Could not patch sidebar section margin override")

          old = '''        <div
          data-cv-section-title
          style={{
            fontSize:'''
          new = '''        <div
          data-cv-section-title
          data-cv-user-section-size={sectionTitleFontSizePx === null ? undefined : "true"}
          data-cv-user-section-color={sectionTitleColor ? "true" : undefined}
          data-cv-user-section-weight={design.sectionTitleBold === undefined ? undefined : "true"}
          data-cv-user-section-style={design.sectionTitleItalic === undefined ? undefined : "true"}
          data-cv-user-section-decoration={
            design.sectionTitleUnderline === undefined ? undefined : "true"
          }
          style={{
            ["--cv-user-section-font-size" as string]:
              sectionTitleFontSizePx === null ? undefined : `${sectionTitleFontSizePx}px`,
            ["--cv-user-section-color" as string]: sectionTitleColor || undefined,
            ["--cv-user-section-weight" as string]: `${sectionTitleWeight}`,
            ["--cv-user-section-style" as string]: sectionTitleFontStyle,
            ["--cv-user-section-decoration" as string]: sectionTitleDecoration,
            fontSize:'''
          if old in text:
              text = text.replace(old, new, 1)
          elif text.count('data-cv-user-section-size={sectionTitleFontSizePx === null ? undefined : "true"}') < 2:
              raise SystemExit("Could not patch sidebar section title overrides")

          old = '''          <div
            data-cv-accent="section"
            style={{
              width: "auto",'''
          new = '''          <div
            data-cv-accent="section"
            data-cv-user-section-color={sectionTitleColor ? "true" : undefined}
            style={{
              ["--cv-user-section-color" as string]: sectionTitleColor || undefined,
              width: "auto",'''
          if old in text:
              text = text.replace(old, new, 1)
          elif text.count('data-cv-user-section-color={sectionTitleColor ? "true" : undefined}') < 4:
              raise SystemExit("Could not patch sidebar section rule color override")

          canvas.write_text(text)

          css = Path("src/components/cv/user-typography.css")
          css.write_text('''/*
 * Explicit CV typography controls outrank template defaults without changing
 * untouched templates. The PDF raster mask intentionally has higher
 * specificity so exported raster text remains transparent; addCvTextLayer()
 * disables that mask while reading these real computed values for vector text.
 */
html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-doc-title][data-cv-user-doc-size="true"] {
  font-size: var(--cv-user-doc-font-size) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-doc-title][data-cv-user-doc-color="true"] {
  color: var(--cv-user-doc-color) !important;
  -webkit-text-fill-color: var(--cv-user-doc-color) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-doc-title][data-cv-user-doc-weight="true"] {
  font-weight: var(--cv-user-doc-weight) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-doc-title][data-cv-user-doc-style="true"] {
  font-style: var(--cv-user-doc-style) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-doc-title][data-cv-user-doc-decoration="true"] {
  text-decoration-line: var(--cv-user-doc-decoration) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-doc-title][data-cv-user-doc-margin="true"] {
  margin-bottom: var(--cv-user-doc-margin-bottom) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-section][data-cv-user-section-margin="true"] {
  margin-bottom: var(--cv-user-section-margin-bottom) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-section-title][data-cv-user-section-size="true"] {
  font-size: var(--cv-user-section-font-size) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-section-title][data-cv-user-section-color="true"] {
  color: var(--cv-user-section-color) !important;
  -webkit-text-fill-color: var(--cv-user-section-color) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-section-title][data-cv-user-section-weight="true"] {
  font-weight: var(--cv-user-section-weight) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-section-title][data-cv-user-section-style="true"] {
  font-style: var(--cv-user-section-style) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-section-title][data-cv-user-section-decoration="true"] {
  text-decoration-line: var(--cv-user-section-decoration) !important;
}

html[data-dossier-template]
  [data-dossier-document="cv"]
  :is([data-cv-page], [data-cv-measure-page])
  [data-cv-accent="section"][data-cv-user-section-color="true"] {
  background: var(--cv-user-section-color) !important;
}
''')

          card = Path("tests/e2e/cv-card-refresh.spec.ts")
          text = card.read_text()
          old = '''    const previewSnapshot = await typographySnapshot(preview);
    const exportSnapshot = await typographySnapshot(exportRoot);
    expect(previewSnapshot).not.toBeNull();'''
          new = '''    const previewSnapshot = await typographySnapshot(preview);
    const unmasked = await page.evaluate(() => {
      const mask = document.getElementById("cv-pdf-raster-text-mask") as HTMLStyleElement | null;
      if (!mask) return false;
      mask.disabled = true;
      return true;
    });
    expect(unmasked, "PDF text-layer source must be readable with the raster mask disabled").toBe(
      true,
    );
    const exportSnapshot = await typographySnapshot(exportRoot);
    await page.evaluate(() => {
      const mask = document.getElementById("cv-pdf-raster-text-mask") as HTMLStyleElement | null;
      if (mask) mask.disabled = false;
    });
    expect(previewSnapshot).not.toBeNull();'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'PDF text-layer source must be readable with the raster mask disabled' not in text:
              raise SystemExit("Could not patch PDF source typography validation")
          card.write_text(text)

          unit = Path("tests/unit/cv-dev-recovery.test.ts")
          text = unit.read_text()
          if 'const userTypographyCss = readFileSync("src/components/cv/user-typography.css", "utf8");' not in text:
              text = text.replace(
                  'const route = readFileSync("src/routes/lebenslauf.tsx", "utf8");\n',
                  'const route = readFileSync("src/routes/lebenslauf.tsx", "utf8");\nconst userTypographyCss = readFileSync("src/components/cv/user-typography.css", "utf8");\n',
                  1,
              )
          marker = '''test("explicit typography controls outrank template defaults without breaking the PDF raster mask", () => {
  for (const contract of [
    "data-cv-user-doc-color",
    "data-cv-user-doc-weight",
    "data-cv-user-doc-margin",
    "data-cv-user-section-color",
    "data-cv-user-section-weight",
    "data-cv-user-section-margin",
  ]) {
    expect(canvas).toContain(contract);
  }
  expect(userTypographyCss).toContain("-webkit-text-fill-color: var(--cv-user-doc-color) !important");
  expect(userTypographyCss).toContain("font-weight: var(--cv-user-section-weight) !important");
  expect(userTypographyCss).toContain("margin-bottom: var(--cv-user-section-margin-bottom) !important");
});

'''
          if marker not in text:
              text = text.replace(
                  'test("demo CV no longer adds a redundant subtitle below the candidate name", () => {',
                  marker + 'test("demo CV no longer adds a redundant subtitle below the candidate name", () => {',
                  1,
              )
          unit.write_text(text)
          PY

          bunx prettier --write \
            src/components/cv/CvCanvas.tsx \
            src/components/cv/CvCanvasBase.tsx \
            src/components/cv/user-typography.css \
            tests/unit/cv-dev-recovery.test.ts \
            tests/e2e/cv-card-refresh.spec.ts

      - name: Verify focused recovery tests
        run: bun test tests/unit/cv-dev-recovery.test.ts tests/unit/cv-section-rule.test.ts

      - name: Commit recovery changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No recovery changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/cv/CvCanvas.tsx \
            src/components/cv/CvCanvasBase.tsx \
            src/components/cv/user-typography.css \
            tests/unit/cv-dev-recovery.test.ts \
            tests/e2e/cv-card-refresh.spec.ts
          git commit -m 'fix(cv): honor explicit typography in preview and PDF text source'
          git push origin HEAD:recover-dev-cv-typography

      - name: Dispatch native regression and 39-PDF gallery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for workflow in dossier-regression.yml dossier-pdf-gallery.yml; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"recover-dev-cv-typography"}'
          done
