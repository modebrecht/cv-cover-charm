name: Recover dev CV typography

on:
  push:
    branches:
      - recover-dev-cv-typography
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-dev-cv-typography
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply recovery patch once
        shell: bash
        run: |
          if ! grep -q 'CV_DOC_TITLE_DEFAULTS' src/components/cv/types.ts; then
            python scripts/recover-dev-cv-typography.py
          fi

      - name: Enforce explicit typography overrides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"Could not patch {label}")

          wrapper = Path("src/components/cv/CvCanvas.tsx")
          text = wrapper.read_text()
          if 'import "./user-typography.css";' not in text:
              text = text.replace('import "./full-section-rules.css";\n', 'import "./full-section-rules.css";\nimport "./user-typography.css";\n', 1)
          wrapper.write_text(text)

          canvas = Path("src/components/cv/CvCanvasBase.tsx")
          text = canvas.read_text()

          old = '        data-cv-section={id}\n        style={{\n          marginTop: layout === "modern" ? "4.8mm" : "4mm",'
          new = '        data-cv-section={id}\n        data-cv-user-section-margin={sectionTitleMarginBottomPx === null ? undefined : "true"}\n        style={{\n          ["--cv-user-section-margin-bottom" as string]:\n            sectionTitleMarginBottomPx === null ? undefined : `${sectionTitleMarginBottomPx}px`,\n          marginTop: layout === "modern" ? "4.8mm" : "4mm",'
          text = replace_once(text, old, new, "main section margin override")

          old = '            data-cv-section-title\n            style={{\n              // Versalien laufen breiter als Gemischtschrift; darum je nach'
          new = '            data-cv-section-title\n            data-cv-user-section-size={sectionTitleFontSizePx === null ? undefined : "true"}\n            data-cv-user-section-color={sectionTitleColor ? "true" : undefined}\n            data-cv-user-section-weight={design.sectionTitleBold === undefined ? undefined : "true"}\n            data-cv-user-section-style={design.sectionTitleItalic === undefined ? undefined : "true"}\n            data-cv-user-section-decoration={design.sectionTitleUnderline === undefined ? undefined : "true"}\n            style={{\n              ["--cv-user-section-font-size" as string]: sectionTitleFontSizePx === null ? undefined : `${sectionTitleFontSizePx}px`,\n              ["--cv-user-section-color" as string]: sectionTitleColor || undefined,\n              ["--cv-user-section-weight" as string]: `${sectionTitleWeight}`,\n              ["--cv-user-section-style" as string]: sectionTitleFontStyle,\n              ["--cv-user-section-decoration" as string]: sectionTitleDecoration,\n              // Versalien laufen breiter als Gemischtschrift; darum je nach'
          text = replace_once(text, old, new, "main section title overrides")

          old = '              data-cv-accent="section"\n              style={{\n                width: headingRule === "full" ? "auto" : layout === "modern" ? "15mm" : "18mm",'
          new = '              data-cv-accent="section"\n              data-cv-user-section-color={sectionTitleColor ? "true" : undefined}\n              style={{\n                ["--cv-user-section-color" as string]: sectionTitleColor || undefined,\n                width: headingRule === "full" ? "auto" : layout === "modern" ? "15mm" : "18mm",'
          text = replace_once(text, old, new, "main section rule color override")

          old = '        data-cv-doc-title\n        style={{\n          fontSize: `${fontSizePx}px`,'
          new = '        data-cv-doc-title\n        data-cv-user-doc-size={typeof design.docTitleFontSizePx === "number" && Number.isFinite(design.docTitleFontSizePx) ? "true" : undefined}\n        data-cv-user-doc-color={customColor ? "true" : undefined}\n        data-cv-user-doc-weight={design.docTitleBold === undefined ? undefined : "true"}\n        data-cv-user-doc-style={design.docTitleItalic === undefined ? undefined : "true"}\n        data-cv-user-doc-decoration={design.docTitleUnderline === undefined ? undefined : "true"}\n        data-cv-user-doc-margin={typeof design.docTitleMarginBottomPx === "number" && Number.isFinite(design.docTitleMarginBottomPx) ? "true" : undefined}\n        style={{\n          ["--cv-user-doc-font-size" as string]: `${fontSizePx}px`,\n          ["--cv-user-doc-color" as string]: customColor || undefined,\n          ["--cv-user-doc-weight" as string]: `${(design.docTitleBold ?? CV_DOC_TITLE_DEFAULTS.bold) ? 700 : 400}`,\n          ["--cv-user-doc-style" as string]: (design.docTitleItalic ?? CV_DOC_TITLE_DEFAULTS.italic) ? "italic" : "normal",\n          ["--cv-user-doc-decoration" as string]: (design.docTitleUnderline ?? CV_DOC_TITLE_DEFAULTS.underline) ? "underline" : "none",\n          ["--cv-user-doc-margin-bottom" as string]: `${marginBottomPx}px`,\n          fontSize: `${fontSizePx}px`,'
          text = replace_once(text, old, new, "document title overrides")

          old = '      data-cv-section="sidebar"\n      style={{\n        marginTop:'
          new = '      data-cv-section="sidebar"\n      data-cv-user-section-margin={sectionTitleMarginBottomPx === null ? undefined : "true"}\n      style={{\n        ["--cv-user-section-margin-bottom" as string]: sectionTitleMarginBottomPx === null ? undefined : `${sectionTitleMarginBottomPx}px`,\n        marginTop:'
          text = replace_once(text, old, new, "sidebar section margin override")

          old = '          data-cv-section-title\n          style={{\n            fontSize:'
          new = '          data-cv-section-title\n          data-cv-user-section-size={sectionTitleFontSizePx === null ? undefined : "true"}\n          data-cv-user-section-color={sectionTitleColor ? "true" : undefined}\n          data-cv-user-section-weight={design.sectionTitleBold === undefined ? undefined : "true"}\n          data-cv-user-section-style={design.sectionTitleItalic === undefined ? undefined : "true"}\n          data-cv-user-section-decoration={design.sectionTitleUnderline === undefined ? undefined : "true"}\n          style={{\n            ["--cv-user-section-font-size" as string]: sectionTitleFontSizePx === null ? undefined : `${sectionTitleFontSizePx}px`,\n            ["--cv-user-section-color" as string]: sectionTitleColor || undefined,\n            ["--cv-user-section-weight" as string]: `${sectionTitleWeight}`,\n            ["--cv-user-section-style" as string]: sectionTitleFontStyle,\n            ["--cv-user-section-decoration" as string]: sectionTitleDecoration,\n            fontSize:'
          text = replace_once(text, old, new, "sidebar section title overrides")

          old = '            data-cv-accent="section"\n            style={{\n              width: "auto",'
          new = '            data-cv-accent="section"\n            data-cv-user-section-color={sectionTitleColor ? "true" : undefined}\n            style={{\n              ["--cv-user-section-color" as string]: sectionTitleColor || undefined,\n              width: "auto",'
          text = replace_once(text, old, new, "sidebar section rule color override")

          canvas.write_text(text)

          card = Path("tests/e2e/cv-card-refresh.spec.ts")
          text = card.read_text()
          old = '    const previewSnapshot = await typographySnapshot(preview);\n    const exportSnapshot = await typographySnapshot(exportRoot);\n    expect(previewSnapshot).not.toBeNull();'
          new = '    const previewSnapshot = await typographySnapshot(preview);\n    const unmasked = await page.evaluate(() => {\n      const mask = document.getElementById("cv-pdf-raster-text-mask") as HTMLStyleElement | null;\n      if (!mask) return false;\n      mask.disabled = true;\n      return true;\n    });\n    expect(unmasked, "PDF text-layer source must be readable with the raster mask disabled").toBe(true);\n    const exportSnapshot = await typographySnapshot(exportRoot);\n    await page.evaluate(() => {\n      const mask = document.getElementById("cv-pdf-raster-text-mask") as HTMLStyleElement | null;\n      if (mask) mask.disabled = false;\n    });\n    expect(previewSnapshot).not.toBeNull();'
          text = replace_once(text, old, new, "PDF source typography validation")
          card.write_text(text)

          unit = Path("tests/unit/cv-dev-recovery.test.ts")
          text = unit.read_text()
          css_read = 'const userTypographyCss = readFileSync("src/components/cv/user-typography.css", "utf8");'
          if css_read not in text:
              text = text.replace('const route = readFileSync("src/routes/lebenslauf.tsx", "utf8");\n', 'const route = readFileSync("src/routes/lebenslauf.tsx", "utf8");\n' + css_read + '\n', 1)
          if 'explicit typography controls outrank template defaults' not in text:
              marker = 'test("explicit typography controls outrank template defaults without breaking the PDF raster mask", () => {\n  for (const contract of [\n    "data-cv-user-doc-color",\n    "data-cv-user-doc-weight",\n    "data-cv-user-doc-margin",\n    "data-cv-user-section-color",\n    "data-cv-user-section-weight",\n    "data-cv-user-section-margin",\n  ]) {\n    expect(canvas).toContain(contract);\n  }\n  expect(userTypographyCss).toContain("-webkit-text-fill-color: var(--cv-user-doc-color) !important");\n  expect(userTypographyCss).toContain("font-weight: var(--cv-user-section-weight) !important");\n  expect(userTypographyCss).toContain("margin-bottom: var(--cv-user-section-margin-bottom) !important");\n});\n\n'
              text = text.replace('test("demo CV no longer adds a redundant subtitle below the candidate name", () => {', marker + 'test("demo CV no longer adds a redundant subtitle below the candidate name", () => {', 1)
          unit.write_text(text)
          PY

          bunx prettier --write \
            src/components/cv/CvCanvas.tsx \
            src/components/cv/CvCanvasBase.tsx \
            src/components/cv/user-typography.css \
            tests/unit/cv-dev-recovery.test.ts \
            tests/e2e/cv-card-refresh.spec.ts

      - name: Verify focused recovery tests
        run: bun test tests/unit/cv-dev-recovery.test.ts tests/unit/cv-section-rule.test.ts

      - name: Commit recovery changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No recovery changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/cv/CvCanvas.tsx \
            src/components/cv/CvCanvasBase.tsx \
            src/components/cv/user-typography.css \
            tests/unit/cv-dev-recovery.test.ts \
            tests/e2e/cv-card-refresh.spec.ts
          git commit -m 'fix(cv): honor explicit typography in preview and PDF text source'
          git push origin HEAD:recover-dev-cv-typography

      - name: Dispatch native regression and 39-PDF gallery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for workflow in dossier-regression.yml dossier-pdf-gallery.yml; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"recover-dev-cv-typography"}'
          done
