name: Recover dev CV typography

on:
  push:
    branches:
      - recover-dev-cv-typography
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-dev-cv-typography
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply recovery patch once
        shell: bash
        run: |
          if ! grep -q 'CV_DOC_TITLE_DEFAULTS' src/components/cv/types.ts; then
            python scripts/recover-dev-cv-typography.py
          fi

      - name: Harden validation selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dossier = Path("tests/e2e/dossier-regression.spec.ts")
          text = dossier.read_text()
          old = '    const cvTemplateHeader = page.getByRole("button", { name: /^Vorlage/ });'
          new = '''    const cvTemplateHeader = page
                .locator("button[data-editor-section-toggle]")
                .filter({ hasText: "Vorlage" })
                .first();'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Could not locate CV template header selector")
          dossier.write_text(text)

          card = Path("tests/e2e/cv-card-refresh.spec.ts")
          text = card.read_text()
          replacements = [
              (
                  '    const title = node.querySelector<HTMLElement>("[data-cv-doc-title]");',
                  '    const title = node.querySelector<HTMLElement>("[data-cv-page] [data-cv-doc-title]");',
              ),
              (
                  'node.querySelectorAll<HTMLElement>("[data-cv-section-title]")',
                  'node.querySelectorAll<HTMLElement>("[data-cv-page] [data-cv-section-title]")',
              ),
              (
                  '    await expect(preview.getByText("Projekte", { exact: true }).first()).toBeVisible();',
                  '    await expect(\n      preview.locator("[data-cv-page]").getByText("Projekte", { exact: true }).first(),\n    ).toBeVisible();',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"Could not locate expected CV typography validation fragment: {old}")
          card.write_text(text)
          PY

          bunx prettier --write \
            src/components/cv/types.ts \
            src/components/cv/CvCanvasBase.tsx \
            src/routes/lebenslauf.tsx \
            tests/unit/cv-dev-recovery.test.ts \
            tests/e2e/cv-demo-pagination.spec.ts \
            tests/e2e/cv-card-refresh.spec.ts \
            tests/e2e/dossier-regression.spec.ts

      - name: Verify focused recovery tests
        run: bun test tests/unit/cv-dev-recovery.test.ts tests/unit/cv-section-rule.test.ts

      - name: Commit recovery changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No recovery changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/cv/types.ts \
            src/components/cv/CvCanvasBase.tsx \
            src/routes/lebenslauf.tsx \
            tests/unit/cv-dev-recovery.test.ts \
            tests/e2e/cv-demo-pagination.spec.ts \
            tests/e2e/cv-card-refresh.spec.ts \
            tests/e2e/dossier-regression.spec.ts
          git commit -m 'test(cv): harden final recovered typography validation'
          git push origin HEAD:recover-dev-cv-typography

      - name: Dispatch native regression and 39-PDF gallery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for workflow in dossier-regression.yml dossier-pdf-gallery.yml; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"recover-dev-cv-typography"}'
          done
