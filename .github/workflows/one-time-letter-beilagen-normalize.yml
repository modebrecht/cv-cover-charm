name: One-time letter Beilagen normalization

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch-letter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize letter Beilagen labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/letter/LetterCanvas.tsx')
          text = path.read_text(encoding='utf-8')
          count = text.count('Beilagen:')
          if count != 2:
              raise SystemExit(f'Expected exactly 2 Beilagen: occurrences, found {count}')
          path.write_text(text.replace('Beilagen:', 'Beilagen'), encoding='utf-8')
          PY

      - name: Commit normalized labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/letter/LetterCanvas.tsx
          git commit -m "Normalize letter Beilagen labels"
          git push origin HEAD:dev
