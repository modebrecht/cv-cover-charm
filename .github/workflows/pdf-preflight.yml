name: Automatic PDF preflight acceptance

on:
  push:
    branches: ["fix/pdf-preflight-*"]
    paths:
      [
        "src/**",
        "tests/**",
        "scripts/pdf_preflight_raster.py",
        ".github/workflows/pdf-preflight.yml",
      ]
  pull_request:
    branches: [dev]
    paths:
      [
        "src/lib/pdf-preflight.ts",
        "src/lib/dossier-pdf.ts",
        "src/components/letter/**",
        "src/components/dossier/DossierExportDialog.tsx",
        "tests/qa/pdf-preflight*",
        ".github/workflows/pdf-preflight.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    # Includes the existing full matrix plus resource/override tests and raster
    # inspection of every generated acceptance PDF. Individual test limits stay strict.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locked application and browser dependencies
        run: |
          bun install --frozen-lockfile
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          bun install --frozen-lockfile
      - name: Units, types, lint, formatting and production build
        run: |
          bun test tests/unit
          bun run typecheck
          npx tsc --noEmit -p tests/qa/tsconfig.json
          bun run lint
          bun run format:check:release
          npx prettier --check src/lib/pdf-preflight.ts src/components/letter/LetterDocument.tsx src/routes/anschreiben.tsx src/routes/index.tsx src/routes/lebenslauf.tsx src/routes/titelblatt.tsx tests/qa/pdf-preflight*.ts tests/qa/playwright.preflight.config.ts tests/qa/pagination-browser.ts tests/e2e/letter-physical-preflight.spec.ts .github/workflows/pdf-preflight.yml
          bun run build
      - name: Browser and PDF raster reader
        run: |
          bash scripts/qa-browser-setup.sh
          python -m pip install PyMuPDF==1.26.6
      - name: Strict preflight, resources, override and negative safety tests
        env:
          PAGINATION_QA_DIR: artifacts/pdf-preflight
        run: npx playwright test --config tests/qa/playwright.preflight.config.ts
      - name: Existing product and editor regressions
        run: npx playwright test --config tests/qa/playwright.letter-product.config.ts
      - name: Complete 39-template CV and Letter matrices and deep boundaries
        env:
          PAGINATION_QA_DIR: artifacts/pdf-preflight-matrix
        run: npx playwright test --config tests/qa/playwright.integration.config.ts
      - name: Long combined dossiers and sidebar regressions
        env:
          PAGINATION_COMBINED_QA_DIR: artifacts/pdf-preflight-combined
        run: npx playwright test --config tests/qa/playwright.combined.config.ts
      - name: Literal word search across 39 automatic PDFs
        run: npx playwright test --config tests/qa/playwright.pdf-search.config.ts --grep 'all 39 automatic|automatic PDF retains'
      - name: Visible raster, logical fields and evidence summary
        env:
          PAGINATION_QA_DIR: artifacts/pdf-preflight-matrix
        run: |
          python scripts/pdf_preflight_raster.py artifacts/pdf-preflight artifacts/pdf-preflight-matrix artifacts/pdf-preflight-combined
          bun scripts/pagination_qa_fields.mjs
          node scripts/pagination_qa_summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-preflight-${{ github.sha }}
          path: |
            artifacts/pdf-preflight*
            artifacts/pagination-integration/results.json
            artifacts/letter-textlayer/product-results.json
            artifacts/pdf-text-search
            tests/qa/artifacts/pdf-preflight
            tests/qa/test-results/pdf-preflight
            test-results/pdf-preflight
            test-results/pagination-integration
            test-results/pagination-combined
            test-results/letter-textlayer-product
          retention-days: 14
