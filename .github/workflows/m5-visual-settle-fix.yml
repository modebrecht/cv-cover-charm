name: M5 Visual Settle Fix

on:
  push:
    branches:
      - letter-m1-m2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: letter-m1-m2
          fetch-depth: 1

      - name: Stabilize visual gallery screenshots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/letter-final-qa.spec.ts')
          text = path.read_text(encoding='utf-8')
          marker = 'async function settleVisualPreview(preview: Locator)'
          if marker in text:
              print('visual settle helper already present')
              raise SystemExit(0)

          old = '''async function doubleFrame(page: Page) {\n  await page.evaluate(\n    () =>\n      new Promise<void>((resolve) =>\n        requestAnimationFrame(() => requestAnimationFrame(() => resolve())),\n      ),\n  );\n}\n'''
          new = old + '''\nasync function settleVisualPreview(preview: Locator) {\n  await expect\n    .poll(\n      () =>\n        preview.evaluate((element) => {\n          const scaleHost = element.parentElement;\n          if (!scaleHost) return 0;\n          const transform = getComputedStyle(scaleHost).transform;\n          if (!transform || transform === "none") return 1;\n          const matrix = new DOMMatrixReadOnly(transform);\n          return matrix.a;\n        }),\n      { message: "ScaledPreview should finish its ResizeObserver measurement before visual capture" },\n    )\n    .toBeGreaterThan(0.99);\n}\n'''
          if old not in text:
              raise SystemExit('doubleFrame helper block not found')
          text = text.replace(old, new, 1)

          old = '''  await expect(preview).toBeVisible();\n  await doubleFrame(page);\n  const path = join(ARTIFACT_DIR, "00-UI-Default.png");\n'''
          new = '''  await expect(preview).toBeVisible();\n  await doubleFrame(page);\n  await settleVisualPreview(preview);\n  const path = join(ARTIFACT_DIR, "00-UI-Default.png");\n'''
          if old not in text:
              raise SystemExit('UI default screenshot block not found')
          text = text.replace(old, new, 1)

          old = '''      const number = String(index + 1).padStart(2, "0");\n      const fileName = `${number}-${safeName(template)}-default.png`;\n      const shot = await preview.screenshot({\n'''
          new = '''      const number = String(index + 1).padStart(2, "0");\n      const fileName = `${number}-${safeName(template)}-default.png`;\n      await settleVisualPreview(preview);\n      const shot = await preview.screenshot({\n'''
          if old not in text:
              raise SystemExit('template screenshot block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit visual settle fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/letter-final-qa.spec.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "test(letter): settle scaled preview before visual capture"
          git push origin HEAD:letter-m1-m2
