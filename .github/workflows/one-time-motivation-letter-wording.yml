name: One-time motivation-letter wording cleanup

on:
  push:
    branches:
      - feature/anschreiben-dossier
    paths:
      - .github/workflows/one-time-motivation-letter-wording.yml

permissions:
  contents: write

jobs:
  wording-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anschreiben-dossier

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replace legacy PDF wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/dossier-pdf.ts')
          text = path.read_text()
          replacements = {
              'Anschreiben konnte für den PDF-Text nicht vermessen werden':
                  'Motivationsschreiben konnte für den PDF-Text nicht vermessen werden',
              'Titelblatt/CV bleiben Raster; das Anschreiben erhält eine echte formatierte Textebene.':
                  'Titelblatt/CV bleiben Raster; das Motivationsschreiben erhält eine echte formatierte Textebene.',
              'Dossier ist noch nicht vollständig: Titelblatt, Anschreiben und Lebenslauf werden benötigt':
                  'Dossier ist noch nicht vollständig: Titelblatt, Motivationsschreiben und Lebenslauf werden benötigt',
              'Bewerbung, Anschreiben, Lebenslauf, Titelblatt':
                  'Bewerbung, Motivationsschreiben, Lebenslauf, Titelblatt',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected wording not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          if grep -n 'Anschreiben' src/lib/dossier-pdf.ts; then
            echo 'Legacy wording still present in dossier-pdf.ts' >&2
            exit 1
          fi

      - name: Format touched file
        run: bunx prettier --write src/lib/dossier-pdf.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Unit tests
        run: bun test tests/unit

      - name: Lint touched file
        run: bunx eslint src/lib/dossier-pdf.ts

      - name: Production build
        run: bun run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Run dossier regression suite
        run: npx playwright test tests/e2e/dossier-regression.spec.ts --reporter=line --workers=1

      - name: Commit passing wording cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-motivation-letter-wording.yml
          git add src/lib/dossier-pdf.ts
          git diff --cached --check
          git commit -m "Use motivation-letter wording consistently"
          git push origin HEAD:feature/anschreiben-dossier

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
