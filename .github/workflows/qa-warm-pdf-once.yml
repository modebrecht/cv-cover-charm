name: Warm PDF Visual QA

on:
  push:
    branches:
      - m13-visual-acceptance

permissions:
  contents: read

concurrency:
  group: warm-pdf-visual-qa-${{ github.sha }}
  cancel-in-progress: true

jobs:
  warm-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Warm regression guard
        run: bun test tests/unit/templatefix-warm-letter-header.test.ts

      - name: Check touched formatting
        run: bunx prettier --check src/components/letter/LetterCanvas.tsx tests/unit/templatefix-warm-letter-header.test.ts

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Render Warm-containing gallery batch
        env:
          GALLERY_BATCH_INDEX: 1
          GALLERY_DIR: artifacts/warm-qa
        run: npx playwright test tests/e2e/dossier-gallery.spec.ts --reporter=line --workers=1

      - name: Verify Warm PDF
        shell: bash
        run: |
          test -f artifacts/warm-qa/04-Warm.pdf
          test "$(find artifacts/warm-qa -maxdepth 1 -type f -name '*.pdf' | wc -l | tr -d ' ')" -eq 4

      - name: Upload Warm visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: warm-pdf-visual-qa
          path: artifacts/warm-qa
          if-no-files-found: error
          retention-days: 2

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
