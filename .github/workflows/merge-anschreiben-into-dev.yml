name: One-time merge Anschreiben into dev

on:
  push:
    branches:
      - feature/anschreiben-dossier
    paths:
      - .github/workflows/merge-anschreiben-into-dev.yml

permissions:
  contents: write

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge feature with guarded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feature/anschreiben-dossier

          set +e
          git merge --no-ff --no-commit origin/feature/anschreiben-dossier
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"
            expected=(
              'src/components/letter/types.ts'
              'src/routes/lebenslauf.tsx'
            )
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            if [ "$(printf '%s\n' "${conflicts[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]; then
              echo 'Unexpected conflict set; aborting without touching dev.' >&2
              git merge --abort
              exit 1
            fi

            # Letter: keep the feature's dossier/fontOverride model, but preserve
            # the current Cabin default from dev.
            git checkout --theirs -- src/components/letter/types.ts
            python3 <<'PY'
from pathlib import Path
p = Path('src/components/letter/types.ts')
s = p.read_text()
needle = '    font: "sans",\n    fontOverride: null,'
replacement = '    font: "freundlich",\n    fontOverride: null,'
if needle not in s:
    raise SystemExit('Expected letter default font block not found')
p.write_text(s.replace(needle, replacement, 1))
PY

            # CV: keep current dev (Cabin + real PDF text) and apply the feature's
            # intentional removal of the retired Colorful -> Blockig migration.
            git checkout --ours -- src/routes/lebenslauf.tsx
            python3 <<'PY'
from pathlib import Path
p = Path('src/routes/lebenslauf.tsx')
s = p.read_text()
needle = '''  if (merged.template === "colorful") {
    merged.template = "blockig";
    merged.colors = defaultColors("blockig");
  }
'''
if needle not in s:
    raise SystemExit('Expected legacy colorful migration block not found')
p.write_text(s.replace(needle, '', 1))
PY

            git add src/components/letter/types.ts src/routes/lebenslauf.tsx
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain.' >&2
            exit 1
          fi

          git commit -m 'Merge feature/anschreiben-dossier into dev'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit regressions
        run: bun test tests/unit

      - name: Production build
        run: bun run build

      - name: Push merged dev
        run: git push origin HEAD:dev
