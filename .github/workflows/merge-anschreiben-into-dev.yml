name: One-time merge Anschreiben into dev

on:
  push:
    branches:
      - feature/anschreiben-dossier
    paths:
      - .github/workflows/merge-anschreiben-into-dev.yml

permissions:
  contents: write

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge feature with guarded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feature/anschreiben-dossier

          set +e
          git merge --no-ff --no-commit origin/feature/anschreiben-dossier
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              'src/components/letter/types.ts'
              'src/routes/lebenslauf.tsx'
            )
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            if [ "$(printf '%s\n' "${conflicts[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]; then
              printf 'Unexpected conflicts:\n%s\n' "${conflicts[*]}" >&2
              git merge --abort
              exit 1
            fi

            git checkout --theirs -- src/components/letter/types.ts
            python3 -c 'from pathlib import Path; p=Path("src/components/letter/types.ts"); s=p.read_text(); old="    font: \"sans\",\n    fontOverride: null,"; new="    font: \"freundlich\",\n    fontOverride: null,"; assert old in s, "letter default block missing"; p.write_text(s.replace(old,new,1))'

            git checkout --ours -- src/routes/lebenslauf.tsx
            python3 -c 'from pathlib import Path; p=Path("src/routes/lebenslauf.tsx"); s=p.read_text(); old="  if (merged.template === \"colorful\") {\n    merged.template = \"blockig\";\n    merged.colors = defaultColors(\"blockig\");\n  }\n"; assert old in s, "legacy colorful migration missing"; p.write_text(s.replace(old,"",1))'

            git add src/components/letter/types.ts src/routes/lebenslauf.tsx
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain.' >&2
            exit 1
          fi

          # The runner is temporary and must not land on dev.
          git rm -f .github/workflows/merge-anschreiben-into-dev.yml
          git commit -m 'Merge feature/anschreiben-dossier into dev'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit regressions
        run: bun test tests/unit

      - name: Production build
        run: bun run build

      - name: Publish merged state
        run: |
          git push origin HEAD:dev
          git push origin HEAD:feature/anschreiben-dossier
