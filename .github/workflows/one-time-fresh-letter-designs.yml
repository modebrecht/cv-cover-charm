name: One-time fresh motivation-letter designs

on:
  push:
    branches:
      - feature/anschreiben-dossier
    paths:
      - .github/workflows/one-time-fresh-letter-designs.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anschreiben-dossier

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply fresh letter designs
        run: python scripts/one-time-fresh-letter-designs.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format LetterCanvas
        run: bunx prettier --write src/components/letter/LetterCanvas.tsx

      - name: Unit tests
        run: bun test tests/unit

      - name: Lint LetterCanvas
        run: bunx eslint src/components/letter/LetterCanvas.tsx

      - name: Production build
        run: bun run build

      - name: Commit passing design variants
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-fresh-letter-designs.yml scripts/one-time-fresh-letter-designs.py
          git add src/components/letter/LetterCanvas.tsx
          git diff --cached --check
          git commit -m "Give fresh templates distinct motivation-letter designs"
          git push origin HEAD:feature/anschreiben-dossier
