name: DOCX Next model and runtime gates

on:
  push:
    branches: ["fix/docx-next-model-gate-15okt", "fix/docx-next-pdf-print-boundary-15okt"]
    paths:
      - "src/**"
      - "tests/unit/**"
      - "tests/fixtures/docx-next/**"
      - "tests/support/docx-next-runtime-graph.ts"
      - "tests/qa/playwright.docx-boundary.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docx-next-model-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docx-next-model-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locked dependencies
        run: bun install --frozen-lockfile
      - name: DOCX Next regressions including the canonical model gate
        run: bun run test:docx-next
      - name: Complete unit suite
        run: bun test tests/unit
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Formatting
        run: |
          bun run format:check:release
          bunx prettier --check src/lib/docx-next/build-model.ts src/lib/docx-next/template-motifs.ts src/lib/docx-next/validation.ts tests/unit/docx-next-model-boundary.test.ts
          bunx prettier --check src/lib/dossier-contact-data.ts src/lib/dossier-contact.ts src/lib/dossier-resolved-chrome.ts src/components/cover/template-slots.ts src/components/cover/fresh-templates.ts src/components/cv/types.ts src/components/cv/design.ts src/components/cv/legacy-type-scales.ts tests/support/docx-next-runtime-graph.ts tests/unit/docx-next-pdf-print-boundary.test.ts tests/qa/playwright.docx-boundary.config.ts
      - name: Production build
        run: bun run build

  shared-state-browser:
    if: github.ref == 'refs/heads/fix/docx-next-pdf-print-boundary-15okt'
    needs: model-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locked app and pinned browser runner
        run: |
          bun install --frozen-lockfile
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          bun install --frozen-lockfile
      - name: Chromium
        run: bash scripts/qa-browser-setup.sh
      - name: Existing contact/chrome and dossier state roundtrip integrations
        run: npx playwright test --config tests/qa/playwright.docx-boundary.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docx-next-boundary-browser-${{ github.sha }}
          path: |
            artifacts/docx-next-boundary
            test-results/docx-next-boundary
          retention-days: 14
