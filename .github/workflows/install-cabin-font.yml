name: Install Cabin font assets

on:
  push:
    branches:
      - feature/cabin-dossier-font
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cabin-dossier-font
      - name: Download Cabin font family and license
        run: |
          set -euo pipefail
          mkdir -p public/fonts
          base='https://raw.githubusercontent.com/impallari/Cabin/master/fonts/TTF'
          curl -fsSL "$base/Cabin-Regular.ttf" -o public/fonts/Cabin-Regular.ttf
          curl -fsSL "$base/Cabin-Bold.ttf" -o public/fonts/Cabin-Bold.ttf
          curl -fsSL "$base/Cabin-Italic.ttf" -o public/fonts/Cabin-Italic.ttf
          curl -fsSL "$base/Cabin-BoldItalic.ttf" -o public/fonts/Cabin-BoldItalic.ttf
          curl -fsSL 'https://raw.githubusercontent.com/impallari/Cabin/master/OFL.txt' -o public/fonts/Cabin-OFL.txt
          rm .github/workflows/install-cabin-font.yml
      - name: Commit assets and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fonts .github/workflows/install-cabin-font.yml
          git commit -m 'Add Cabin font assets for dossier rendering'
          git push origin HEAD:feature/cabin-dossier-font
