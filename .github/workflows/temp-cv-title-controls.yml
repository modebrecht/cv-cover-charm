name: Temporary CV title controls patch

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/temp-cv-title-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch CV title controls
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new))

          types = "src/components/cv/types.ts"
          replace(
              types,
              '  /** Grösse von Name und Dokumenttitel, 1 = Vorgabe. */\n  titleScale?: number;',
              '  /** Grösse des Namens, 1 = Vorgabe. Der Dokumenttitel hat eigene Regler. */\n  titleScale?: number;',
          )
          replace(
              types,
              '  /** Grösse des Fliesstexts, 1 = Vorgabe. */\n  bodyScale?: number;\n  /** Breite der Seitenspalte als Anteil der Blattbreite. */',
              '''  /** Grösse des Fliesstexts, 1 = Vorgabe. */\n  bodyScale?: number;\n  /** Eigene Gestaltung für den kleinen Dokumenttitel über dem Namen. */\n  docTitleFontSizePx?: number;\n  docTitleColor?: string;\n  docTitleBold?: boolean;\n  docTitleItalic?: boolean;\n  docTitleUnderline?: boolean;\n  docTitleMarginBottomPx?: number;\n  /** Breite der Seitenspalte als Anteil der Blattbreite. */''',
          )
          replace(types, '  headingRule: "short" as CvHeadingRule,', '  headingRule: "full" as CvHeadingRule,')
          replace(
              types,
              '''export const CV_TYPE_DEFAULTS = {\n  headingRule: "full" as CvHeadingRule,\n  titleScale: 1,\n  headingScale: 1,\n  bodyScale: 1,\n  /** 30/70 – die Aufteilung, die sich beim Ausprobieren als brauchbar zeigte. */\n  sidebarPct: 0.3,\n} as const;''',
              '''export const CV_TYPE_DEFAULTS = {\n  headingRule: "full" as CvHeadingRule,\n  titleScale: 1,\n  headingScale: 1,\n  bodyScale: 1,\n  /** 30/70 – die Aufteilung, die sich beim Ausprobieren als brauchbar zeigte. */\n  sidebarPct: 0.3,\n} as const;\n\nexport const CV_DOC_TITLE_DEFAULTS = {\n  fontSizePx: 18,\n  bold: true,\n  italic: false,\n  underline: false,\n  marginBottomPx: 10,\n} as const;\nexport const CV_DOC_TITLE_FONT_SIZE_MIN = 10;\nexport const CV_DOC_TITLE_FONT_SIZE_MAX = 48;\nexport const CV_DOC_TITLE_MARGIN_BOTTOM_MAX = 100;''',
          )
          replace(
              types,
              '    untertitel: "Schülerin, 3. Sekundarklasse",',
              '    untertitel: "",',
          )

          form = "src/components/cv/CvForm.tsx"
          replace(
              form,
              '<Field label="Zeile unter dem Namen">\n        <input\n          className={inputCls}\n          placeholder="z. B. Schülerin, 3. Sekundarklasse"',
              '<Field label="Zeile unter dem Namen (optional)">\n        <input\n          className={inputCls}\n          placeholder="z. B. Schüler/in, 3. Sekundarklasse"',
          )

          canvas = "src/components/cv/CvCanvasBase.tsx"
          replace(
              canvas,
              '  CV_BLOCK_LABELS,\n  CV_TYPE_DEFAULTS,',
              '''  CV_BLOCK_LABELS,\n  CV_DOC_TITLE_DEFAULTS,\n  CV_DOC_TITLE_FONT_SIZE_MAX,\n  CV_DOC_TITLE_FONT_SIZE_MIN,\n  CV_DOC_TITLE_MARGIN_BOTTOM_MAX,\n  CV_TYPE_DEFAULTS,''',
          )
          replace(
              canvas,
              '''  const docTitle = (color: string) => {\n    const text = data.titel?.trim();\n    if (!text) return null;\n    return (\n      <div\n        data-cv-doc-title\n        style={{\n          fontSize: `${(8.2 * TYPE_BASE * titleScale).toFixed(2)}pt`,\n          fontWeight: headingStyle.weight,\n          letterSpacing: "0.16em",\n          textTransform: "uppercase",\n          fontFamily: theme.typography.fontStack,\n          color,\n          opacity: 0.85,\n          marginBottom: "1.8mm",\n        }}\n      >\n        {text}\n      </div>\n    );\n  };''',
              '''  const docTitle = (color: string) => {\n    const text = data.titel?.trim();\n    if (!text) return null;\n    const fontSizePx = Math.max(\n      CV_DOC_TITLE_FONT_SIZE_MIN,\n      Math.min(\n        CV_DOC_TITLE_FONT_SIZE_MAX,\n        design.docTitleFontSizePx ?? CV_DOC_TITLE_DEFAULTS.fontSizePx,\n      ),\n    );\n    const marginBottomPx = Math.max(\n      0,\n      Math.min(\n        CV_DOC_TITLE_MARGIN_BOTTOM_MAX,\n        design.docTitleMarginBottomPx ?? CV_DOC_TITLE_DEFAULTS.marginBottomPx,\n      ),\n    );\n    const customColor = design.docTitleColor?.trim();\n    return (\n      <div\n        data-cv-doc-title\n        style={{\n          fontSize: `${fontSizePx}px`,\n          fontWeight: (design.docTitleBold ?? CV_DOC_TITLE_DEFAULTS.bold) ? 700 : 400,\n          fontStyle: (design.docTitleItalic ?? CV_DOC_TITLE_DEFAULTS.italic) ? "italic" : "normal",\n          textDecoration: (design.docTitleUnderline ?? CV_DOC_TITLE_DEFAULTS.underline)\n            ? "underline"\n            : "none",\n          letterSpacing: "0.16em",\n          textTransform: "uppercase",\n          fontFamily: theme.typography.fontStack,\n          color: customColor || color,\n          opacity: customColor ? 1 : 0.85,\n          marginBottom: `${marginBottomPx}px`,\n        }}\n      >\n        {text}\n      </div>\n    );\n  };''',
          )

          route = "src/routes/lebenslauf.tsx"
          replace(
              route,
              '  CV_SECTION_LABELS,\n  CV_SCALE_MAX,',
              '''  CV_SECTION_LABELS,\n  CV_DOC_TITLE_DEFAULTS,\n  CV_DOC_TITLE_FONT_SIZE_MAX,\n  CV_DOC_TITLE_FONT_SIZE_MIN,\n  CV_DOC_TITLE_MARGIN_BOTTOM_MAX,\n  CV_SCALE_MAX,''',
          )
          replace(
              route,
              '''                <label className="flex flex-col gap-1 text-xs">\n                  <span className="text-muted-foreground">Titel des Dokuments</span>\n                  <input\n                    type="text"\n                    value={data.titel ?? ""}\n                    placeholder={DEFAULT_CV_TITLE}\n                    onChange={(e) => patchData({ titel: e.target.value })}\n                    className="rounded-md border border-input bg-background px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-ring"\n                  />\n                  <span className="text-muted-foreground/80">\n                    Steht über dem Namen. Leer lassen blendet ihn aus.\n                  </span>\n                </label>\n\n                <FormCvPerson''',
              '''                <label className="flex flex-col gap-1 text-xs">\n                  <span className="text-muted-foreground">Titel des Dokuments</span>\n                  <input\n                    type="text"\n                    value={data.titel ?? ""}\n                    placeholder={DEFAULT_CV_TITLE}\n                    onChange={(e) => patchData({ titel: e.target.value })}\n                    className="rounded-md border border-input bg-background px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-ring"\n                  />\n                  <span className="text-muted-foreground/80">\n                    Steht über dem Namen. Leer lassen blendet ihn aus.\n                  </span>\n                </label>\n\n                <div className="grid gap-3 rounded-md border bg-muted/20 p-2.5">\n                  <div className="text-xs font-semibold">Dokumenttitel gestalten</div>\n                  <label className="flex flex-col gap-1 text-xs">\n                    <span className="text-muted-foreground">\n                      Schriftgrösse {design.docTitleFontSizePx ?? CV_DOC_TITLE_DEFAULTS.fontSizePx} px\n                    </span>\n                    <input\n                      type="range"\n                      min={CV_DOC_TITLE_FONT_SIZE_MIN}\n                      max={CV_DOC_TITLE_FONT_SIZE_MAX}\n                      step={1}\n                      value={design.docTitleFontSizePx ?? CV_DOC_TITLE_DEFAULTS.fontSizePx}\n                      onChange={(event) =>\n                        setDesign((current) => ({\n                          ...current,\n                          docTitleFontSizePx: Number(event.target.value),\n                        }))\n                      }\n                      className="w-full accent-primary"\n                      aria-label="Schriftgrösse Dokumenttitel"\n                    />\n                  </label>\n\n                  <div className="flex flex-wrap items-center gap-2 text-xs">\n                    <span className="text-muted-foreground">Schriftfarbe</span>\n                    <input\n                      type="color"\n                      value={design.docTitleColor ?? "#6b7280"}\n                      onChange={(event) =>\n                        setDesign((current) => ({ ...current, docTitleColor: event.target.value }))\n                      }\n                      className="h-7 w-10 cursor-pointer rounded border border-input bg-background"\n                      aria-label="Schriftfarbe Dokumenttitel"\n                    />\n                    <button\n                      type="button"\n                      onClick={() =>\n                        setDesign((current) => ({ ...current, docTitleColor: undefined }))\n                      }\n                      className="text-muted-foreground underline hover:text-foreground"\n                    >\n                      Vorlage\n                    </button>\n                  </div>\n\n                  <div className="grid grid-cols-3 gap-1">\n                    <button\n                      type="button"\n                      aria-pressed={design.docTitleBold ?? CV_DOC_TITLE_DEFAULTS.bold}\n                      onClick={() =>\n                        setDesign((current) => ({\n                          ...current,\n                          docTitleBold: !(current.docTitleBold ?? CV_DOC_TITLE_DEFAULTS.bold),\n                        }))\n                      }\n                      className={`rounded-md border px-2 py-1.5 text-xs font-bold ${\n                        (design.docTitleBold ?? CV_DOC_TITLE_DEFAULTS.bold)\n                          ? "border-foreground bg-accent"\n                          : "border-input hover:border-foreground/40"\n                      }`}\n                    >\n                      Fett\n                    </button>\n                    <button\n                      type="button"\n                      aria-pressed={design.docTitleItalic ?? CV_DOC_TITLE_DEFAULTS.italic}\n                      onClick={() =>\n                        setDesign((current) => ({\n                          ...current,\n                          docTitleItalic: !(current.docTitleItalic ?? CV_DOC_TITLE_DEFAULTS.italic),\n                        }))\n                      }\n                      className={`rounded-md border px-2 py-1.5 text-xs italic ${\n                        (design.docTitleItalic ?? CV_DOC_TITLE_DEFAULTS.italic)\n                          ? "border-foreground bg-accent"\n                          : "border-input hover:border-foreground/40"\n                      }`}\n                    >\n                      Kursiv\n                    </button>\n                    <button\n                      type="button"\n                      aria-pressed={design.docTitleUnderline ?? CV_DOC_TITLE_DEFAULTS.underline}\n                      onClick={() =>\n                        setDesign((current) => ({\n                          ...current,\n                          docTitleUnderline: !(\n                            current.docTitleUnderline ?? CV_DOC_TITLE_DEFAULTS.underline\n                          ),\n                        }))\n                      }\n                      className={`rounded-md border px-2 py-1.5 text-xs underline ${\n                        (design.docTitleUnderline ?? CV_DOC_TITLE_DEFAULTS.underline)\n                          ? "border-foreground bg-accent"\n                          : "border-input hover:border-foreground/40"\n                      }`}\n                    >\n                      Unterstrichen\n                    </button>\n                  </div>\n\n                  <label className="flex flex-col gap-1 text-xs">\n                    <span className="text-muted-foreground">\n                      Abstand nach unten {design.docTitleMarginBottomPx ?? CV_DOC_TITLE_DEFAULTS.marginBottomPx} px\n                    </span>\n                    <input\n                      type="range"\n                      min={0}\n                      max={CV_DOC_TITLE_MARGIN_BOTTOM_MAX}\n                      step={1}\n                      value={\n                        design.docTitleMarginBottomPx ?? CV_DOC_TITLE_DEFAULTS.marginBottomPx\n                      }\n                      onChange={(event) =>\n                        setDesign((current) => ({\n                          ...current,\n                          docTitleMarginBottomPx: Number(event.target.value),\n                        }))\n                      }\n                      className="w-full accent-primary"\n                      aria-label="Abstand unter Dokumenttitel"\n                    />\n                  </label>\n                </div>\n\n                <FormCvPerson''',
          )
          replace(
              route,
              '["titleScale", "Name und Titel", "Der Name oben und der Dokumenttitel."],',
              '["titleScale", "Name", "Der Name oben."],',
          )

          test = Path("tests/unit/cv-doc-title-style.test.ts")
          test.write_text('''import { expect, test } from "bun:test";\nimport { readFileSync } from "node:fs";\nimport {\n  CV_DOC_TITLE_DEFAULTS,\n  CV_DOC_TITLE_MARGIN_BOTTOM_MAX,\n  CV_TYPE_DEFAULTS,\n  DEMO_CV,\n} from "../../src/components/cv/types";\n\ntest("CV defaults use full heading rules and omit the redundant demo subtitle", () => {\n  expect(CV_TYPE_DEFAULTS.headingRule).toBe("full");\n  expect(DEMO_CV.person.untertitel).toBe("");\n});\n\ntest("document title has independent persisted style controls", () => {\n  expect(CV_DOC_TITLE_DEFAULTS.fontSizePx).toBeGreaterThan(13);\n  expect(CV_DOC_TITLE_MARGIN_BOTTOM_MAX).toBe(100);\n\n  const canvas = readFileSync("src/components/cv/CvCanvasBase.tsx", "utf8");\n  const route = readFileSync("src/routes/lebenslauf.tsx", "utf8");\n  for (const contract of [\n    "docTitleFontSizePx",\n    "docTitleColor",\n    "docTitleBold",\n    "docTitleItalic",\n    "docTitleUnderline",\n    "docTitleMarginBottomPx",\n  ]) {\n    expect(canvas).toContain(contract);\n    expect(route).toContain(contract);\n  }\n  expect(route).toContain("max={CV_DOC_TITLE_MARGIN_BOTTOM_MAX}");\n  expect(canvas).toContain("marginBottom: `${marginBottomPx}px`");\n});\n''')
          PY
      - name: Format modified files
        run: bunx prettier --write src/components/cv/types.ts src/components/cv/CvForm.tsx src/components/cv/CvCanvasBase.tsx src/routes/lebenslauf.tsx tests/unit/cv-doc-title-style.test.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Targeted test
        run: bun test tests/unit/cv-doc-title-style.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add src/components/cv/types.ts src/components/cv/CvForm.tsx src/components/cv/CvCanvasBase.tsx src/routes/lebenslauf.tsx tests/unit/cv-doc-title-style.test.ts
          git commit -m "feat(cv): customize document title styling"
          git push origin HEAD:dev
