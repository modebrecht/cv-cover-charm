name: Template REDO Check

on:
  push:
    branches:
      - templateREDO

permissions:
  contents: read

concurrency:
  group: template-redo-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Unit tests
        run: bun test tests/unit

      - name: Check changed-file formatting
        run: >-
          bunx prettier --check
          src/components/dossier/DossierSheetBackground.tsx
          src/components/letter/LetterSheetBackground.tsx
          src/components/cover/template-decorations.ts
          src/components/cv/CvCanvas.tsx
          src/components/cv/layout.ts
          tests/unit/m13-visual-fixes.test.tsx
          tests/unit/m14-regression-hardening.test.tsx

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Lint changed surface
        run: >-
          bunx eslint
          src/components/dossier/DossierSheetBackground.tsx
          src/components/letter/LetterSheetBackground.tsx
          src/components/cover/template-decorations.ts
          src/components/cv/CvCanvas.tsx
          src/components/cv/layout.ts
          tests/unit/m13-visual-fixes.test.tsx
          tests/unit/m14-regression-hardening.test.tsx

      - name: Production build
        run: bun run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Generate Blockig gallery batch
        env:
          GALLERY_BATCH_INDEX: 1
          GALLERY_DIR: artifacts/template-redo-batch-1
        run: npx playwright test tests/e2e/dossier-gallery.spec.ts --reporter=line --workers=1

      - name: Verify Blockig PDF exists
        run: test -f artifacts/template-redo-batch-1/07-Blockig.pdf

      - name: Upload Blockig QA batch
        uses: actions/upload-artifact@v4
        with:
          name: template-redo-blockig-batch
          path: artifacts/template-redo-batch-1
          if-no-files-found: error
          retention-days: 2

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
