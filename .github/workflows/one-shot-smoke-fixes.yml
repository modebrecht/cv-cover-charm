name: One-shot smoke fixes

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-shot-smoke-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply smoke fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing target in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "tests/e2e/letter-final-qa.spec.ts",
              'const LETTER_STYLE_IDS = ["brief", ...DOSSIER_TEMPLATE_IDS] as const;',
              'const LETTER_STYLE_IDS = DOSSIER_TEMPLATE_IDS;',
          )
          replace_once(
              "tests/e2e/letter-final-qa.spec.ts",
              '''    expect(TEMPLATES).toHaveLength(19);\n    expect(FRESH_TEMPLATE_IDS).toHaveLength(18);\n    expect(DOSSIER_TEMPLATE_IDS).toHaveLength(37);\n    expect(new Set(DOSSIER_TEMPLATE_IDS).size).toBe(37);\n    expect(LETTER_STYLE_IDS).toHaveLength(38);''',
              '''    expect(TEMPLATES).toHaveLength(20);\n    expect(FRESH_TEMPLATE_IDS).toHaveLength(18);\n    expect(DOSSIER_TEMPLATE_IDS).toHaveLength(38);\n    expect(new Set(DOSSIER_TEMPLATE_IDS).size).toBe(38);\n    expect(LETTER_STYLE_IDS).toHaveLength(38);''',
          )

          replace_once(
              "tests/e2e/dossier-regression.spec.ts",
              '''    await page.waitForLoadState("domcontentloaded");\n\n    const sheet = previewRoot(page).locator('[data-cv-page="0"]');''',
              '''    await page.waitForLoadState("domcontentloaded");\n    await expect(previewRoot(page)).toHaveAttribute("data-cv-template", "neon");\n\n    const sheet = previewRoot(page).locator('[data-cv-page="0"]');''',
          )

          replace_once(
              "tests/e2e/letter-adversarial-content.spec.ts",
              '''    if (textLayer.scrollWidth > textLayer.clientWidth + 1) problems.push("horizontal text overflow");\n    if (textLayer.scrollHeight > textLayer.clientHeight + 1) problems.push("vertical text overflow");''',
              '''    // Editor-only image handles may deliberately protrude into the page margin.\n    // Horizontal overflow is therefore checked on printable text/image nodes below,\n    // while the text layer itself remains authoritative for vertical one-page fit.\n    if (textLayer.scrollHeight > textLayer.clientHeight + 1) problems.push("vertical text overflow");''',
          )
          replace_once(
              "tests/e2e/letter-adversarial-content.spec.ts",
              '''      outside(\n        element,\n        pageRect,\n        element.dataset.letterPdfText ?? element.dataset.letterPdfRichtext ?? "text",\n      );''',
              '''      const label = element.dataset.letterPdfText ?? element.dataset.letterPdfRichtext ?? "text";\n      outside(element, pageRect, label);\n      if (element.scrollWidth > element.clientWidth + 1) {\n        problems.push(`${label} horizontal overflow`);\n      }''',
          )

          Path(".github/workflows/one-shot-smoke-fixes.yml").unlink()
      - name: Format touched tests
        run: >-
          bunx prettier@3.8.3 --write
          tests/e2e/letter-final-qa.spec.ts
          tests/e2e/dossier-regression.spec.ts
          tests/e2e/letter-adversarial-content.spec.ts
      - name: Commit smoke fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align full smoke gates with shared Brief and editor geometry"
          git push origin HEAD:dev
