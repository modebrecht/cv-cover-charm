name: Temporary letter body font size patch

on:
  push:
    branches:
      - tmp-letter-body-font-size

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python scripts/tmp_letter_body_font_size_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test focused regression
        run: bun test tests/unit/letter-body-font-size.test.ts
      - name: Build
        run: bun run build
      - name: Commit patched tree
        shell: bash
        run: |
          rm -f .github/workflows/tmp-letter-body-font-size.yml scripts/tmp_letter_body_font_size_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(letter): add body font size control"
          git push origin HEAD:tmp-letter-body-font-size
