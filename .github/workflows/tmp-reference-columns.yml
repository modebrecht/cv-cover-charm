name: Temporary reference columns patch

on:
  push:
    branches: [tmp-reference-columns-auto]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python scripts/tmp-reference-columns.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test focused regression
        run: bun test tests/unit/cv-reference-columns.test.ts
      - name: Build
        run: bun run build
      - name: Commit patched tree
        run: |
          rm -f .github/workflows/tmp-reference-columns.yml scripts/tmp-reference-columns.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(cv): show references side by side"
          git push origin HEAD:tmp-reference-columns-auto
