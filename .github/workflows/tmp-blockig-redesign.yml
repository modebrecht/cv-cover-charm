name: Temporary Blockig redesign

on:
  push:
    branches:
      - templateREDO

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: templateREDO
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild Blockig visual system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Cover: keep the strong navy header, but replace the huge empty orange
          # slab with one long shallow band aligned to the photo's lower edge.
          cover = Path('src/components/cover/template-decorations.ts')
          text = cover.read_text()
          old = '''  blockig: [\n    rect("decor-top-block", "Kopfblock", 0, 0, 105, 30, "primary"),\n    rect("decor-side-block", "Farbfläche", 0, 46, 105, 72, "accent", 0.9),\n  ],'''
          new = '''  blockig: [\n    rect("decor-top-block", "Kopfblock", 0, 0, 105, 30, "primary"),\n    rect("decor-accent-band", "Akzentband", 0, 104, 105, 14, "accent", 0.96),\n  ],'''
          if old in text:
              cover.write_text(text.replace(old, new))
          elif 'rect("decor-accent-band", "Akzentband", 0, 104, 105, 14, "accent", 0.96)' not in text:
              raise SystemExit('Blockig cover decoration changed unexpectedly')

          # Letter: the navy rail is the structural identity. The bottom orange
          # dossier band already carries the accent, so remove the random mid-page
          # orange fragment entirely.
          letter = Path('src/components/letter/LetterSheetBackground.tsx')
          text = letter.read_text()
          accent = '''          <div\n            data-letter-motif="accent-edge"\n            className="absolute left-[16mm] top-[44mm] h-[76mm] w-[3mm]"\n            style={{ backgroundColor: accent, opacity: 0.96 }}\n          />\n'''
          if accent in text:
              text = text.replace(accent, '')
              letter.write_text(text)
          elif 'data-letter-motif="accent-edge"' in text or 'data-letter-motif="accent-block"' in text:
              raise SystemExit('Blockig letter accent changed unexpectedly')

          # CV: orange is already used for section headings, rules and the footer.
          # Remove the separate vertical slab so nothing competes with sidebar text.
          bg = Path('src/components/dossier/DossierSheetBackground.tsx')
          text = bg.read_text()
          accent = '''      {template === "blockig" && (\n        <div\n          data-dossier-blockig-accent\n          className="absolute left-[63mm] top-[44mm] h-[76mm] w-[3mm]"\n          style={{ backgroundColor: accent, opacity: 0.96 }}\n        />\n      )}\n\n'''
          if accent in text:
              bg.write_text(text.replace(accent, ''))
          elif 'data-dossier-blockig-accent' in text:
              raise SystemExit('Blockig CV accent changed unexpectedly')

          # Regression tests describe the new, deliberate geometry.
          test = Path('tests/unit/m13-visual-fixes.test.tsx')
          text = test.read_text()
          start = text.index('  test("Blockig letter keeps the orange accent inside the dark rail"') if 'Blockig letter keeps the orange accent inside the dark rail' in text else -1
          end_marker = '  test("Blockig shared sheet keeps one long sidebar-safe accent and no detached dash"'
          if start >= 0 and end_marker in text:
              end = text.index(end_marker, start)
              replacement = '''  test("Blockig letter uses one clean dark rail without floating orange fragments", () => {\n    const markup = renderToStaticMarkup(\n      createElement(LetterSheetBackground, {\n        template: "blockig",\n        colors: defaultLetterColors("blockig"),\n      }),\n    );\n\n    expect(markup).toContain('data-letter-motif="rail"');\n    expect(markup).not.toContain('data-letter-motif="accent-edge"');\n    expect(markup).not.toContain('data-letter-motif="accent-block"');\n    expect(markup).not.toContain('data-letter-motif="rail-rule"');\n  });\n\n'''
              text = text[:start] + replacement + text[end:]
          old_shared = '''  test("Blockig shared sheet keeps one long sidebar-safe accent and no detached dash", () => {\n    const markup = renderToStaticMarkup(\n      createElement(DossierSheetBackground, {\n        template: "blockig",\n        colors: defaultLetterColors("blockig"),\n      }),\n    );\n\n    expect(markup).toContain("width:66mm");\n    expect(markup).toContain("data-dossier-blockig-accent");\n    expect(markup).toContain("left-[63mm]");\n    expect(markup).toContain("h-[76mm]");\n    expect(markup).toContain("w-[3mm]");\n    expect(markup).not.toContain("top-[88mm]");\n  });'''
          new_shared = '''  test("Blockig shared CV sheet uses the navy sidebar without a floating accent slab", () => {\n    const markup = renderToStaticMarkup(\n      createElement(DossierSheetBackground, {\n        template: "blockig",\n        colors: defaultLetterColors("blockig"),\n      }),\n    );\n\n    expect(markup).toContain("width:66mm");\n    expect(markup).not.toContain("data-dossier-blockig-accent");\n    expect(markup).not.toContain("top-[88mm]");\n  });'''
          if old_shared in text:
              text = text.replace(old_shared, new_shared)
          elif 'Blockig shared CV sheet uses the navy sidebar without a floating accent slab' not in text:
              raise SystemExit('Blockig M13 shared-sheet test changed unexpectedly')
          test.write_text(text)

          hardening = Path('tests/unit/m14-regression-hardening.test.tsx')
          text = hardening.read_text()
          text = text.replace(
              "    expect(markup).toContain('data-letter-motif=\"accent-edge\"');\n",
              "    expect(markup).not.toContain('data-letter-motif=\"accent-edge\"');\n",
          )
          hardening.write_text(text)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed files
        run: bunx prettier --write src/components/cover/template-decorations.ts src/components/letter/LetterSheetBackground.tsx src/components/dossier/DossierSheetBackground.tsx tests/unit/m13-visual-fixes.test.tsx tests/unit/m14-regression-hardening.test.tsx

      - name: Validate
        run: |
          bun test tests/unit
          bun run typecheck
          bunx eslint src/components/cover/template-decorations.ts src/components/letter/LetterSheetBackground.tsx src/components/dossier/DossierSheetBackground.tsx tests/unit/m13-visual-fixes.test.tsx tests/unit/m14-regression-hardening.test.tsx
          bun run build

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Generate Blockig gallery batch
        env:
          GALLERY_BATCH_INDEX: 1
          GALLERY_DIR: artifacts/blockig-redesign
        run: npx playwright test tests/e2e/dossier-gallery.spec.ts --reporter=line --workers=1

      - name: Verify Blockig PDF exists
        run: test -f artifacts/blockig-redesign/07-Blockig.pdf

      - name: Upload Blockig PDF batch
        uses: actions/upload-artifact@v4
        with:
          name: blockig-redesign-batch
          path: artifacts/blockig-redesign
          if-no-files-found: error
          retention-days: 2

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cover/template-decorations.ts src/components/letter/LetterSheetBackground.tsx src/components/dossier/DossierSheetBackground.tsx tests/unit/m13-visual-fixes.test.tsx tests/unit/m14-regression-hardening.test.tsx
          if git diff --cached --quiet; then
            echo "No redesign changes needed."
            exit 0
          fi
          git commit -m "Rebuild Blockig dossier composition"
          git push origin HEAD:templateREDO

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
