name: One-time letter correction pass

on:
  push:
    branches:
      - feature/anschreiben-dossier

permissions:
  contents: write

jobs:
  correct-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anschreiben-dossier
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply correction pass
        run: python scripts/one-time-letter-correction-pass.py
      - name: Format touched files
        run: |
          bunx prettier --write \
            src/components/letter/types.ts \
            src/components/letter/LetterLayoutControls.tsx \
            src/components/letter/LetterCanvas.tsx \
            src/routes/anschreiben.tsx \
            tests/e2e/dossier-regression.spec.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Unit tests
        run: bun test tests/unit
      - name: Lint touched files
        run: |
          bunx eslint \
            src/components/letter/types.ts \
            src/components/letter/LetterLayoutControls.tsx \
            src/components/letter/LetterCanvas.tsx \
            src/routes/anschreiben.tsx \
            tests/e2e/dossier-regression.spec.ts
      - name: Production build
        run: bun run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1
      - name: Run dossier regression suite
        run: npx playwright test tests/e2e/dossier-regression.spec.ts --reporter=line --workers=1
      - name: Show app log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true
      - name: Commit passing correction pass
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-letter-correction-pass.yml scripts/one-time-letter-correction-pass.py
          git add \
            src/components/letter/types.ts \
            src/components/letter/LetterLayoutControls.tsx \
            src/components/letter/LetterCanvas.tsx \
            src/routes/anschreiben.tsx \
            tests/e2e/dossier-regression.spec.ts
          git diff --cached --check
          git commit -m "Polish application letter structure and labels"
          git push origin HEAD:feature/anschreiben-dossier
      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
