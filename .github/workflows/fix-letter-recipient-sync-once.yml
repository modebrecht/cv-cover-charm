name: Guard letter-only recipient Y offset once

on:
  push:
    branches:
      - templateFIX

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preserve letter-only offset across sync topology changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/lib/dossier-chrome.ts",
              '''  if (sync) {\n    const source = state[scope];\n    return { ...state, sync: true, shared: { ...source } };\n  }''',
              '''  if (sync) {\n    const source = state[scope];\n    // Recipient placement belongs to the motivation letter, not to the shared\n    // header/footer topology. Re-enabling sync from the CV must therefore keep\n    // the letter branch's recipient offset instead of reviving the CV's dormant copy.\n    const letterRecipientOffsetYMm =\n      state.letter.letterRecipientOffsetYMm ?? state.shared.letterRecipientOffsetYMm ?? 0;\n    return {\n      ...state,\n      sync: true,\n      shared: { ...source, letterRecipientOffsetYMm },\n    };\n  }''',
          )

          test_path = Path("tests/unit/dossier-chrome-positioning.test.ts")
          text = test_path.read_text()
          text = text.replace(
              'import { normalizeDossierChromeState } from "../../src/lib/dossier-chrome";',
              'import {\n  normalizeDossierChromeState,\n  setDossierChromeSyncState,\n} from "../../src/lib/dossier-chrome";',
              1,
          )
          marker = '''  test("controls expose sender/recipient and shared footer positioning", () => {'''
          insertion = '''  test("letter recipient offset survives re-enabling sync from the CV", () => {\n    const split = normalizeDossierChromeState({\n      sync: false,\n      shared: {},\n      cv: { letterRecipientOffsetYMm: 0 },\n      letter: { letterRecipientOffsetYMm: 7 },\n    });\n    const synced = setDossierChromeSyncState(split, "cv", true);\n    expect(synced.shared.letterRecipientOffsetYMm).toBe(7);\n  });\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("positioning test insertion marker missing")
          test_path.write_text(text.replace(marker, insertion + marker, 1))

          Path(".github/workflows/fix-letter-recipient-sync-once.yml").unlink()
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format touched files
        run: bunx prettier --write src/lib/dossier-chrome.ts tests/unit/dossier-chrome-positioning.test.ts

      - name: Unit tests
        run: bun test tests/unit

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add -A
          git commit -m "Keep letter recipient position independent of CV sync"
          git push origin HEAD:templateFIX
