name: One-off PDF regression test patch v2

on:
  push:
    branches:
      - fix/pdf-richtext-collision-20260917-v6

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-richtext-collision-20260917-v6
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Patch test
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_pdf_test.py
          python /tmp/patch_pdf_test.py
          bunx prettier --write tests/e2e/letter-pdf-richtext.spec.ts
      - name: Remove one-off patcher and commit
        shell: bash
        run: |
          rm .github/workflows/patch-pdf-richtext-test-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/letter-pdf-richtext.spec.ts .github/workflows/patch-pdf-richtext-test-v2.yml
          git commit -m "test(pdf): use dossier action menu for combined export"
          git push origin HEAD:fix/pdf-richtext-collision-20260917-v6
