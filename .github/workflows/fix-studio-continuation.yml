name: Fix Studio continuation

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-studio-continuation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply Studio continuation fix
        run: python .github/scripts/fix-studio-continuation.py

      - name: Format touched sources
        run: npx prettier --write src/components/dossier/DossierSheetBackground.tsx tests/unit/dossier-sheet-background.test.tsx

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep studio continuation band above content"
          git push origin dev
