name: Dossier Regression

on:
  push:
    # Keep the render branch under the same visual regression guard before promotion.
    branches:
      - dev
      - render
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: dossier-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish regression pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"M5.8 Regression","description":"Dossier regression suite is running","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      # Browser tooling is CI-only on purpose: no Playwright dependency or lockfile
      # churn in the application itself.
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Unit regressions
        run: bun test tests/unit

      # The repository already contained unrelated Prettier drift before M5.
      # Normalize the runner copy so ESLint can focus on semantic/rule failures.
      - name: Normalize source formatting
        run: bunx prettier --write "src/**/*.{ts,tsx,css}" "tests/**/*.{ts,tsx}"

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/lebenslauf > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Browser and PDF regressions
        run: >-
          npx playwright test
          tests/e2e/dossier-regression.spec.ts
          tests/e2e/dossier-font-sync.spec.ts
          tests/e2e/element-ratio-lock.spec.ts
          tests/e2e/cv-edge-smoke.spec.ts
          tests/e2e/cover-edge-smoke.spec.ts
          tests/e2e/template-cleanup.spec.ts
          tests/e2e/fresh-dossier-templates.spec.ts
          tests/e2e/gradient-edge-smoke.spec.ts
          tests/e2e/cv-card-refresh.spec.ts
          tests/e2e/cv-pdf-text.spec.ts
          --reporter=line --workers=1

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then
            kill "$(cat /tmp/cv-cover-charm.pid)" || true
          fi

      - name: Publish regression success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"success","context":"M5.8 Regression","description":"Unit, lint, build, browser, smoke and PDF regressions passed","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Publish regression failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"failure","context":"M5.8 Regression","description":"One or more dossier regression checks failed","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
