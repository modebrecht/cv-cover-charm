name: Dossier Regression

on:
  push:
    # Keep the release candidate, dev, render and production main under the same regression guard.
    branches:
      - letter-m1-m2
      - dev
      - render
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  statuses: write

concurrency:
  group: dossier-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m6-source-fix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/letter-m1-m2'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: letter-m1-m2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact M6 type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          background = Path("src/components/dossier/DossierSheetBackground.tsx")
          text = background.read_text()
          old = '''          {template === "edel" && (
            <div
              className="absolute"
              style={{
                inset: `${layout.borderInsetMm + 3}mm`,
                border: `0.35px solid ${accent}`,
                opacity: 0.28,
              }}
            />
          )}
'''
          assert text.count(old) == 1, "Expected exactly one unreachable edel block"
          background.write_text(text.replace(old, "", 1))

          cv = Path("src/routes/lebenslauf.tsx")
          text = cv.read_text()
          old = '                            {key === "elements" && cover && ` · ${cover.elements.length} im Titelblatt`}\n'
          assert text.count(old) == 1, "Expected exactly one stale elements hint"
          cv.write_text(text.replace(old, "", 1))

          cover = Path("src/routes/titelblatt.tsx")
          text = cover.read_text()
          old_elements = '        elements: customs.filter((item) => customKind(item) !== "text"),\n'
          assert text.count(old_elements) == 1, "Expected exactly one non-transferable elements fingerprint field"
          text = text.replace(old_elements, "", 1)
          old_deps = '    [colors, customs, data, documentFont, fontScale, photoBlock?.style, template],\n'
          new_deps = '    [colors, data, documentFont, fontScale, photoBlock?.style, template],\n'
          assert text.count(old_deps) == 1, "Expected exactly one fingerprint dependency list"
          cover.write_text(text.replace(old_deps, new_deps, 1))
          PY

          git diff --check

      - name: Verify TypeScript
        run: bun run typecheck

      - name: Verify unit regressions
        run: bun test tests/unit

      - name: Remove temporary helper workflow
        run: git rm -f .github/workflows/m6-type-fix.yml

      - name: Commit verified source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dossier/DossierSheetBackground.tsx src/routes/lebenslauf.tsx src/routes/titelblatt.tsx .github/workflows/m6-type-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(m6): resolve typecheck inconsistencies"
          git push origin HEAD:letter-m1-m2

  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish regression pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"M6 Release Candidate","description":"Release-candidate regression suite is running","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Unit regressions
        run: bun test tests/unit

      - name: Check release formatting
        run: bun run format:check:release

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

  browser-regressions:
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: dossier-flow
            files: >-
              tests/e2e/dossier-regression.spec.ts
              tests/e2e/dossier-transfer-regression.spec.ts
              tests/e2e/dossier-font-sync.spec.ts
              tests/e2e/dossier-typography-regression.spec.ts
              tests/e2e/dossier-letter-preflight.spec.ts
          - group: letter-m1-m5
            files: >-
              tests/e2e/letter-header-modes.spec.ts
              tests/e2e/letter-final-qa.spec.ts
          - group: cv-pdf
            files: >-
              tests/e2e/element-ratio-lock.spec.ts
              tests/e2e/cv-edge-smoke.spec.ts
              tests/e2e/cv-card-refresh.spec.ts
              tests/e2e/cv-pdf-text.spec.ts
          - group: templates-layout
            files: >-
              tests/e2e/cover-edge-smoke.spec.ts
              tests/e2e/template-cleanup.spec.ts
              tests/e2e/fresh-dossier-templates.spec.ts
              tests/e2e/gradient-edge-smoke.spec.ts

    name: Browser smoke - ${{ matrix.group }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/lebenslauf > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Run ${{ matrix.group }} regressions
        run: npx playwright test ${{ matrix.files }} --reporter=line --workers=1

      - name: Upload M5 letter visual gallery
        if: matrix.group == 'letter-m1-m5' && always()
        uses: actions/upload-artifact@v4
        with:
          name: letter-m5-visual-gallery
          path: artifacts/letter-final-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then
            kill "$(cat /tmp/cv-cover-charm.pid)" || true
          fi

  publish-regression-status:
    if: always()
    needs:
      - fast-checks
      - browser-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Publish final regression status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAST_RESULT: ${{ needs.fast-checks.result }}
          BROWSER_RESULT: ${{ needs.browser-regressions.result }}
        shell: bash
        run: |
          if [ "$FAST_RESULT" = "success" ] && [ "$BROWSER_RESULT" = "success" ]; then
            state="success"
            description="Unit, format, typecheck, lint, build and browser/PDF smokes passed"
          else
            state="failure"
            description="One or more release-candidate checks failed"
          fi

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"M6 Release Candidate\",\"description\":\"$description\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

          test "$state" = "success"
