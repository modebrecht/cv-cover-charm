name: Temporary local letter fonts

on:
  push:
    branches:
      - tmp-letter-context-font-sizes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-letter-context-font-sizes
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: |
          python scripts/tmp-letter-local-fonts.py
          python scripts/tmp-letter-local-fonts-fix.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused tests
        run: bun test tests/unit/letter-context-font-sizes.test.ts tests/unit/letter-context-font-families.test.ts tests/unit/letter-body-font-size.test.ts
      - name: Build
        run: bun run build
      - name: Commit tested tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "feat(letter): move font controls into content sections"
          git push origin HEAD:tmp-letter-context-font-sizes
