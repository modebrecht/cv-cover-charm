name: Fix Cabin PDF.js cleanup

on:
  push:
    branches:
      - feature/cabin-dossier-font

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cabin-dossier-font
      - name: Fix PDF.js helper and stale test wording
        run: |
          python3 <<'PY'
          from pathlib import Path

          pdf_test = Path('tests/e2e/cv-pdf-text.spec.ts')
          text = pdf_test.read_text()
          old = '''  const pages: string[] = [];
  try {
    for (let pageNumber = 1; pageNumber <= document.numPages; pageNumber += 1) {
      const pdfPage = await document.getPage(pageNumber);
      const content = await pdfPage.getTextContent();
      pages.push(
        content.items
          .map((item) => ("str" in item ? item.str : ""))
          .filter(Boolean)
          .join(" "),
      );
    }
  } finally {
    await document.destroy();
  }
  return pages;'''
          new = '''  const pages: string[] = [];
  for (let pageNumber = 1; pageNumber <= document.numPages; pageNumber += 1) {
    const pdfPage = await document.getPage(pageNumber);
    const content = await pdfPage.getTextContent();
    pages.push(
      content.items
        .map((item) => ("str" in item ? item.str : ""))
        .filter(Boolean)
        .join(" "),
    );
  }
  return pages;'''
          if old not in text:
              raise SystemExit('PDF.js cleanup block not found')
          pdf_test.write_text(text.replace(old, new, 1))

          unit_test = Path('tests/unit/dossier-font-sync.test.ts')
          text = unit_test.read_text()
          old = 'uses Trebuchet as the new-dossier default while preserving saved font choices'
          if old not in text:
              raise SystemExit('stale Trebuchet test title not found')
          unit_test.write_text(text.replace(old, 'uses Cabin as the new-dossier default while preserving saved font choices', 1))
          PY
          rm .github/workflows/fix-cabin-pdfjs-cleanup.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/fix-cabin-pdfjs-cleanup.yml
          git commit -m 'Fix Cabin PDF text extraction cleanup'
          git push origin HEAD:feature/cabin-dossier-font
