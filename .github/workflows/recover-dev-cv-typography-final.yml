name: Recover dev CV typography final gate

on:
  push:
    branches:
      - recover-dev-cv-typography
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch native regression and PDF gallery on exact branch head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for workflow in dossier-regression.yml dossier-pdf-gallery.yml; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"recover-dev-cv-typography"}'
          done
