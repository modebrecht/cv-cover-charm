name: Align letter with CV background

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/align-letter-with-cv-background.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply CV-led dossier geometry
        run: python .github/scripts/align-letter-with-cv-background.py

      - name: Format changed sources
        run: npx prettier --write src/components/dossier/DossierSheetBackground.tsx src/components/cv/CvCanvas.tsx tests/unit/dossier-sheet-background.test.tsx tests/unit/cover-decorations.test.ts

      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align dossier sheets to cv geometry"
          git push origin dev
