name: Letter Image Text Flow Patch

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/letter-image-flow-patch.yml
      - .github/scripts/letter-image-flow-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply letter image text flow
        run: python .github/scripts/letter-image-flow-patch.py

      - name: Commit image text flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/letter src/routes/anschreiben.tsx tests/e2e/dossier-transfer-regression.spec.ts
          git commit -m "feat: wrap letter text around free images"
          git push origin HEAD:dev
