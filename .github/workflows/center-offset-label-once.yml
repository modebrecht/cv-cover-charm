name: Clarify centered offset default once

on:
  push:
    branches:
      - templateFIX
    paths:
      - .github/workflows/center-offset-label-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: templateFIX
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Clarify centered default in UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/dossier/DossierChromeControls.tsx')
          s = p.read_text()
          old = '''        <span>\n          {value > 0 ? "+" : ""}\n          {value.toFixed(value % 1 ? 1 : 0)} mm\n        </span>'''
          new = '''        <span>\n          {value === 0\n            ? "0 mm · zentriert"\n            : `${value > 0 ? "+" : ""}${value.toFixed(value % 1 ? 1 : 0)} mm`}\n        </span>'''
          assert old in s, 'offset value UI block not found'
          s = s.replace(old, new, 1)
          assert '          Standardposition\n' in s, 'reset label not found'
          s = s.replace('          Standardposition\n', '          Zentrierte Standardposition\n', 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bunx prettier --write src/components/dossier/DossierChromeControls.tsx
      - name: Unit tests
        run: bun test tests/unit
      - name: Typecheck
        run: bun run typecheck
      - name: Verify copy
        run: |
          grep -q '0 mm · zentriert' src/components/dossier/DossierChromeControls.tsx
          grep -q 'Zentrierte Standardposition' src/components/dossier/DossierChromeControls.tsx
      - name: Commit UI copy
        run: |
          rm .github/workflows/center-offset-label-once.yml
          git config user.name modebrecht
          git config user.email '137332207+modebrecht@users.noreply.github.com'
          git add src/components/dossier/DossierChromeControls.tsx .github/workflows/center-offset-label-once.yml
          git commit -m 'Clarify centered vertical offset default'
          git push origin HEAD:templateFIX
