name: One-off cleanup temporary PDF branches

on:
  push:
    branches:
      - fix/pdf-richtext-collision-20260917-v6

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-richtext-collision-20260917-v6
          fetch-depth: 0
      - name: Delete temporary branches
        shell: bash
        run: |
          git push origin --delete \
            fix/pdf-richtext-wrap-collision \
            fix/pdf-richtext-wrap-collision-v2 \
            fix/pdf-richtext-wrap-collision-final \
            fix/pdf-richtext-wrap-collision-final2 \
            fix/pdf-richtext-wrap-collision-final3 \
            fix/pdf-richtext-wrap-collision-final4 \
            fix/pdf-richtext-wrap-collision-final5 \
            fix/pdf-richtext-wrap-collision-final6 \
            fix/pdf-richtext-collision-20260917 \
            fix/pdf-richtext-collision-20260917-v2 \
            fix/pdf-richtext-collision-20260917-v3 \
            fix/pdf-richtext-collision-20260917-v4 \
            fix/pdf-richtext-collision-20260917-v5
      - name: Remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/cleanup-temp-pdf-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cleanup-temp-pdf-branches.yml
          git commit -m "chore(pdf): remove temporary branch cleanup workflow"
          git push origin HEAD:fix/pdf-richtext-collision-20260917-v6
