name: One-time Motivationsschreiben UI

on:
  push:
    branches:
      - feature/anschreiben-dossier
    paths:
      - .github/workflows/one-time-motivationsschreiben-ui.yml

permissions:
  contents: write

jobs:
  rename-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anschreiben-dossier

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply UI terminology migration
        run: python scripts/one-time-motivationsschreiben-ui.py

      - name: Ensure old UI term is gone from source
        run: |
          if git grep -n "Bewerbungsbrief" -- src; then
            echo "Old UI term still exists in src"
            exit 1
          fi

      - name: Format touched files
        run: >-
          bunx prettier --write
          src/routes/anschreiben.tsx
          src/components/letter/LetterCanvas.tsx
          src/routes/index.tsx
          src/components/dossier/DossierExportDialog.tsx
          src/routes/titelblatt.tsx
          src/routes/lebenslauf.tsx
          tests/e2e/dossier-regression.spec.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Unit tests
        run: bun test tests/unit

      - name: Lint touched files
        run: >-
          bunx eslint
          src/routes/anschreiben.tsx
          src/components/letter/LetterCanvas.tsx
          src/routes/index.tsx
          src/components/dossier/DossierExportDialog.tsx
          src/routes/titelblatt.tsx
          src/routes/lebenslauf.tsx
          tests/e2e/dossier-regression.spec.ts

      - name: Production build
        run: bun run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Run dossier regression suite
        run: npx playwright test tests/e2e/dossier-regression.spec.ts --reporter=line --workers=1

      - name: Show app log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Commit passing terminology update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-motivationsschreiben-ui.yml scripts/one-time-motivationsschreiben-ui.py
          git add \
            src/routes/anschreiben.tsx \
            src/components/letter/LetterCanvas.tsx \
            src/routes/index.tsx \
            src/components/dossier/DossierExportDialog.tsx \
            src/routes/titelblatt.tsx \
            src/routes/lebenslauf.tsx \
            tests/e2e/dossier-regression.spec.ts
          git diff --cached --check
          git commit -m "Use Motivationsschreiben throughout the UI"
          git push origin HEAD:feature/anschreiben-dossier

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
