name: Theme Visual QA

on:
  push:
    branches:
      - qa/theme-visual-20260924

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/theme-qa-app.log 2>&1 &
          echo $! > /tmp/theme-qa-app.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/theme-qa-app.log
          exit 1
      - name: Capture light grey dark matrix
        shell: bash
        run: |
          mkdir -p artifacts/theme-visual-qa
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('@playwright/test');

          const themes = ['light', 'grey', 'dark'];
          const routes = [
            ['dashboard', '/'],
            ['titelblatt', '/titelblatt'],
            ['anschreiben', '/anschreiben'],
            ['lebenslauf', '/lebenslauf'],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const manifest = [];
            for (const theme of themes) {
              for (const [name, route] of routes) {
                const context = await browser.newContext({
                  viewport: { width: 1440, height: 1000 },
                  deviceScaleFactor: 1,
                  reducedMotion: 'reduce',
                });
                const page = await context.newPage();
                await page.addInitScript((value) => localStorage.setItem('theme', value), theme);
                await page.goto(`http://127.0.0.1:4173${route}`, { waitUntil: 'networkidle' });
                await page.waitForTimeout(350);

                const state = await page.evaluate(() => ({
                  mode: document.documentElement.dataset.themeMode,
                  classes: document.documentElement.className,
                  bodyBackground: getComputedStyle(document.body).backgroundColor,
                  bodyColor: getComputedStyle(document.body).color,
                }));
                if (state.mode !== theme) throw new Error(`${route}: expected ${theme}, got ${state.mode}`);
                if (theme === 'dark' && !state.classes.includes('dark')) throw new Error(`${route}: missing dark class`);
                if (theme === 'grey' && !state.classes.includes('grey')) throw new Error(`${route}: missing grey class`);
                if (theme === 'light' && /(dark|grey)/.test(state.classes)) throw new Error(`${route}: light retained theme class ${state.classes}`);
                if (state.classes.includes('dark') && state.classes.includes('grey')) throw new Error(`${route}: competing theme classes`);

                const top = `artifacts/theme-visual-qa/${theme}-${name}-top.png`;
                await page.screenshot({ path: top, fullPage: false });
                manifest.push({ theme, name, route, view: 'top', file: top, ...state });

                if (name !== 'dashboard') {
                  await page.evaluate(() => window.scrollTo(0, 760));
                  await page.waitForTimeout(250);
                  const scrollY = await page.evaluate(() => window.scrollY);
                  const scrolled = `artifacts/theme-visual-qa/${theme}-${name}-scroll.png`;
                  await page.screenshot({ path: scrolled, fullPage: false });
                  const stickyVisible = await page.locator('[data-editor-form-toolbar]').count().catch(() => 0);
                  manifest.push({ theme, name, route, view: 'scroll', file: scrolled, scrollY, stickyVisible });
                }
                await context.close();
              }
            }
            fs.writeFileSync('artifacts/theme-visual-qa/manifest.json', JSON.stringify(manifest, null, 2));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload theme QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: theme-visual-qa
          path: artifacts/theme-visual-qa
          if-no-files-found: error
          retention-days: 2
      - name: App log on failure
        if: failure()
        run: cat /tmp/theme-qa-app.log || true
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/theme-qa-app.pid ]; then kill "$(cat /tmp/theme-qa-app.pid)" || true; fi
