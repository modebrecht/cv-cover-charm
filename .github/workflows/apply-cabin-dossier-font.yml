name: Apply Cabin dossier font

on:
  push:
    branches:
      - feature/cabin-dossier-font
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cabin-dossier-font
          fetch-depth: 0
      - name: Apply Cabin preview and PDF integration
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual == 0:
                  raise SystemExit(f'missing pattern in {path}: {old[:100]!r}')
              if count is not None and actual != count:
                  raise SystemExit(f'unexpected count in {path}: {actual} != {count}')
              p.write_text(text.replace(old, new))

          styles = Path('src/styles.css')
          text = styles.read_text()
          font_faces = '''@font-face {
            font-family: "Cabin";
            src: url("/fonts/Cabin-Regular.ttf") format("truetype");
            font-style: normal;
            font-weight: 400 500;
            font-display: swap;
          }

          @font-face {
            font-family: "Cabin";
            src: url("/fonts/Cabin-Bold.ttf") format("truetype");
            font-style: normal;
            font-weight: 600 900;
            font-display: swap;
          }

          @font-face {
            font-family: "Cabin";
            src: url("/fonts/Cabin-Italic.ttf") format("truetype");
            font-style: italic;
            font-weight: 400 500;
            font-display: swap;
          }

          @font-face {
            font-family: "Cabin";
            src: url("/fonts/Cabin-BoldItalic.ttf") format("truetype");
            font-style: italic;
            font-weight: 600 900;
            font-display: swap;
          }

          '''
          if 'font-family: "Cabin";' not in text:
              styles.write_text(font_faces + text)

          types = Path('src/components/cover/types.ts')
          t = types.read_text()
          t = t.replace(
              "freundlich: \"'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif\",",
              "freundlich: \"Cabin, 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif\",",
          )
          t = t.replace('freundlich: "Trebuchet",', 'freundlich: "Cabin",')
          t = t.replace(
              ' * Nur Systemschriften.\n *\n * Der PDF-Export fotografiert das, was der Browser zeichnet – eine\n * nachzuladende Webschrift wäre beim Export womöglich noch nicht da und das\n * Blatt käme in der Ersatzschrift heraus. Jeder Eintrag hat darum eine Kette\n * von Alternativen für Windows, macOS und Linux.',
              ' * Dossier-Schriften. Cabin wird lokal aus `public/fonts` geladen und ist\n * zugleich die eingebettete PDF-Standardschrift. Die übrigen Einträge behalten\n * System-Fallbacks für bestehende gespeicherte Schriftwahlen.',
          )
          types.write_text(t)

          pdf_fonts = Path('src/lib/pdf-fonts.ts')
          pdf_fonts.write_text('''import type { jsPDF as JsPdf } from "jspdf";

          type PdfFontStyle = "normal" | "bold" | "italic" | "bolditalic";

          const CABIN_FILES: Array<{ file: string; style: PdfFontStyle }> = [
            { file: "Cabin-Regular.ttf", style: "normal" },
            { file: "Cabin-Bold.ttf", style: "bold" },
            { file: "Cabin-Italic.ttf", style: "italic" },
            { file: "Cabin-BoldItalic.ttf", style: "bolditalic" },
          ];

          const fontData = new Map<string, Promise<string>>();

          function arrayBufferToBase64(buffer: ArrayBuffer): string {
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            let binary = "";
            for (let offset = 0; offset < bytes.length; offset += chunkSize) {
              binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
            }
            return btoa(binary);
          }

          async function loadFont(file: string): Promise<string> {
            let pending = fontData.get(file);
            if (!pending) {
              pending = fetch(`/fonts/${file}`).then(async (response) => {
                if (!response.ok) throw new Error(`Cabin font could not be loaded: ${file}`);
                return arrayBufferToBase64(await response.arrayBuffer());
              });
              fontData.set(file, pending);
            }
            return pending;
          }

          /** Register the locally bundled Cabin family on one jsPDF instance. */
          export async function registerCabinPdfFonts(pdf: JsPdf): Promise<void> {
            const fonts = await Promise.all(
              CABIN_FILES.map(async ({ file, style }) => ({ file, style, data: await loadFont(file) })),
            );
            for (const { file, style, data } of fonts) {
              pdf.addFileToVFS(file, data);
              pdf.addFont(file, "Cabin", style);
            }
          }
          ''')

          replace(
              'src/lib/cv-pdf-text.ts',
              'type PdfFont = "helvetica" | "times" | "courier";',
              'type PdfFont = "helvetica" | "times" | "courier" | "Cabin";',
              1,
          )
          replace(
              'src/lib/cv-pdf-text.ts',
              '  const family = style.fontFamily.toLowerCase();\n',
              '  const family = style.fontFamily.toLowerCase();\n  if (family.includes("cabin")) return "Cabin";\n',
              1,
          )

          dossier = Path('src/lib/dossier-pdf.ts')
          d = dossier.read_text()
          if 'registerCabinPdfFonts' not in d:
              d = d.replace(
                  'import { downloadBlob } from "@/lib/download";\n',
                  'import { downloadBlob } from "@/lib/download";\nimport { registerCabinPdfFonts } from "@/lib/pdf-fonts";\n',
              )
          d = d.replace(
              'type PdfFont = "helvetica" | "times" | "courier";',
              'type PdfFont = "helvetica" | "times" | "courier" | "Cabin";',
          )
          d = d.replace(
              '  const font = page.dataset.letterFont;\n  if (font === "serif" || font === "times") return "times";',
              '  const font = page.dataset.letterFont;\n  if (font === "freundlich") return "Cabin";\n  if (font === "serif" || font === "times") return "times";',
          )
          marker = '  const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });\n'
          if d.count(marker) != 2:
              raise SystemExit(f'unexpected jsPDF constructor count in dossier-pdf.ts: {d.count(marker)}')
          d = d.replace(marker, marker + '  await registerCabinPdfFonts(pdf);\n')
          dossier.write_text(d)

          route = Path('src/routes/lebenslauf.tsx')
          r = route.read_text()
          if 'registerCabinPdfFonts' not in r:
              r = r.replace(
                  'import { downloadCombinedDossierPdf } from "@/lib/dossier-pdf";\n',
                  'import { downloadCombinedDossierPdf } from "@/lib/dossier-pdf";\nimport { registerCabinPdfFonts } from "@/lib/pdf-fonts";\n',
              )
          constructor = '      const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });\n'
          if r.count(constructor) != 1:
              raise SystemExit(f'unexpected standalone CV jsPDF constructor count: {r.count(constructor)}')
          r = r.replace(constructor, constructor + '      await registerCabinPdfFonts(pdf);\n')
          route.write_text(r)

          cv_test = Path('tests/e2e/cv-pdf-text.spec.ts')
          c = cv_test.read_text()
          c = c.replace(
              '      bgOpacity: 0.25,\n      useElements: false,',
              '      font: "freundlich",\n      bgOpacity: 0.25,\n      useElements: false,',
              1,
          )
          c = c.replace('      font: "sans",', '      font: "freundlich",')
          c = c.replace(
              '    expect(pdfSource).toContain("Volleyball");',
              '    expect(pdfSource).toContain("Volleyball");\n    expect(pdfSource).toContain("Cabin");',
              1,
          )
          c = c.replace(
              '    expect(letterIndex).toBeLessThan(cvIndex);',
              '    expect(letterIndex).toBeLessThan(cvIndex);\n    expect(pdfSource).toContain("Cabin");',
              1,
          )
          cv_test.write_text(c)

          sync_test = Path('tests/e2e/dossier-font-sync.spec.ts')
          s = sync_test.read_text()
          insertion = '''\n  test("new CV and letter previews use Cabin as the default dossier family", async ({ page }) => {\n    await page.goto(`${BASE_URL}/anschreiben`, { waitUntil: "domcontentloaded" });\n    await page.evaluate(() => localStorage.clear());\n    await page.reload({ waitUntil: "domcontentloaded" });\n\n    const letterPage = page.locator("[data-letter-page]").first();\n    await expect(letterPage).toHaveAttribute("data-letter-font", "freundlich");\n    await expect\n      .poll(() => letterPage.evaluate((element) => getComputedStyle(element).fontFamily))\n      .toContain("Cabin");\n\n    await page.goto(`${BASE_URL}/lebenslauf`, { waitUntil: "domcontentloaded" });\n    const cvPage = page.locator('[data-dossier-document="cv"] [data-cv-page]').first();\n    await expect\n      .poll(() => cvPage.evaluate((element) => getComputedStyle(element).getPropertyValue("--dossier-font")))\n      .toContain("Cabin");\n  });\n'''
          if 'new CV and letter previews use Cabin' not in s:
              s = s.replace('\n});\n', insertion + '\n});\n')
          sync_test.write_text(s)
          PY
          rm .github/workflows/apply-cabin-dossier-font.yml
      - name: Commit Cabin integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows/apply-cabin-dossier-font.yml
          git commit -m 'Use Cabin across dossier preview and PDF text'
          git push origin HEAD:feature/cabin-dossier-font
