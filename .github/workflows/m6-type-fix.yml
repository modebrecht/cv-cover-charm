name: M6 Type Fix

on:
  push:
    branches:
      - letter-m1-m2
    paths:
      - .github/workflows/m6-type-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: letter-m1-m2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          background = Path("src/components/dossier/DossierSheetBackground.tsx")
          lines = background.read_text().splitlines(keepends=True)
          marker = '          {template === "edel" && (\n'
          starts = [index for index, line in enumerate(lines) if line == marker]
          assert len(starts) == 1, f"Expected one unreachable edel block, found {len(starts)}"
          start = starts[0]
          end = next(index for index in range(start + 1, len(lines)) if lines[index] == '          )}\n')
          del lines[start : end + 1]
          background.write_text(''.join(lines))

          cv = Path("src/routes/lebenslauf.tsx")
          lines = cv.read_text().splitlines(keepends=True)
          matches = [index for index, line in enumerate(lines) if 'key === "elements" && cover' in line]
          assert len(matches) == 1, f"Expected one stale elements hint, found {len(matches)}"
          del lines[matches[0]]
          cv.write_text(''.join(lines))

          cover = Path("src/routes/titelblatt.tsx")
          lines = cover.read_text().splitlines(keepends=True)
          element_matches = [index for index, line in enumerate(lines) if 'elements: customs.filter((item) => customKind(item) !== "text")' in line]
          assert len(element_matches) == 1, f"Expected one fingerprint elements field, found {len(element_matches)}"
          del lines[element_matches[0]]
          dependency_matches = [index for index, line in enumerate(lines) if '[colors, customs, data, documentFont, fontScale, photoBlock?.style, template]' in line]
          assert len(dependency_matches) == 1, f"Expected one fingerprint dependency list, found {len(dependency_matches)}"
          index = dependency_matches[0]
          lines[index] = lines[index].replace('[colors, customs, data', '[colors, data')
          cover.write_text(''.join(lines))
          PY

          git diff --check

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Unit regressions
        run: bun test tests/unit

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m6-type-fix.yml
          git add src/components/dossier/DossierSheetBackground.tsx src/routes/lebenslauf.tsx src/routes/titelblatt.tsx
          git commit -m "fix(m6): resolve baseline typecheck inconsistencies"
          git push origin HEAD:letter-m1-m2
