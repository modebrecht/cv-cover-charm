name: M6 Type Fix

on:
  push:
    branches:
      - letter-m1-m2
    paths:
      - .github/workflows/m6-type-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          background = Path("src/components/dossier/DossierSheetBackground.tsx")
          text = background.read_text()
          old = '''          {template === "edel" && (
            <div
              className="absolute"
              style={{
                inset: `${layout.borderInsetMm + 3}mm`,
                border: `0.35px solid ${accent}`,
                opacity: 0.28,
              }}
            />
          )}
'''
          assert old in text, "Expected unreachable edel block not found"
          background.write_text(text.replace(old, "", 1))

          cv = Path("src/routes/lebenslauf.tsx")
          text = cv.read_text()
          old = '                            {key === "elements" && cover && ` · ${cover.elements.length} im Titelblatt`}\n'
          assert old in text, "Expected stale elements hint not found"
          cv.write_text(text.replace(old, "", 1))

          cover = Path("src/routes/titelblatt.tsx")
          text = cover.read_text()
          old_elements = '        elements: customs.filter((item) => customKind(item) !== "text"),\n'
          assert old_elements in text, "Expected non-transferable elements fingerprint field not found"
          text = text.replace(old_elements, "", 1)
          old_deps = '    [colors, customs, data, documentFont, fontScale, photoBlock?.style, template],\n'
          new_deps = '    [colors, data, documentFont, fontScale, photoBlock?.style, template],\n'
          assert old_deps in text, "Expected fingerprint dependency list not found"
          cover.write_text(text.replace(old_deps, new_deps, 1))
          PY

          git diff --check

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Unit regressions
        run: bun test tests/unit

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dossier/DossierSheetBackground.tsx src/routes/lebenslauf.tsx src/routes/titelblatt.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(m6): resolve typecheck inconsistencies"
          git push origin HEAD:letter-m1-m2
