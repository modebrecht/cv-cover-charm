name: Mount CV chrome UI once

on:
  push:
    branches:
      - templateFIX

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mount shared chrome controls in CV editor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- old ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          path = "src/routes/lebenslauf.tsx"
          replace_once(
              path,
              'import { EditorMenuLabel } from "@/components/dossier/EditorMenuLabel";\n',
              'import { EditorMenuLabel } from "@/components/dossier/EditorMenuLabel";\nimport { DossierChromeControls } from "@/components/dossier/DossierChromeControls";\n',
          )
          replace_once(
              path,
              '''    vorlage: false,\n    farben: false,''',
              '''    vorlage: false,\n    chrome: false,\n    farben: false,''',
          )
          replace_once(
              path,
              '''              </Section>\n\n              <Section\n                title="Farben"''',
              '''              </Section>\n\n              <Section\n                title="Header & Footer"\n                open={open.chrome}\n                onToggle={() => toggle("chrome")}\n              >\n                <DossierChromeControls scope="cv" />\n              </Section>\n\n              <Section\n                title="Farben"''',
          )

          path = "tests/unit/dossier-chrome-positioning.test.ts"
          p = Path(path)
          text = p.read_text()
          marker = '''const letter = readFileSync(\n  new URL("../../src/components/letter/LetterCanvas.tsx", import.meta.url),\n  "utf8",\n);\n'''
          replacement = marker + '''const cvRoute = readFileSync(\n  new URL("../../src/routes/lebenslauf.tsx", import.meta.url),\n  "utf8",\n);\nconst letterRoute = readFileSync(\n  new URL("../../src/routes/anschreiben.tsx", import.meta.url),\n  "utf8",\n);\n'''
          if marker not in text:
              raise SystemExit("test read marker missing")
          text = text.replace(marker, replacement, 1)
          end_marker = '''  test("renderers move content rather than header/footer surfaces", () => {\n'''
          test_block = '''  test("both editors expose their vertical-position controls in the visible UI", () => {\n    expect(letterRoute).toContain("<LetterLayoutControls");\n    expect(cvRoute).toContain('import { DossierChromeControls } from "@/components/dossier/DossierChromeControls";');\n    expect(cvRoute).toContain('title="Header & Footer"');\n    expect(cvRoute).toContain('<DossierChromeControls scope="cv" />');\n  });\n\n'''
          if end_marker not in text:
              raise SystemExit("test insertion marker missing")
          p.write_text(text.replace(end_marker, test_block + end_marker, 1))

          Path(".github/workflows/mount-cv-chrome-ui-once.yml").unlink()
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format touched files
        run: bunx prettier --write src/routes/lebenslauf.tsx tests/unit/dossier-chrome-positioning.test.ts

      - name: Unit tests
        run: bun test tests/unit

      - name: Typecheck
        run: bun run typecheck

      - name: Lint touched surface
        run: bunx eslint src/routes/lebenslauf.tsx tests/unit/dossier-chrome-positioning.test.ts

      - name: Production build
        run: bun run build

      - name: Commit CV UI mount
        shell: bash
        run: |
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add src/routes/lebenslauf.tsx tests/unit/dossier-chrome-positioning.test.ts .github/workflows/mount-cv-chrome-ui-once.yml
          git commit -m "Expose dossier chrome controls in CV editor"
          git push origin HEAD:templateFIX
