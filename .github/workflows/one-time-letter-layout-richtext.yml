name: One-time letter layout and rich text

on:
  push:
    branches:
      - feature/anschreiben-layout-richtext

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anschreiben-layout-richtext
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch letter canvas and editor route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/letter/LetterCanvas.tsx')
          text = path.read_text()
          old = 'import type { LetterData, LetterDesign } from "./types";\n'
          new = 'import type { LetterData, LetterDesign } from "./types";\nimport { letterRichHtml, plainTextToRichHtml } from "./rich-text";\n'
          assert old in text
          text = text.replace(old, new, 1)

          start = text.index('function Lines({')
          tail = r'''function Lines({
            values,
            align = "left",
          }: {
            values: Array<string | undefined>;
            align?: "left" | "right";
          }) {
            const visible = values.filter((value): value is string => !!value?.trim());
            if (!visible.length) return null;
            return (
              <div style={{ textAlign: align }}>
                {visible.map((value, index) => (
                  <div key={`${value}-${index}`}>{value}</div>
                ))}
              </div>
            );
          }

          function Separator({ color, marker }: { color: string; marker: string }) {
            return (
              <hr
                data-letter-pdf-rule={marker}
                className="my-[4mm] border-0 border-t"
                style={{ borderColor: color, opacity: 0.72 }}
              />
            );
          }

          export function LetterCanvas({
            data,
            design,
            exportMode = false,
          }: {
            data: LetterData;
            design: LetterDesign;
            exportMode?: boolean;
          }) {
            const layout = layoutFor(design.template);
            const palette = cvPalette(design.colors);
            const fontFamily = FONT_STACKS[design.font];
            const senderAlign = design.senderAlign ?? "left";
            const recipientAlign = design.recipientAlign ?? "left";
            const dateAlign = design.dateAlign ?? "left";
            const placeholder =
              "Hier entsteht dein persönliches Anschreiben. Erkläre, weshalb du dich für diesen Beruf und diesen Lehrbetrieb interessierst und was du mitbringst.";
            const bodyHtml = data.richTextHtml?.trim()
              ? letterRichHtml(data.richTextHtml, data.text)
              : data.text
                ? plainTextToRichHtml(data.text)
                : exportMode
                  ? ""
                  : plainTextToRichHtml(placeholder);

            return (
              <article
                data-letter-page
                data-letter-font={design.font}
                className="relative h-[1123px] w-[794px] overflow-hidden shadow-xl"
                style={{ color: palette.ink, fontFamily, backgroundColor: palette.paper }}
                aria-label="Vorschau Anschreiben"
              >
                <LetterBackground design={design} />
                <div
                  data-letter-text-layer
                  className="absolute flex flex-col"
                  style={{
                    left: `${layout.left}mm`,
                    right: `${layout.right}mm`,
                    top: `${layout.top}mm`,
                    bottom: `${layout.bottom}mm`,
                    fontSize: "10.5pt",
                    lineHeight: 1.48,
                  }}
                >
                  <div
                    data-letter-section="sender"
                    className="text-[9.5pt] leading-[1.45]"
                    style={{ textAlign: senderAlign }}
                  >
                    <div data-letter-pdf-text="sender">
                      <Lines
                        values={[
                          data.absenderName,
                          data.absenderAdresse,
                          data.absenderPlzOrt,
                          data.absenderTelefon,
                          data.absenderEmail,
                        ]}
                        align={senderAlign}
                      />
                    </div>
                  </div>

                  {design.ruleAfterSender ? <Separator color={palette.accent} marker="sender" /> : null}

                  <div
                    data-letter-section="recipient"
                    className="mt-[6mm] min-h-[24mm] text-[10pt] leading-[1.45]"
                    style={{ textAlign: recipientAlign }}
                  >
                    <div data-letter-pdf-text="recipient">
                      <Lines
                        values={[
                          data.empfaengerFirma,
                          data.empfaengerName,
                          data.empfaengerAdresse,
                          data.empfaengerPlzOrt,
                        ]}
                        align={recipientAlign}
                      />
                    </div>
                  </div>

                  {design.ruleAfterRecipient ? (
                    <Separator color={palette.accent} marker="recipient" />
                  ) : null}

                  <div
                    data-letter-section="date"
                    data-letter-pdf-text="date"
                    className="mt-[4mm] text-[9.5pt] leading-[1.45]"
                    style={{ color: palette.muted, textAlign: dateAlign }}
                  >
                    <Lines
                      values={[
                        data.ort && data.datum ? `${data.ort}, ${data.datum}` : data.ort || data.datum,
                      ]}
                      align={dateAlign}
                    />
                  </div>

                  <div className="mt-[7mm]">
                    <div
                      data-letter-pdf-text="subject"
                      className="mb-[8mm] border-b pb-[2.5mm] text-[12pt] font-semibold leading-tight"
                      style={{ borderColor: palette.accent }}
                    >
                      {data.betreff || (exportMode ? "" : "Bewerbung um eine Lehrstelle als …")}
                    </div>

                    <p data-letter-pdf-text="salutation" className="mb-[5mm]">
                      {data.anrede || (exportMode ? "" : "Guten Tag")}
                    </p>

                    <div
                      data-letter-pdf-richtext="body"
                      className="text-[10.5pt] leading-[1.55] [&_div]:min-h-[1.55em] [&_p]:min-h-[1.55em] [&_hr]:my-[5mm] [&_hr]:border-0 [&_hr]:border-t [&_hr]:border-current [&_hr]:opacity-50"
                      dangerouslySetInnerHTML={{ __html: bodyHtml }}
                    />

                    <div className="mt-[9mm]">
                      <div data-letter-pdf-text="closing">
                        {data.gruss || (exportMode ? "" : "Freundliche Grüsse")}
                      </div>
                      <div data-letter-pdf-text="signature" className="mt-[9mm] font-medium">
                        {data.unterschrift || data.absenderName}
                      </div>
                    </div>
                  </div>
                </div>
              </article>
            );
          }
          '''
          path.write_text(text[:start] + tail)

          path = Path('src/routes/anschreiben.tsx')
          text = path.read_text()
          old = 'import { LetterCanvas } from "@/components/letter/LetterCanvas";\n'
          new = (
              'import { LetterCanvas } from "@/components/letter/LetterCanvas";\n'
              'import { LetterLayoutControls } from "@/components/letter/LetterLayoutControls";\n'
              'import { LetterRichTextEditor } from "@/components/letter/LetterRichTextEditor";\n'
          )
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('    brief: true,\n', '    layout: true,\n    brief: true,\n', 1)
          text = text.replace(
              'if (dossier.design) setDesign(dossier.design);',
              'if (dossier.design) setDesign((current) => ({ ...current, ...dossier.design }));',
          )

          marker = '            <Section title="Brief" open={open.brief} onToggle={() => toggle("brief")}>'
          assert marker in text
          layout_section = '''            <Section title="Layout" open={open.layout} onToggle={() => toggle("layout")}>
              <LetterLayoutControls
                design={design}
                onChange={(value) => setDesign((current) => ({ ...current, ...value }))}
              />
            </Section>

'''
          text = text.replace(marker, layout_section + marker, 1)

          old = '''                <label className="block text-xs font-medium text-foreground">
                  Brieftext
                  <textarea
                    value={data.text}
                    onChange={(event) => patch({ text: event.target.value })}
                    rows={14}
                    placeholder="Warum möchtest du diesen Beruf lernen? Warum passt dieser Betrieb zu dir? Was bringst du mit?"
                    className={`${inputClass} resize-y leading-relaxed`}
                  />
                </label>'''
          new = '''                <LetterRichTextEditor
                  text={data.text}
                  richTextHtml={data.richTextHtml}
                  onChange={({ text, richTextHtml }) => patch({ text, richTextHtml })}
                />'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Upgrade real PDF text renderer for rich formatting
        shell: bash
        run: |
          cat > src/lib/dossier-pdf.ts <<'EOF'
          import type { jsPDF as JsPdf } from "jspdf";
          import { PAGE, PDF } from "@/default-config";
          import { downloadBlob } from "@/lib/download";

          export type DossierPdfMeta = {
            title: string;
            author: string;
            subject?: string;
            keywords?: string;
          };

          type Html2Canvas = (typeof import("html2canvas-pro"))["default"];
          type PdfFont = "helvetica" | "times" | "courier";
          type PdfFontStyle = "normal" | "bold" | "italic" | "bolditalic";

          const MM_PER_PT = 25.4 / 72;

          function pdfFontFor(page: HTMLElement): PdfFont {
            const font = page.dataset.letterFont;
            if (font === "serif" || font === "times") return "times";
            if (font === "maschine") return "courier";
            return "helvetica";
          }

          function pdfFontStyle(style: CSSStyleDeclaration): PdfFontStyle {
            const weight = Number.parseInt(style.fontWeight, 10);
            const bold = Number.isFinite(weight) ? weight >= 600 : /bold/i.test(style.fontWeight);
            const italic = style.fontStyle === "italic" || style.fontStyle === "oblique";
            if (bold && italic) return "bolditalic";
            if (bold) return "bold";
            if (italic) return "italic";
            return "normal";
          }

          function rgb(cssColor: string): [number, number, number] {
            const values = cssColor
              .match(/[\d.]+/g)
              ?.slice(0, 3)
              .map(Number);
            if (values?.length === 3 && values.every(Number.isFinite)) {
              return [values[0], values[1], values[2]];
            }
            const hex = cssColor.match(/^#([0-9a-f]{6})$/i)?.[1];
            if (hex) {
              return [
                Number.parseInt(hex.slice(0, 2), 16),
                Number.parseInt(hex.slice(2, 4), 16),
                Number.parseInt(hex.slice(4, 6), 16),
              ];
            }
            return [17, 17, 17];
          }

          function letterText(element: HTMLElement): string {
            return (element.innerText || element.textContent || "")
              .replace(/\u00a0/g, " ")
              .replace(/\r/g, "")
              .trim();
          }

          function wrapLetterText(pdf: JsPdf, text: string, widthMm: number): string[] {
            const lines: string[] = [];
            for (const logicalLine of text.split("\n")) {
              if (!logicalLine.trim()) {
                lines.push("");
                continue;
              }
              const wrapped = pdf.splitTextToSize(logicalLine, Math.max(1, widthMm));
              lines.push(...(Array.isArray(wrapped) ? wrapped : [String(wrapped)]));
            }
            return lines;
          }

          function textMetrics(style: CSSStyleDeclaration) {
            const fontSizePx = Number.parseFloat(style.fontSize) || 14;
            return {
              fontSizePt: fontSizePx * (72 / 96),
              color: rgb(style.color),
            };
          }

          function addRichLetterText(
            pdf: JsPdf,
            page: HTMLElement,
            root: HTMLElement,
            font: PdfFont,
            mmX: number,
            mmY: number,
          ) {
            const pageRect = page.getBoundingClientRect();
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const range = document.createRange();
            let node = walker.nextNode();

            while (node) {
              const raw = node.nodeValue ?? "";
              const parent = node.parentElement ?? root;
              const style = window.getComputedStyle(parent);
              const { fontSizePt, color } = textMetrics(style);
              const matches = raw.matchAll(/\S+/g);

              for (const match of matches) {
                const token = match[0];
                const start = match.index ?? 0;
                range.setStart(node, start);
                range.setEnd(node, start + token.length);
                const rect = range.getBoundingClientRect();
                if (rect.width <= 0 || rect.height <= 0) continue;

                const x = (rect.left - pageRect.left) * mmX;
                const top = (rect.top - pageRect.top) * mmY;
                const baseline = top + fontSizePt * MM_PER_PT * 0.82;
                const [red, green, blue] = color;
                pdf.setFont(font, pdfFontStyle(style));
                pdf.setFontSize(fontSizePt);
                pdf.setTextColor(red, green, blue);
                pdf.text(token, x, baseline);

                if (style.textDecorationLine.includes("underline")) {
                  pdf.setDrawColor(red, green, blue);
                  pdf.setLineWidth(0.18);
                  pdf.line(x, baseline + 0.55, x + rect.width * mmX, baseline + 0.55);
                }
              }
              node = walker.nextNode();
            }
          }

          function addLetterRules(
            pdf: JsPdf,
            page: HTMLElement,
            mmX: number,
            mmY: number,
          ) {
            const pageRect = page.getBoundingClientRect();
            const rules = page.querySelectorAll<HTMLElement>(
              "[data-letter-pdf-rule], [data-letter-pdf-richtext] hr",
            );
            for (const rule of rules) {
              const rect = rule.getBoundingClientRect();
              if (rect.width <= 0) continue;
              const style = window.getComputedStyle(rule);
              const [red, green, blue] = rgb(style.borderTopColor || style.color);
              const x1 = (rect.left - pageRect.left) * mmX;
              const x2 = (rect.right - pageRect.left) * mmX;
              const y = (rect.top - pageRect.top + Math.max(0.5, rect.height / 2)) * mmY;
              pdf.setDrawColor(red, green, blue);
              pdf.setLineWidth(0.22);
              pdf.line(x1, y, x2, y);
            }
          }

          /** Browserlayout vermessen, Glyphen und Rich-Text-Stile aber als echte PDF-Objekte zeichnen. */
          function addLetterTextLayer(pdf: JsPdf, page: HTMLElement) {
            const pageRect = page.getBoundingClientRect();
            if (pageRect.width <= 0 || pageRect.height <= 0) {
              throw new Error("Anschreiben konnte für den PDF-Text nicht vermessen werden");
            }

            const mmX = 210 / pageRect.width;
            const mmY = 297 / pageRect.height;
            const font = pdfFontFor(page);

            for (const element of page.querySelectorAll<HTMLElement>("[data-letter-pdf-text]")) {
              const text = letterText(element);
              if (!text) continue;

              const rect = element.getBoundingClientRect();
              const style = window.getComputedStyle(element);
              const fontSizePx = Number.parseFloat(style.fontSize) || 14;
              const fontSizePt = fontSizePx * (72 / 96);
              const lineHeightPx = Number.parseFloat(style.lineHeight);
              const lineHeightFactor =
                Number.isFinite(lineHeightPx) && lineHeightPx > 0 ? lineHeightPx / fontSizePx : 1.2;
              const [red, green, blue] = rgb(style.color);
              const left = (rect.left - pageRect.left) * mmX;
              const top = (rect.top - pageRect.top) * mmY;
              const width = rect.width * mmX;
              const align =
                style.textAlign === "right"
                  ? "right"
                  : style.textAlign === "center"
                    ? "center"
                    : "left";
              const x = align === "right" ? left + width : align === "center" ? left + width / 2 : left;
              const baseline = top + fontSizePt * MM_PER_PT * 0.82;

              pdf.setFont(font, pdfFontStyle(style));
              pdf.setFontSize(fontSizePt);
              pdf.setTextColor(red, green, blue);
              pdf.text(wrapLetterText(pdf, text, width), x, baseline, {
                align,
                lineHeightFactor,
              });
            }

            const richBody = page.querySelector<HTMLElement>("[data-letter-pdf-richtext]");
            if (richBody) addRichLetterText(pdf, page, richBody, font, mmX, mmY);
            addLetterRules(pdf, page, mmX, mmY);
          }

          async function addRasterPage(
            pdf: JsPdf,
            html2canvas: Html2Canvas,
            page: HTMLElement,
            hideLetterText = false,
          ) {
            const canvas = await html2canvas(page, {
              scale: PDF.SCALE,
              backgroundColor: "#ffffff",
              useCORS: true,
              width: PAGE.WIDTH,
              height: PAGE.HEIGHT,
              windowWidth: PAGE.WIDTH,
              windowHeight: PAGE.HEIGHT,
              scrollX: 0,
              scrollY: 0,
              onclone: hideLetterText
                ? (clonedDocument) => {
                    for (const node of clonedDocument.querySelectorAll<HTMLElement>(
                      "[data-letter-text-layer], [data-letter-text-layer] *",
                    )) {
                      node.style.setProperty("color", "transparent", "important");
                      node.style.setProperty("-webkit-text-fill-color", "transparent", "important");
                      node.style.setProperty("text-decoration-color", "transparent", "important");
                      node.style.setProperty("text-shadow", "none", "important");
                    }
                    for (const rule of clonedDocument.querySelectorAll<HTMLElement>(
                      "[data-letter-pdf-rule], [data-letter-pdf-richtext] hr",
                    )) {
                      rule.style.setProperty("border-color", "transparent", "important");
                      rule.style.setProperty("background", "transparent", "important");
                    }
                  }
                : undefined,
            });

            pdf.addImage(
              canvas.toDataURL("image/jpeg", PDF.QUALITY),
              "JPEG",
              0,
              0,
              210,
              297,
              undefined,
              "FAST",
            );
          }

          /** Titelblatt/CV bleiben Raster; das Anschreiben erhält eine echte formatierte Textebene. */
          export async function downloadCombinedDossierPdf(
            root: HTMLElement,
            fileName: string,
            meta: DossierPdfMeta,
          ): Promise<void> {
            await document.fonts?.ready;
            await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

            const cover = root.querySelector<HTMLElement>("[data-dossier-document='cover']");
            const letterRoot = root.querySelector<HTMLElement>("[data-dossier-document='letter']");
            const letter = letterRoot?.querySelector<HTMLElement>("[data-letter-page]") ?? letterRoot;
            const cvPages = Array.from(root.querySelectorAll<HTMLElement>("[data-cv-page]"));
            if (!cover || !letter || !cvPages.length) {
              throw new Error(
                "Dossier ist noch nicht vollständig: Titelblatt, Anschreiben und Lebenslauf werden benötigt",
              );
            }

            const [{ default: html2canvas }, { jsPDF }] = await Promise.all([
              import("html2canvas-pro"),
              import("jspdf"),
            ]);
            const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
            pdf.setProperties({
              title: meta.title,
              author: meta.author,
              subject: meta.subject ?? "Bewerbungsdossier",
              keywords: meta.keywords ?? "Bewerbung, Anschreiben, Lebenslauf, Titelblatt",
              creator: meta.author || "Bewerbungsdossier",
            });

            await addRasterPage(pdf, html2canvas, cover);
            pdf.addPage("a4", "portrait");
            await addRasterPage(pdf, html2canvas, letter, true);
            addLetterTextLayer(pdf, letter);

            for (const cvPage of cvPages) {
              pdf.addPage("a4", "portrait");
              await addRasterPage(pdf, html2canvas, cvPage);
            }

            downloadBlob(pdf.output("blob"), fileName);
          }
          EOF

      - name: Extend dossier regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/dossier-regression.spec.ts')
          text = path.read_text()
          text = text.replace(
              '    await expect(body).toHaveValue(preservedBody);',
              '    await expect(body).toHaveText(preservedBody);',
              1,
          )

          marker = '  test("start screen requires the letter, reads fresh storage and downloads cover-letter-CV in order", async ({\n'
          assert marker in text
          test_block = r'''  test("letter layout controls and rich text formatting persist", async ({ page }) => {
            await seedCoreDossier(page);
            await page.goto(`${BASE_URL}/anschreiben`, { waitUntil: "domcontentloaded" });

            await page.getByRole("button", { name: "Absender Rechts" }).click();
            await page.getByRole("button", { name: "Empfänger Rechts" }).click();
            await page.getByRole("button", { name: "Ort & Datum Rechts" }).click();
            await page.getByLabel("Trennlinie nach Absender").check();
            await page.getByLabel("Trennlinie nach Empfänger").check();

            const preview = page.getByLabel("Vorschau Anschreiben");
            await expect(preview.locator('[data-letter-section="sender"]')).toHaveCSS("text-align", "right");
            await expect(preview.locator('[data-letter-section="recipient"]')).toHaveCSS("text-align", "right");
            await expect(preview.locator('[data-letter-section="date"]')).toHaveCSS("text-align", "right");
            await expect(preview.locator('[data-letter-pdf-rule="sender"]')).toBeVisible();
            await expect(preview.locator('[data-letter-pdf-rule="recipient"]')).toBeVisible();

            const body = page.getByRole("textbox", { name: "Brieftext" });
            await body.fill("Formatiert");
            await body.press("Control+A");
            await page.getByRole("button", { name: "Fett" }).click();
            await page.getByRole("button", { name: "Kursiv" }).click();
            await page.getByRole("button", { name: "Unterstrichen" }).click();
            await body.click();
            await body.press("End");
            await page.getByRole("button", { name: "Trennlinie einfügen" }).click();

            await expect(preview.locator('[data-letter-pdf-richtext="body"] strong')).toContainText("Formatiert");
            await expect(preview.locator('[data-letter-pdf-richtext="body"] em')).toContainText("Formatiert");
            await expect(preview.locator('[data-letter-pdf-richtext="body"] u')).toContainText("Formatiert");
            await expect(preview.locator('[data-letter-pdf-richtext="body"] hr')).toHaveCount(1);
            await expect(page.getByRole("button", { name: "Formatierung entfernen" })).toBeVisible();

            await expect
              .poll(() =>
                page.evaluate(() => JSON.parse(localStorage.getItem("anschreiben:v1") ?? "{}")),
              )
              .toMatchObject({
                design: {
                  senderAlign: "right",
                  recipientAlign: "right",
                  dateAlign: "right",
                  ruleAfterSender: true,
                  ruleAfterRecipient: true,
                },
                data: { text: "Formatiert" },
              });

            const saved = await page.evaluate(
              () => JSON.parse(localStorage.getItem("anschreiben:v1") ?? "{}").data?.richTextHtml ?? "",
            );
            expect(saved).toContain("<strong>");
            expect(saved).toContain("<em>");
            expect(saved).toContain("<u>");
            expect(saved).toContain("<hr>");
          });

'''
          text = text.replace(marker, test_block + marker, 1)
          path.write_text(text)
          PY

          bunx prettier --write \
            src/components/letter/types.ts \
            src/components/letter/rich-text.ts \
            src/components/letter/LetterRichTextEditor.tsx \
            src/components/letter/LetterLayoutControls.tsx \
            src/components/letter/LetterCanvas.tsx \
            src/routes/anschreiben.tsx \
            src/lib/dossier-pdf.ts \
            tests/e2e/dossier-regression.spec.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Unit tests
        run: bun test tests/unit
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1
      - name: Run dossier regression suite
        run: npx playwright test tests/e2e/dossier-regression.spec.ts --reporter=line --workers=1
      - name: Show app log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true
      - name: Commit passing migration and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-letter-layout-richtext.yml
          git add src/components/letter src/routes/anschreiben.tsx src/lib/dossier-pdf.ts tests/e2e/dossier-regression.spec.ts
          git diff --cached --check
          git commit -m "Add flexible letter layout and rich text"
          git push origin HEAD:feature/anschreiben-layout-richtext
      - name: Stop application
        if: always()
        run: if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
