name: Temporary Template REDO formatter

on:
  push:
    branches:
      - templateREDO

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier src/components/letter/LetterSheetBackground.tsx --write
      - run: cat src/components/letter/LetterSheetBackground.tsx
