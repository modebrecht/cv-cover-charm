name: M7 Recovery

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/m7-recovery.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply verified regression sync
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          regression = Path("tests/e2e/dossier-regression.spec.ts")
          text = regression.read_text(encoding="utf-8")
          old = "Alles vom Titelblatt übernehmen"
          count = text.count(old)
          if count != 3:
              raise SystemExit(f"Expected verified 3 stale takeover selectors, found {count}")
          regression.write_text(text.replace(old, "Alles übernehmen"), encoding="utf-8")

          source_workflow = Path(".github/workflows/m7-test-sync.yml")
          source_lines = source_workflow.read_text(encoding="utf-8").splitlines()
          marker_index = next(
              index for index, line in enumerate(source_lines) if "TRANSFER_SPEC_B64: >-" in line
          )
          encoded = source_lines[marker_index + 1].strip()
          Path("tests/e2e/dossier-transfer-regression.spec.ts").write_text(
              base64.b64decode(encoded).decode("utf-8"),
              encoding="utf-8",
          )

          workflow = Path(".github/workflows/dossier-regression.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          marker = "          tests/e2e/dossier-regression.spec.ts\n"
          addition = "          tests/e2e/dossier-transfer-regression.spec.ts\n"
          if addition not in workflow_text:
              if marker not in workflow_text:
                  raise SystemExit("Regression workflow marker not found")
              workflow_text = workflow_text.replace(marker, marker + addition, 1)
          workflow.write_text(workflow_text, encoding="utf-8")

          source_workflow.unlink()
          Path(".github/workflows/m7-recovery.yml").unlink()
          PY

      - name: Commit recovered regression coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align dossier transfer regressions"
          git push origin HEAD:dev
