name: M5 Export Gallery Fix

on:
  push:
    branches:
      - letter-m1-m2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: letter-m1-m2
          fetch-depth: 1

      - name: Render visual matrix from export surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/letter-final-qa.spec.ts')
          text = path.read_text(encoding='utf-8')

          helper_marker = 'async function screenshotExportSurface('
          if helper_marker not in text:
              anchor = '''async function seedLetter(\n  page: Page,\n'''
              helper = '''async function screenshotExportSurface(\n  page: Page,\n  exported: Locator,\n  path: string,\n) {\n  const host = page.locator("[data-letter-standalone-export]");\n  await host.evaluate((element) => {\n    const html = element as HTMLElement;\n    html.dataset.m5OriginalStyle = html.getAttribute("style") ?? "";\n    html.style.position = "absolute";\n    html.style.left = "0";\n    html.style.top = "0";\n    html.style.zIndex = "2147483647";\n    html.style.background = "white";\n  });\n  await doubleFrame(page);\n  const shot = await exported.screenshot({ path, animations: "disabled" });\n  await host.evaluate((element) => {\n    const html = element as HTMLElement;\n    const original = html.dataset.m5OriginalStyle ?? "";\n    if (original) html.setAttribute("style", original);\n    else html.removeAttribute("style");\n    delete html.dataset.m5OriginalStyle;\n  });\n  return shot;\n}\n\n'''
              if anchor not in text:
                  raise SystemExit('seedLetter anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''      await settleVisualPreview(preview);\n      const shot = await preview.screenshot({\n        path: join(ARTIFACT_DIR, fileName),\n        animations: "disabled",\n      });\n'''
          new = '''      const shot = await screenshotExportSurface(\n        page,\n        exported,\n        join(ARTIFACT_DIR, fileName),\n      );\n'''
          if old not in text:
              if new not in text:
                  raise SystemExit('template screenshot block not found')
          else:
              text = text.replace(old, new, 1)

          text = text.replace(
              'manifest.push(`${fileName} | template=${template} | header=compact | footer=compact`);',
              'manifest.push(`${fileName} | export | template=${template} | header=compact | footer=compact`);',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit visual gallery fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/letter-final-qa.spec.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "test(letter): capture visual matrix from export surface"
          git push origin HEAD:letter-m1-m2
