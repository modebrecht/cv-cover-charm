name: M7 Final Transfer Regression Sync

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/m7-test-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Align takeover regression coverage
        env:
          TRANSFER_SPEC_B64: >-
            
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          regression = Path("tests/e2e/dossier-regression.spec.ts")
          text = regression.read_text(encoding="utf-8")
          old = "Alles vom Titelblatt übernehmen"
          count = text.count(old)
          if count != 4:
              raise SystemExit(f"Expected 4 stale takeover selectors, found {count}")
          regression.write_text(text.replace(old, "Alles übernehmen"), encoding="utf-8")

          transfer = Path("tests/e2e/dossier-transfer-regression.spec.ts")
          transfer.write_text(
              base64.b64decode(os.environ["TRANSFER_SPEC_B64"]).decode("utf-8"),
              encoding="utf-8",
          )

          workflow = Path(".github/workflows/dossier-regression.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          marker = "          tests/e2e/dossier-regression.spec.ts\n"
          addition = "          tests/e2e/dossier-transfer-regression.spec.ts\n"
          if addition not in workflow_text:
              if marker not in workflow_text:
                  raise SystemExit("Regression workflow marker not found")
              workflow_text = workflow_text.replace(marker, marker + addition, 1)
          workflow.write_text(workflow_text, encoding="utf-8")

          Path(".github/workflows/m7-test-sync.yml").unlink()
          PY

      - name: Commit final regression coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align dossier transfer regressions"
          git push origin HEAD:dev
