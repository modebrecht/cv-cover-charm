name: Apply Trebuchet dossier defaults once

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch-defaults:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set Trebuchet defaults without touching saved choices
        shell: python
        run: |
          from pathlib import Path

          cover = Path("src/routes/titelblatt.tsx")
          text = cover.read_text()
          old = 'const [documentFont, setDocumentFont] = useState<FontKey | null>(null);'
          new = 'const [documentFont, setDocumentFont] = useState<FontKey | null>("freundlich");'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one title-page initial font marker, found {text.count(old)}")
          text = text.replace(old, new)
          reset_old = 'setDocumentFont(null);'
          if text.count(reset_old) != 2:
              raise SystemExit(f"Expected two title-page font reset markers, found {text.count(reset_old)}")
          text = text.replace(reset_old, 'setDocumentFont("freundlich");')
          cover.write_text(text)

          cv = Path("src/routes/lebenslauf.tsx")
          text = cv.read_text()
          initial_old = '''      template: d.template,
                colors: d.colors,
                bgOpacity: DEFAULT_BG_OPACITY,'''
          initial_new = '''      template: d.template,
                colors: d.colors,
                font: "freundlich",
                bgOpacity: DEFAULT_BG_OPACITY,'''
          if text.count(initial_old) != 1:
              raise SystemExit(f"Expected one CV initial design marker, found {text.count(initial_old)}")
          text = text.replace(initial_old, initial_new)

          reset_old = '''      template: draft?.template ?? d.template,
                colors: draft?.colors ?? d.colors,
                font: draft?.font ?? undefined,
                bgOpacity: DEFAULT_BG_OPACITY,'''
          reset_new = '''      template: draft?.template ?? d.template,
                colors: draft?.colors ?? d.colors,
                font: draft ? (draft.font ?? undefined) : "freundlich",
                bgOpacity: DEFAULT_BG_OPACITY,'''
          if text.count(reset_old) != 1:
              raise SystemExit(f"Expected one CV reset design marker, found {text.count(reset_old)}")
          text = text.replace(reset_old, reset_new)
          cv.write_text(text)

          Path(".github/workflows/apply-trebuchet-default-once.yml").unlink()

      - name: Commit patched defaults and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/titelblatt.tsx src/routes/lebenslauf.tsx .github/workflows/apply-trebuchet-default-once.yml
          git commit -m "Set Trebuchet as dossier default font"
          git push origin HEAD:dev
