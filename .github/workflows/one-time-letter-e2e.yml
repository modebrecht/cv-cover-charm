name: One-time letter dossier E2E

on:
  push:
    branches:
      - feature/anschreiben-dossier

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anschreiben-dossier
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Write focused diagnostic
        run: |
          cat > tests/e2e/_letter-dossier-debug.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          const BASE_URL = "http://127.0.0.1:4173";

          const cover = {
            version: 7,
            template: "modern",
            colors: { modern: { primary: "#111827", accent: "#f43f5e", bg: "#fafafa" } },
            layout: { modern: {} },
            customs: [],
            fontScale: 1,
            font: "sans",
            data: {
              meta: { title: "", author: "", subject: "", keywords: "" },
              kicker: "Bewerbung um eine Lehrstelle als", eyebrow: "Bewerbung",
              beruf: "Informatiker/in EFZ", lehrbeginn: "Lehrbeginn August 2027",
              vorname: "Lea", nachname: "Müller", adresse: "Dorfstrasse 12",
              plzOrt: "4535 Hubersdorf", telefon: "+41 79 123 45 67",
              email: "lea.mueller@example.ch", geburtsdatum: "14.03.2010",
              lehrbetrieb: "Beispiel AG", ansprechperson: "Herr Thomas Weber",
              betriebAdresse: "Industriestrasse 8, 4500 Solothurn", ort: "Hubersdorf",
              datum: "25.08.2026", labelKontakt: "", labelEmpfaenger: "", foto: null,
            },
          };

          const cv = {
            version: 2,
            data: {
              person: { vorname: "Lea", nachname: "Müller", adresse: "Dorfstrasse 12", plzOrt: "4535 Hubersdorf", telefon: "+41 79 123 45 67", email: "lea.mueller@example.ch", geburtsdatum: "14.03.2010", nationalitaet: "Schweiz", untertitel: "Schülerin", foto: null },
              schule: [], erfahrung: [], sprachen: [], hobbys: [], staerken: [], referenzen: [], labels: {}, hidden: {},
            },
            design: { template: "modern", colors: { primary: "#111827", accent: "#f43f5e", bg: "#fafafa" }, bgOpacity: 0.06, useElements: false },
            elements: [],
          };

          const letter = {
            version: 1,
            data: {
              absenderName: "Lea Müller", absenderAdresse: "Dorfstrasse 12", absenderPlzOrt: "4535 Hubersdorf",
              absenderTelefon: "+41 79 123 45 67", absenderEmail: "lea.mueller@example.ch",
              empfaengerFirma: "Beispiel AG", empfaengerName: "Herr Thomas Weber", empfaengerAdresse: "Industriestrasse 8",
              empfaengerPlzOrt: "4500 Solothurn", ort: "Hubersdorf", datum: "25.08.2026",
              betreff: "Bewerbung um eine Lehrstelle als Informatiker/in EFZ", anrede: "Guten Tag Herr Weber",
              text: "Ich interessiere mich sehr für diese Lehrstelle.", gruss: "Freundliche Grüsse", unterschrift: "Lea Müller",
            },
            design: { template: "modern", colors: { primary: "#111827", accent: "#f43f5e", bg: "#fafafa" }, font: "sans" },
          };

          test("diagnose fresh letter", async ({ page }) => {
            page.on("pageerror", (error) => console.log("PAGEERROR:", error.message));
            page.on("console", (message) => {
              if (message.type() === "error") console.log("BROWSER-ERROR:", message.text());
            });

            await page.goto(BASE_URL, { waitUntil: "domcontentloaded" });
            await page.evaluate(({ cover, cv }) => {
              localStorage.clear();
              localStorage.setItem("titelblatt:v3", JSON.stringify(cover));
              localStorage.setItem("lebenslauf:v1", JSON.stringify(cv));
              window.location.reload();
            }, { cover, cv });
            await page.waitForLoadState("domcontentloaded");
            await expect(page.getByText(/Gesamtdossier verfügbar, sobald .*Anschreiben/)).toBeVisible();

            const card = page.getByRole("button", { name: /Gesamtdossier herunterladen/ });
            await card.click();
            await page.evaluate((payload) => localStorage.setItem("anschreiben:v1", JSON.stringify(payload)), letter);
            console.log("LETTER RAW:", await page.evaluate(() => localStorage.getItem("anschreiben:v1")));
            await card.click();
            await page.waitForTimeout(250);
            console.log("DIALOG COUNT:", await page.getByRole("dialog", { name: "Dossier herunterladen" }).count());
            console.log("BODY TEXT:\n", await page.locator("body").innerText());
            await expect(page.getByRole("dialog", { name: "Dossier herunterladen" })).toBeVisible();
          });
          EOF
      - name: Start application
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Run focused diagnostic
        run: npx playwright test tests/e2e/_letter-dossier-debug.spec.ts --reporter=line --workers=1
      - if: always()
        run: |
          cat /tmp/cv-cover-charm.log || true
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
