name: One-time real letter PDF text

on:
  push:
    branches:
      - feature/anschreiben-dossier

permissions:
  contents: write

jobs:
  migrate-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anschreiben-dossier
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mark semantic letter text layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/letter/LetterCanvas.tsx')
          text = path.read_text()

          old = 'export function LetterCanvas({ data, design }: { data: LetterData; design: LetterDesign }) {'
          new = '''export function LetterCanvas({\n  data,\n  design,\n  exportMode = false,\n}: {\n  data: LetterData;\n  design: LetterDesign;\n  exportMode?: boolean;\n}) {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    <article\n      className="relative h-[1123px] w-[794px] overflow-hidden shadow-xl"'''
          new = '''    <article\n      data-letter-page\n      data-letter-font={design.font}\n      className="relative h-[1123px] w-[794px] overflow-hidden shadow-xl"'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''      <div\n        className="absolute flex flex-col"'''
          new = '''      <div\n        data-letter-text-layer\n        className="absolute flex flex-col"'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''          <Lines\n            values={[\n              data.absenderName,\n              data.absenderAdresse,\n              data.absenderPlzOrt,\n              data.absenderTelefon,\n              data.absenderEmail,\n            ]}\n          />'''
          new = '''          <div data-letter-pdf-text="sender">\n            <Lines\n              values={[\n                data.absenderName,\n                data.absenderAdresse,\n                data.absenderPlzOrt,\n                data.absenderTelefon,\n                data.absenderEmail,\n              ]}\n            />\n          </div>'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '<div className="min-w-[45mm] text-right" style={{ color: palette.muted }}>'
          new = '<div data-letter-pdf-text="date" className="min-w-[45mm] text-right" style={{ color: palette.muted }}>'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''          <Lines\n            values={[\n              data.empfaengerFirma,\n              data.empfaengerName,\n              data.empfaengerAdresse,\n              data.empfaengerPlzOrt,\n            ]}\n          />'''
          new = '''          <div data-letter-pdf-text="recipient">\n            <Lines\n              values={[\n                data.empfaengerFirma,\n                data.empfaengerName,\n                data.empfaengerAdresse,\n                data.empfaengerPlzOrt,\n              ]}\n            />\n          </div>'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''          <div\n            className="mb-[8mm] border-b pb-[2.5mm] text-[12pt] font-semibold leading-tight"'''
          new = '''          <div\n            data-letter-pdf-text="subject"\n            className="mb-[8mm] border-b pb-[2.5mm] text-[12pt] font-semibold leading-tight"'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
              '{data.betreff || "Bewerbung um eine Lehrstelle als …"}',
              '{data.betreff || (exportMode ? "" : "Bewerbung um eine Lehrstelle als …")}',
              1,
          )

          old = '<p className="mb-[5mm]">{data.anrede || "Guten Tag"}</p>'
          new = '<p data-letter-pdf-text="salutation" className="mb-[5mm]">{data.anrede || (exportMode ? "" : "Guten Tag")}</p>'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''          <div className="whitespace-pre-line text-[10.5pt] leading-[1.55]">\n            {data.text ||\n              "Hier entsteht dein persönliches Anschreiben. Erkläre, weshalb du dich für diesen Beruf und diesen Lehrbetrieb interessierst und was du mitbringst."}\n          </div>'''
          new = '''          <div\n            data-letter-pdf-text="body"\n            className="whitespace-pre-line text-[10.5pt] leading-[1.55]"\n          >\n            {data.text ||\n              (exportMode\n                ? ""\n                : "Hier entsteht dein persönliches Anschreiben. Erkläre, weshalb du dich für diesen Beruf und diesen Lehrbetrieb interessierst und was du mitbringst.")}\n          </div>'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''          <div className="mt-[9mm]">\n            <div>{data.gruss || "Freundliche Grüsse"}</div>\n            <div className="mt-[9mm] font-medium">{data.unterschrift || data.absenderName}</div>\n          </div>'''
          new = '''          <div className="mt-[9mm]">\n            <div data-letter-pdf-text="closing">\n              {data.gruss || (exportMode ? "" : "Freundliche Grüsse")}\n            </div>\n            <div data-letter-pdf-text="signature" className="mt-[9mm] font-medium">\n              {data.unterschrift || data.absenderName}\n            </div>\n          </div>'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/dossier/DossierPdfCanvas.tsx')
          text = path.read_text()
          old = '<LetterCanvas data={storedLetter.data} design={storedLetter.design} />'
          new = '<LetterCanvas data={storedLetter.data} design={storedLetter.design} exportMode />'
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Replace combined PDF renderer with real letter text
        shell: bash
        run: |
          cat > src/lib/dossier-pdf.ts <<'EOF'
          import type { jsPDF as JsPdf } from "jspdf";
          import { PAGE, PDF } from "@/default-config";
          import { downloadBlob } from "@/lib/download";

          export type DossierPdfMeta = {
            title: string;
            author: string;
            subject?: string;
            keywords?: string;
          };

          type Html2Canvas = typeof import("html2canvas-pro")["default"];
          type PdfFont = "helvetica" | "times" | "courier";
          type PdfFontStyle = "normal" | "bold" | "italic" | "bolditalic";

          const MM_PER_PT = 25.4 / 72;

          function pdfFontFor(page: HTMLElement): PdfFont {
            const font = page.dataset.letterFont;
            if (font === "serif" || font === "times") return "times";
            if (font === "maschine") return "courier";
            return "helvetica";
          }

          function pdfFontStyle(style: CSSStyleDeclaration): PdfFontStyle {
            const weight = Number.parseInt(style.fontWeight, 10);
            const bold = Number.isFinite(weight) ? weight >= 600 : /bold/i.test(style.fontWeight);
            const italic = style.fontStyle === "italic" || style.fontStyle === "oblique";
            if (bold && italic) return "bolditalic";
            if (bold) return "bold";
            if (italic) return "italic";
            return "normal";
          }

          function rgb(cssColor: string): [number, number, number] {
            const values = cssColor.match(/[\d.]+/g)?.slice(0, 3).map(Number);
            if (values?.length === 3 && values.every(Number.isFinite)) {
              return [values[0], values[1], values[2]];
            }
            const hex = cssColor.match(/^#([0-9a-f]{6})$/i)?.[1];
            if (hex) {
              return [
                Number.parseInt(hex.slice(0, 2), 16),
                Number.parseInt(hex.slice(2, 4), 16),
                Number.parseInt(hex.slice(4, 6), 16),
              ];
            }
            return [17, 17, 17];
          }

          function letterText(element: HTMLElement): string {
            return (element.innerText || element.textContent || "")
              .replace(/\u00a0/g, " ")
              .replace(/\r/g, "")
              .trim();
          }

          function wrapLetterText(pdf: JsPdf, text: string, widthMm: number): string[] {
            const lines: string[] = [];
            for (const logicalLine of text.split("\n")) {
              if (!logicalLine.trim()) {
                lines.push("");
                continue;
              }
              const wrapped = pdf.splitTextToSize(logicalLine, Math.max(1, widthMm));
              lines.push(...(Array.isArray(wrapped) ? wrapped : [String(wrapped)]));
            }
            return lines;
          }

          /**
           * Der Browser bleibt die Layout-Engine des Anschreibens. Seine Blockpositionen
           * werden in A4-Millimeter übersetzt; nur die Glyphen zeichnet jsPDF selbst.
           * So bleiben Design und Abstände nah an der Vorschau, der Brieftext ist im PDF
           * aber echter, durchsuchbarer Text statt Bestandteil eines Screenshotss.
           */
          function addLetterTextLayer(pdf: JsPdf, page: HTMLElement) {
            const pageRect = page.getBoundingClientRect();
            if (pageRect.width <= 0 || pageRect.height <= 0) {
              throw new Error("Anschreiben konnte für den PDF-Text nicht vermessen werden");
            }

            const mmX = 210 / pageRect.width;
            const mmY = 297 / pageRect.height;
            const font = pdfFontFor(page);

            for (const element of page.querySelectorAll<HTMLElement>("[data-letter-pdf-text]")) {
              const text = letterText(element);
              if (!text) continue;

              const rect = element.getBoundingClientRect();
              const style = window.getComputedStyle(element);
              const fontSizePx = Number.parseFloat(style.fontSize) || 14;
              const fontSizePt = fontSizePx * (72 / 96);
              const lineHeightPx = Number.parseFloat(style.lineHeight);
              const lineHeightFactor =
                Number.isFinite(lineHeightPx) && lineHeightPx > 0
                  ? lineHeightPx / fontSizePx
                  : 1.2;
              const [red, green, blue] = rgb(style.color);
              const left = (rect.left - pageRect.left) * mmX;
              const top = (rect.top - pageRect.top) * mmY;
              const width = rect.width * mmX;
              const align =
                style.textAlign === "right"
                  ? "right"
                  : style.textAlign === "center"
                    ? "center"
                    : "left";
              const x = align === "right" ? left + width : align === "center" ? left + width / 2 : left;
              const baseline = top + fontSizePt * MM_PER_PT * 0.82;

              pdf.setFont(font, pdfFontStyle(style));
              pdf.setFontSize(fontSizePt);
              pdf.setTextColor(red, green, blue);
              pdf.text(wrapLetterText(pdf, text, width), x, baseline, {
                align,
                lineHeightFactor,
              });
            }
          }

          async function addRasterPage(
            pdf: JsPdf,
            html2canvas: Html2Canvas,
            page: HTMLElement,
            hideLetterText = false,
          ) {
            const canvas = await html2canvas(page, {
              scale: PDF.SCALE,
              backgroundColor: "#ffffff",
              useCORS: true,
              width: PAGE.WIDTH,
              height: PAGE.HEIGHT,
              windowWidth: PAGE.WIDTH,
              windowHeight: PAGE.HEIGHT,
              scrollX: 0,
              scrollY: 0,
              onclone: hideLetterText
                ? (clonedDocument) => {
                    for (const node of clonedDocument.querySelectorAll<HTMLElement>(
                      "[data-letter-text-layer], [data-letter-text-layer] *",
                    )) {
                      node.style.setProperty("color", "transparent", "important");
                      node.style.setProperty("-webkit-text-fill-color", "transparent", "important");
                      node.style.setProperty("text-shadow", "none", "important");
                    }
                  }
                : undefined,
            });

            pdf.addImage(
              canvas.toDataURL("image/jpeg", PDF.QUALITY),
              "JPEG",
              0,
              0,
              210,
              297,
              undefined,
              "FAST",
            );
          }

          /**
           * Erstellt eine Hybrid-PDF: Titelblatt und CV bleiben WYSIWYG-Rasterseiten;
           * das Anschreiben behält seinen grafischen Hintergrund, erhält aber eine
           * echte PDF-Textebene für alle Briefinhalte.
           */
          export async function downloadCombinedDossierPdf(
            root: HTMLElement,
            fileName: string,
            meta: DossierPdfMeta,
          ): Promise<void> {
            await document.fonts?.ready;
            await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

            const cover = root.querySelector<HTMLElement>("[data-dossier-document='cover']");
            const letterRoot = root.querySelector<HTMLElement>("[data-dossier-document='letter']");
            const letter = letterRoot?.querySelector<HTMLElement>("[data-letter-page]") ?? letterRoot;
            const cvPages = Array.from(root.querySelectorAll<HTMLElement>("[data-cv-page]"));
            if (!cover || !letter || !cvPages.length) {
              throw new Error(
                "Dossier ist noch nicht vollständig: Titelblatt, Anschreiben und Lebenslauf werden benötigt",
              );
            }

            const [{ default: html2canvas }, { jsPDF }] = await Promise.all([
              import("html2canvas-pro"),
              import("jspdf"),
            ]);
            const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
            pdf.setProperties({
              title: meta.title,
              author: meta.author,
              subject: meta.subject ?? "Bewerbungsdossier",
              keywords: meta.keywords ?? "Bewerbung, Anschreiben, Lebenslauf, Titelblatt",
              creator: meta.author || "Bewerbungsdossier",
            });

            await addRasterPage(pdf, html2canvas, cover);

            pdf.addPage("a4", "portrait");
            await addRasterPage(pdf, html2canvas, letter, true);
            addLetterTextLayer(pdf, letter);

            for (const cvPage of cvPages) {
              pdf.addPage("a4", "portrait");
              await addRasterPage(pdf, html2canvas, cvPage);
            }

            downloadBlob(pdf.output("blob"), fileName);
          }
          EOF

      - name: Strengthen PDF regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/dossier-regression.spec.ts')
          text = path.read_text()
          text = text.replace(
              'import { stat } from "node:fs/promises";',
              'import { readFile, stat } from "node:fs/promises";',
              1,
          )
          old = '''    expect(path).not.toBeNull();\n    expect((await stat(path ?? "")).size).toBeGreaterThan(10_000);\n  });\n\n  test("card-template sidebar clears the header and stays inside the card"'''
          new = '''    expect(path).not.toBeNull();\n    expect((await stat(path ?? "")).size).toBeGreaterThan(10_000);\n\n    // Der Brief muss als echter PDF-Text vorliegen. Im alten Screenshot-Export\n    // kamen diese Inhalte nur als Bildpixel vor und tauchten im PDF-Quelltext nicht auf.\n    const pdfSource = (await readFile(path ?? "")).toString("latin1");\n    expect(pdfSource).toContain("Bewerbung um eine Lehrstelle als Informatiker/in EFZ");\n    expect(pdfSource).toContain("Guten Tag Herr Weber");\n  });\n\n  test("card-template sidebar clears the header and stays inside the card"'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY

          bunx prettier --write \
            src/components/letter/LetterCanvas.tsx \
            src/components/dossier/DossierPdfCanvas.tsx \
            src/lib/dossier-pdf.ts \
            tests/e2e/dossier-regression.spec.ts

      - name: Install application dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Unit regressions
        run: bun test tests/unit
      - name: Production build
        run: bun run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1
      - name: Run dossier regression suite
        run: npx playwright test tests/e2e/dossier-regression.spec.ts --reporter=line --workers=1
      - name: Show app log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true
      - name: Commit passing migration and remove one-time workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-letter-real-pdf-text.yml
          git add src/components/letter/LetterCanvas.tsx src/components/dossier/DossierPdfCanvas.tsx src/lib/dossier-pdf.ts tests/e2e/dossier-regression.spec.ts
          git diff --cached --check
          git commit -m "Render application letter as real PDF text"
          git push origin HEAD:feature/anschreiben-dossier
      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
