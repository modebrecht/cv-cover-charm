name: Unify dossier sheet background

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/unify-dossier-sheet-background.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply shared background refactor
        run: python3 .github/scripts/unify-dossier-sheet-background.py

      - name: Format changed sources
        run: npx prettier --write src/components/dossier/DossierSheetBackground.tsx src/components/letter/LetterCanvas.tsx src/components/cv/CvCanvas.tsx tests/unit/dossier-sheet-background.test.tsx

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: share dossier background across cv and letter"
          git push origin HEAD:dev
