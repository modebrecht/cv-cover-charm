name: Temporary CV rubric title style

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/temp-cv-rubric-title-style.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply rubric title patch
        run: python .github/scripts/temp-cv-rubric-title-style.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed files
        run: bunx prettier --write src/components/cv/types.ts src/components/cv/CvCanvasBase.tsx src/routes/lebenslauf.tsx tests/unit/cv-doc-title-style.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Focused unit regression
        run: bun test tests/unit/cv-doc-title-style.test.ts
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add src/components/cv/types.ts src/components/cv/CvCanvasBase.tsx src/routes/lebenslauf.tsx tests/unit/cv-doc-title-style.test.ts
          git commit -m "feat(cv): add global rubric title formatting"
          git push origin HEAD:dev
