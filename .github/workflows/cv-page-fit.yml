name: CV measured page fit

on:
  push:
    branches: [dev, render]
    paths:
      - "src/components/cv/**"
      - "src/routes/lebenslauf.tsx"
      - "src/lib/docx-next/**"
      - "tests/qa/cv-*page-fit.qa.ts"
      - "tests/qa/playwright.*page-fit.config.ts"
      - ".github/workflows/cv-page-fit.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-measured-page-fit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locked application and isolated browser tools
        run: |
          bun install --frozen-lockfile
          npm install --prefix .qa-tools --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          ln -s ../.qa-tools/node_modules/@playwright node_modules/@playwright
          ln -s ../../.qa-tools/node_modules/.bin/playwright node_modules/.bin/playwright
      - name: Supported Chromium and export fonts
        timeout-minutes: 6
        run: PATH="$PWD/.qa-tools/node_modules/.bin:$PATH" bash scripts/qa-browser-setup.sh
      - name: Two-page fitting and export boundary
        run: .qa-tools/node_modules/.bin/playwright test --config tests/qa/playwright.two-page-fit.config.ts
      - name: Intelligent automatic fitting
        run: .qa-tools/node_modules/.bin/playwright test --config tests/qa/playwright.smart-fit.config.ts
      - name: One-page regression checks
        run: .qa-tools/node_modules/.bin/playwright test --config tests/qa/playwright.one-page-fit.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-measured-page-fit-${{ github.sha }}
          path: |
            artifacts/two-page-fit/*.json
            artifacts/two-page-fit/*.pdf
            artifacts/one-page-fit/*.json
            artifacts/one-page-fit/*.pdf
            artifacts/one-page-fit/*.docx
            artifacts/smart-fit-29okt/*.json
            artifacts/smart-fit-29okt/*.pdf
            artifacts/smart-fit-29okt/*.docx
          retention-days: 14
