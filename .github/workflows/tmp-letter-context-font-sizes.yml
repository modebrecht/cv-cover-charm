name: Temporary contextual letter font sizes

on:
  push:
    branches:
      - tmp-letter-context-font-sizes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python3 scripts/tmp-letter-context-font-sizes.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused tests
        run: bun test tests/unit/letter-body-font-size.test.ts tests/unit/letter-context-font-sizes.test.ts
      - name: Build
        run: bun run build
      - name: Commit tested tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/letter/types.ts src/components/letter/LetterFontSizeControl.tsx src/components/letter/LetterLayoutControls.tsx src/components/letter/LetterCanvas.tsx src/routes/anschreiben.tsx tests/unit/letter-body-font-size.test.ts tests/unit/letter-context-font-sizes.test.ts
          git commit -m "feat(letter): place font sizes with their form sections"
          git push origin HEAD:tmp-letter-context-font-sizes
