name: Set header spacing default once

on:
  push:
    branches:
      - templateFIX
    paths:
      - .github/workflows/tmp-header-gap-12.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: templateFIX
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Set 12 mm shared header spacing default
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, f'{path}: expected one match for {old!r}, found {s.count(old)}'
              p.write_text(s.replace(old, new, 1))

          p = 'src/lib/dossier-chrome.ts'
          replace_once(p, '  headerGapMm: 6,', '  headerGapMm: 12,')
          replace_once(p, '?? fallback.headerGapMm ?? 6', '?? fallback.headerGapMm ?? 12')
          replace_once(p, 'design.headerGapMm === (options.headerGapMm ?? 6)', 'design.headerGapMm === (options.headerGapMm ?? 12)')
          replace_once(p, 'headerGapMm: options.headerGapMm ?? 6,', 'headerGapMm: options.headerGapMm ?? 12,')
          replace_once(p, 'options.headerGapMm ?? 6', 'options.headerGapMm ?? 12')

          p = 'src/components/letter/LetterCanvas.tsx'
          replace_once(p, '    headerGapMm: 6,', '    headerGapMm: 12,')
          replace_once(p, 'chrome.headerGapMm ?? 6', 'chrome.headerGapMm ?? 12')

          p = 'src/components/dossier/DossierChromeControls.tsx'
          replace_once(p, '  const headerGap = options.headerGapMm ?? 6;', '  const headerGap = options.headerGapMm ?? 12;')
          replace_once(p, '                  <span>Abstand nach Header</span>', '                  <span>Freiraum unter dem Header</span>')
          replace_once(p, '                {headerGap !== 6 ? (', '                {headerGap !== 12 ? (')
          replace_once(p, '                    onClick={() => patchOptions({ headerGapMm: 6 })}', '                    onClick={() => patchOptions({ headerGapMm: 12 })}')
          replace_once(p, '                    Standardabstand', '                    Standardabstand (12 mm)')

          controls = Path(p)
          s = controls.read_text()
          marker = '''                <input
                  data-dossier-header-gap-control
                  type="range"
                  min={0}
                  max={40}
                  step={1}
                  value={Math.min(40, Math.max(0, headerGap))}
                  onChange={(event) => patchOptions({ headerGapMm: Number(event.target.value) })}
                  className="w-full accent-primary"
                />
'''
          assert s.count(marker) == 1, 'header gap slider not found'
          helper = '''                <span className="text-[11px] leading-relaxed text-muted-foreground">
                  Abstand zwischen Header-Ende und dem ersten Inhalt.
                </span>
'''
          controls.write_text(s.replace(marker, marker + helper, 1))

          p = 'tests/unit/dossier-header-gap.test.ts'
          replace_once(p, 'defaults to 6 mm and clamps persisted values to 0–40 mm', 'defaults to 12 mm and clamps persisted values to 0–40 mm')
          replace_once(p, 'expect(DEFAULT_DOSSIER_CHROME_OPTIONS.headerGapMm).toBe(6);', 'expect(DEFAULT_DOSSIER_CHROME_OPTIONS.headerGapMm).toBe(12);')
          replace_once(p, 'expect(legacy.shared.headerGapMm).toBe(6);', 'expect(legacy.shared.headerGapMm).toBe(12);')
          replace_once(p, 'expect(controls).toContain("<span>Abstand nach Header</span>");', 'expect(controls).toContain("<span>Freiraum unter dem Header</span>");')
          replace_once(p, 'expect(controls).toContain("headerGapMm: 6");', 'expect(controls).toContain("headerGapMm: 12");')
          replace_once(p, 'expect(letterCanvas).toContain("chrome.headerGapMm ?? 6");', 'expect(letterCanvas).toContain("chrome.headerGapMm ?? 12");')

          p = 'tests/unit/dossier-chrome-geometry.test.ts'
          replace_once(p, 'expect(dossierHeaderContentTopMmForOptions(contact, 0)).toBe(37);', 'expect(dossierHeaderContentTopMmForOptions(contact, 0)).toBe(43);')
          replace_once(p, 'toMatchObject({ top: 37, bottom: 20 })', 'toMatchObject({ top: 43, bottom: 20 })')
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format touched files
        run: bunx prettier --write src/lib/dossier-chrome.ts src/components/letter/LetterCanvas.tsx src/components/dossier/DossierChromeControls.tsx tests/unit/dossier-header-gap.test.ts tests/unit/dossier-chrome-geometry.test.ts
      - name: Unit tests
        run: bun test tests/unit
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Commit implementation
        run: |
          rm .github/workflows/tmp-header-gap-12.yml
          git config user.name modebrecht
          git config user.email '137332207+modebrecht@users.noreply.github.com'
          git add src/lib/dossier-chrome.ts src/components/letter/LetterCanvas.tsx src/components/dossier/DossierChromeControls.tsx tests/unit/dossier-header-gap.test.ts tests/unit/dossier-chrome-geometry.test.ts .github/workflows/tmp-header-gap-12.yml
          git commit -m 'Set 12 mm default spacing below header'
          git push origin HEAD:templateFIX