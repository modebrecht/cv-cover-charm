name: One-time CV card sidebar fix

on:
  push:
    branches:
      - feature/anschreiben-dossier

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anschreiben-dossier
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix card-template sidebar geometry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/cv/CvCanvas.tsx')
          text = path.read_text()

          old = '''    const surface = cvSurface(frame, pageIndex, layout, sidebarPct);\n    const {'''
          new = '''    const surface = cvSurface(frame, pageIndex, layout, sidebarPct);\n    const contentBox = cvContentBox(frame, pageIndex, layout, sidebarPct);\n    // Card-Vorlagen tragen den Kopf bewusst auf der farbigen Oberzone. Die\n    // Sidebar darf diese Komposition auf Seite 1 weder links anschneiden noch\n    // vertikal hineinragen. Ab Seite 2 gilt wieder die normale Kartenfläche.\n    const cardHeaderClearanceMm =\n      frame.id === "card" && pageIndex === 0 && !personLayoutCustomized\n        ? contentBox.top + 32\n        : surface.top;\n    const sidebarTopMm = onColumn ? 0 : Math.max(surface.top, cardHeaderClearanceMm);\n    const sidebarLeftMm = onColumn ? 0 : frame.id === "card" ? surface.left : 0;\n    const {'''
          assert old in text, 'modernSidebar surface marker not found'
          text = text.replace(old, new, 1)

          old_style = '''          left: 0,\n          top: onColumn ? 0 : `${surface.top}mm`,'''
          new_style = '''          left: `${sidebarLeftMm}mm`,\n          top: `${sidebarTopMm}mm`,'''
          assert old_style in text, 'modernSidebar position marker not found'
          text = text.replace(old_style, new_style, 1)
          path.write_text(text)
          PY

      - name: Add regression for card sidebar versus header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/dossier-regression.spec.ts')
          text = path.read_text()
          assert 'card-template sidebar clears the header' not in text

          test = r'''

            test("card-template sidebar clears the header and stays inside the card", async ({ page }) => {
              await seedCv(page, { layout: "modern" });
              await page.evaluate(() => {
                const saved = JSON.parse(localStorage.getItem("lebenslauf:v1") ?? "{}");
                saved.data = { ...saved.data, titel: "Lebenslauf" };
                saved.design = {
                  ...saved.design,
                  template: "neon",
                  colors: { bg: "#09071f", primary: "#7c3aed", accent: "#ec4899" },
                };
                localStorage.setItem("lebenslauf:v1", JSON.stringify(saved));
                window.location.reload();
              });
              await page.waitForLoadState("domcontentloaded");

              const sheet = previewRoot(page).locator('[data-cv-page="0"]');
              await sheet.waitFor({ state: "visible" });
              const sidebar = sheet.locator('[data-cv-sidebar]');
              const header = sheet.locator('[data-cv-main] [data-cv-header]').first();
              const main = sheet.locator('[data-cv-main]');
              await expect(sidebar).toBeVisible();
              await expect(header).toBeVisible();

              const geometry = await Promise.all([
                sheet.boundingBox(),
                sidebar.boundingBox(),
                header.boundingBox(),
                main.boundingBox(),
              ]);
              const [sheetBox, sidebarBox, headerBox, mainBox] = geometry;
              expect(sheetBox).not.toBeNull();
              expect(sidebarBox).not.toBeNull();
              expect(headerBox).not.toBeNull();
              expect(mainBox).not.toBeNull();

              expect(sidebarBox!.x).toBeGreaterThan(sheetBox!.x + 1);
              expect(sidebarBox!.y).toBeGreaterThanOrEqual(headerBox!.y + headerBox!.height - 1.5);
              expect(sidebarBox!.x + sidebarBox!.width).toBeLessThanOrEqual(mainBox!.x + 1.5);
              await expect(sheet.getByText("Lebenslauf", { exact: true })).toBeVisible();
            });
          '''

          end = '\n});'
          pos = text.rfind(end)
          assert pos != -1
          text = text[:pos] + test + text[pos:]
          path.write_text(text)
          PY
          bunx prettier --write src/components/cv/CvCanvas.tsx tests/e2e/dossier-regression.spec.ts

      - name: Install application dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Production build
        run: bun run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/lebenslauf > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1
      - name: Run dossier regression suite
        run: npx playwright test tests/e2e/dossier-regression.spec.ts --reporter=line --workers=1
      - name: Show app log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true
      - name: Commit passing fix and remove one-time workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fix-cv-card-sidebar.yml
          git add src/components/cv/CvCanvas.tsx tests/e2e/dossier-regression.spec.ts
          git diff --cached --check
          git commit -m "Fix CV card sidebar header overlap"
          git push origin HEAD:feature/anschreiben-dossier
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
