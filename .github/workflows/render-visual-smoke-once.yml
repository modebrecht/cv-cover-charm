name: Render Visual Smoke Once

on:
  push:
    branches:
      - render

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Unit tests
        run: bun test tests/unit

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Focused browser smoke
        run: npx playwright test tests/e2e/dossier-state-roundtrip.spec.ts tests/e2e/letter-header-modes.spec.ts --reporter=line --workers=1

      - name: Generate representative PDF review set
        shell: bash
        run: |
          mkdir -p artifacts/render-smoke
          for batch in 0 1; do
            GALLERY_BATCH_INDEX="$batch" GALLERY_DIR="artifacts/render-smoke-batch-$batch" \
              npx playwright test tests/e2e/dossier-gallery.spec.ts --reporter=line --workers=1
          done
          find artifacts/render-smoke-batch-* -maxdepth 1 -type f -name '*.pdf' -exec cp {} artifacts/render-smoke/ \;
          count="$(find artifacts/render-smoke -maxdepth 1 -type f -name '*.pdf' | wc -l | tr -d ' ')"
          echo "Representative PDFs: $count"
          test "$count" -eq 8
          {
            echo "Render visual smoke"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "PDF count: $count"
            echo
            find artifacts/render-smoke -maxdepth 1 -type f -name '*.pdf' -printf '%f\n' | sort
          } > artifacts/render-smoke/SMOKE.txt

      - name: Upload render visual smoke ZIP
        uses: actions/upload-artifact@v4
        with:
          name: render-visual-smoke-review
          path: artifacts/render-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Show app log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
