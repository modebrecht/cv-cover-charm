name: One-off PDF fix branch cleanup

on:
  push:
    branches:
      - fix/pdf-richtext-collision-20260917-v6

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-richtext-collision-20260917-v6
          fetch-depth: 0
      - name: Remove temporary CI scaffolding
        shell: bash
        run: |
          sed -i '/      - fix\/pdf-richtext-collision-20260917-v6/d' .github/workflows/dossier-regression.yml
          rm -f tests/e2e/.pdf-richtext-ci-trigger
          rm .github/workflows/cleanup-pdf-fix-branch.yml
      - name: Commit clean branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dossier-regression.yml tests/e2e/.pdf-richtext-ci-trigger .github/workflows/cleanup-pdf-fix-branch.yml
          git commit -m "chore(pdf): remove temporary fix-branch CI scaffolding"
          git push origin HEAD:fix/pdf-richtext-collision-20260917-v6
