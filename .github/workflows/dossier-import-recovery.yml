name: Dossier JSON import recovery

on:
  push:
    branches: [dev]
    paths:
      - "src/lib/dossier-project*.ts"
      - "src/lib/dossier-import.ts"
      - "src/lib/dossier-storage-write.ts"
      - "src/components/cv/portable-state.ts"
      - "src/components/dossier/ProjectFileControls.tsx"
      - "tests/e2e/dossier-import-recovery.spec.ts"
      - "tests/unit/dossier-project*.test.ts"
      - "tests/qa/playwright.import-recovery.config.ts"
      - "scripts/historical_roundtrip_report.py"
      - ".github/workflows/dossier-import-recovery.yml"
      - "scripts/qa-browser-setup.sh"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [dev]
    paths:
      [
        "src/**",
        "tests/e2e/dossier-import-recovery.spec.ts",
        "tests/unit/dossier-project-file.test.ts",
        "tests/qa/playwright.import-recovery.config.ts",
        "scripts/historical_roundtrip_report.py",
        ".github/workflows/dossier-import-recovery.yml",
        "package.json",
        "bun.lock",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dossier-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locked application dependencies and isolated browser tooling
        run: |
          bun install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/cvcc-browser-tools" --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          ln -s "$RUNNER_TEMP/cvcc-browser-tools/node_modules/@playwright" node_modules/@playwright
          ln -s "$RUNNER_TEMP/cvcc-browser-tools/node_modules/.bin/playwright" node_modules/.bin/playwright
          bash scripts/qa-browser-setup.sh
      - name: Units, types, lint and build
        run: |
          bun test tests/unit
          bun run typecheck
          npx tsc --noEmit -p tests/qa/tsconfig.json
          bun run lint
          bun run build
      - name: Native browser import and recovery
        run: '"$RUNNER_TEMP/cvcc-browser-tools/node_modules/.bin/playwright" test --config tests/qa/playwright.import-recovery.config.ts'
      - name: Compare all downloaded PDF pages before and after restore
        run: |
          python3 -m venv .import-venv
          .import-venv/bin/pip install pillow==11.3.0 pymupdf==1.26.4
          .import-venv/bin/python scripts/historical_roundtrip_report.py
          cat artifacts/import-recovery/comparison/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dossier-import-${{ github.sha }}
          path: |
            artifacts/import-recovery
            test-results/import-recovery
          retention-days: 14
