name: Finalize dossier-flow smokes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-dossier-flow-smokes.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final smoke patch
        run: python3 .github/scripts/finalize-dossier-flow-smokes.py

      - name: Format touched test
        run: npx prettier --write tests/e2e/dossier-regression.spec.ts

      - name: Commit final smoke fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: use visible dossier state in letter smokes"
          git push origin HEAD:main
