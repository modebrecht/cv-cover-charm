name: Apply visual template regression fix

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/visual-template-regression-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/visual-template-regression-fix.py
      - name: Format
        run: npx prettier --write src/components/cover/layouts.ts src/components/cover/CoverBackground.tsx src/components/cv/archetype.ts src/components/cv/layout-options.css src/components/letter/LetterCanvas.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: repair dossier template visual regressions"
          git push origin HEAD:dev
