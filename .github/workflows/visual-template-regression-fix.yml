name: Apply visual template regression fix

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/visual-template-regression-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch visual regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          # Modern: the left header uses the same 20 mm edge as the right-aligned location.
          # Blockig: keep the full kicker on one line so "ALS" never hangs alone.
          replace_one(
              "src/components/cover/layouts.ts",
              '''function modernTopClusterOffset(
            template: TemplateId,
            block: Block,
            overrides: StyleOverrides,
          ): Block {
            if (template !== "modern") return block;
            if (block.id !== "foto" && block.id !== "modernAccentCircle") return block;
            if (overrides[block.id]?.y !== undefined) return block;

            return {
              ...block,
              style: { ...block.style, y: block.style.y + MODERN_TOP_CLUSTER_OFFSET_MM },
            };
          }''',
              '''function templateDefaultAdjustment(
            template: TemplateId,
            block: Block,
            overrides: StyleOverrides,
          ): Block {
            let adjusted = block;

            if (template === "modern") {
              if (block.id === "eyebrow" && overrides[block.id]?.x === undefined) {
                adjusted = { ...adjusted, style: { ...adjusted.style, x: 20 } };
              }
              if (
                (block.id === "foto" || block.id === "modernAccentCircle") &&
                overrides[block.id]?.y === undefined
              ) {
                adjusted = {
                  ...adjusted,
                  style: { ...adjusted.style, y: adjusted.style.y + MODERN_TOP_CLUSTER_OFFSET_MM },
                };
              }
            }

            if (template === "blockig" && block.id === "kicker") {
              adjusted = {
                ...adjusted,
                style: {
                  ...adjusted.style,
                  ...(overrides[block.id]?.w === undefined ? { w: 174 } : {}),
                  ...(overrides[block.id]?.maxLines === undefined ? { maxLines: 1 } : {}),
                },
              };
            }

            return adjusted;
          }'''
          )
          replace_one(
              "src/components/cover/layouts.ts",
              '''  const blocks = buildBaseBlocks(template, data, customs, overrides, slots).map((block) =>
            modernTopClusterOffset(template, block, overrides),
          );
            const decorations = templateDecorations(template, overrides).map((block) =>
              modernTopClusterOffset(template, block, overrides),
            );''',
              '''  const blocks = buildBaseBlocks(template, data, customs, overrides, slots).map((block) =>
            templateDefaultAdjustment(template, block, overrides),
          );
            const decorations = templateDecorations(template, overrides).map((block) =>
              templateDefaultAdjustment(template, block, overrides),
            );'''
          )

          # Colorful needs a real print-safe header zone, not a title glued to the top edge.
          replace_one(
              "src/components/cv/archetype.ts",
              '  colorful: band(30, { footMm: 8 }), //     Titelblatt: 28 mm Kopfband, 8 mm Fussband',
              '  colorful: band(40, { footMm: 8 }), //     CV: 40 mm Druckrand-Kopfzone, 8 mm Fussband'
          )

          # The CV renderer intentionally does not reuse editable title-page primitives.
          # Recreate only the structural CV bands needed for readable Warm/Colorful headers;
          # Warm's circles deliberately stay off the CV.
          replace_one(
              "src/components/cover/CoverBackground.tsx",
              '''  return (
            <>
              {template === "blockig" ? (''',
              '''  return (
            <>
              {template === "freundlich" || template === "colorful" ? (
                <style>{`
                  html[data-dossier-template="freundlich"] [data-dossier-document="cv"] [data-cv-page="0"] [data-cv-background="motif"] > div::before {
                    content: "";
                    position: absolute;
                    left: 0;
                    right: 0;
                    top: 0;
                    height: 52mm;
                    background: var(--cover-primary);
                    pointer-events: none;
                  }
                  html[data-dossier-template="freundlich"] [data-dossier-document="cv"] [data-cv-page]:not([data-cv-page="0"]) [data-cv-background="motif"] > div::before {
                    content: "";
                    position: absolute;
                    left: 0;
                    right: 0;
                    top: 0;
                    height: 14mm;
                    background: var(--cover-primary);
                    pointer-events: none;
                  }
                  html[data-dossier-template="colorful"] [data-dossier-document="cv"] [data-cv-page="0"] [data-cv-background="motif"] > div::before {
                    content: "";
                    position: absolute;
                    left: 0;
                    right: 0;
                    top: 0;
                    height: 40mm;
                    background: var(--cover-primary);
                    pointer-events: none;
                  }
                  html[data-dossier-template="colorful"] [data-dossier-document="cv"] [data-cv-page]:not([data-cv-page="0"]) [data-cv-background="motif"] > div::before {
                    content: "";
                    position: absolute;
                    left: 0;
                    right: 0;
                    top: 0;
                    height: 14mm;
                    background: var(--cover-primary);
                    pointer-events: none;
                  }
                  html[data-dossier-template="colorful"] [data-dossier-document="cv"] [data-cv-background="motif"] > div::after {
                    content: "";
                    position: absolute;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    height: 8mm;
                    background: var(--cover-secondary);
                    pointer-events: none;
                  }
                `}</style>
              ) : null}
              {template === "blockig" ? ('''
          )
          replace_one(
              "src/components/cover/CoverBackground.tsx",
              '''            "--cover-primary": colors.primary ?? colors.accent ?? colors.ink ?? colors.bg,
                "--cover-accent": colors.accent ?? colors.secondary ?? colors.primary ?? colors.bg,''',
              '''            "--cover-primary": colors.primary ?? colors.accent ?? colors.ink ?? colors.bg,
                "--cover-secondary": colors.secondary ?? colors.accent ?? colors.primary ?? colors.bg,
                "--cover-accent": colors.accent ?? colors.secondary ?? colors.primary ?? colors.bg,'''
          )

          # Warm: no second outline/ring around the circular CV portrait.
          replace_one(
              "src/components/cv/layout-options.css",
              '''[data-cv-photo] {
            position: relative !important;
            /*
             * Rahmenfarbe: ohne eigene Wahl die Schriftfarbe der Umgebung, sonst die im
             * Lebenslauf gewählte. Die Regel gewinnt gegen Inline-Stile, darum läuft auch
             * die Farbe über eine Variable statt über den Renderer.
             */
            box-shadow: 0 0 0 var(--cv-photo-border-width, 0.3mm) var(--cv-photo-border-color, currentColor) !important;
          }''',
              '''[data-cv-photo] {
            position: relative !important;
            /*
             * Rahmenfarbe: ohne eigene Wahl die Schriftfarbe der Umgebung, sonst die im
             * Lebenslauf gewählte. Die Regel gewinnt gegen Inline-Stile, darum läuft auch
             * die Farbe über eine Variable statt über den Renderer.
             */
            box-shadow: 0 0 0 var(--cv-photo-border-width, 0.3mm) var(--cv-photo-border-color, currentColor) !important;
          }

          /* Warm hält das runde Portrait bewusst sauber: kein zweiter Kreis um den Bildausschnitt. */
          html[data-dossier-template="freundlich"] [data-dossier-document="cv"] [data-cv-photo] {
            box-shadow: none !important;
          }'''
          )

          # Edel letter gets the same dark outer sheet + light writing surface as its CV.
          # Edel blockig restores its 36 mm dark cap and 16 mm dark footer field.
          replace_one(
              "src/components/letter/LetterCanvas.tsx",
              '''  edelBlockig: {
            kind: "band",
            left: 25,
            right: 23,
            top: 31,
            bottom: 25,
            bandMm: 14,
            footMm: 7,
          },''',
              '''  edelBlockig: {
            kind: "band",
            left: 25,
            right: 23,
            top: 44,
            bottom: 24,
            bandMm: 36,
            footMm: 16,
          },'''
          )
          replace_one(
              "src/components/letter/LetterCanvas.tsx",
              '''  const primaryRoles = onColorRoles(primary, accent);

            if (layout.kind === "card") {''',
              '''  const primaryRoles = onColorRoles(primary, accent);

            if (template === "edel") {
              return (
                <div
                  className="absolute inset-0 overflow-hidden"
                  style={{ backgroundColor: color(colors, "bg") }}
                  aria-hidden="true"
                >
                  <div
                    className="absolute"
                    style={{ inset: "19mm", backgroundColor: palette.paper }}
                  />
                  <div
                    className="absolute"
                    style={{
                      inset: "12mm",
                      border: `0.55px solid ${accent}`,
                      opacity: 0.5,
                    }}
                  />
                  <div
                    className="absolute"
                    style={{
                      inset: "15mm",
                      border: `0.35px solid ${accent}`,
                      opacity: 0.3,
                    }}
                  />
                </div>
              );
            }

            if (layout.kind === "card") {'''
          )
          replace_one(
              "src/components/letter/LetterCanvas.tsx",
              '''            backgroundColor: template === "sonne" ? primary : accent,''',
              '''            backgroundColor:
                      template === "sonne" || template === "edelBlockig" ? primary : accent,'''
          )
          replace_one(
              "src/components/letter/LetterCanvas.tsx",
              '''      {layout.kind === "band" && (layout.bandMm ?? 0) > 0 && (
                <div
                  className="absolute inset-x-0 top-0"
                  style={{ height: `${layout.bandMm}mm`, backgroundColor: primary }}
                />
              )}

              {(layout.footMm ?? 0) > 0 && (''',
              '''      {layout.kind === "band" && (layout.bandMm ?? 0) > 0 && (
                <div
                  className="absolute inset-x-0 top-0"
                  style={{ height: `${layout.bandMm}mm`, backgroundColor: primary }}
                />
              )}

              {template === "edelBlockig" && (
                <div
                  className="absolute inset-x-0 top-[36mm] h-[0.3mm]"
                  style={{ backgroundColor: accent, opacity: 0.72 }}
                />
              )}

              {(layout.footMm ?? 0) > 0 && ('''
          )

          # Remove this one-shot workflow in the same real fix commit.
          Path(".github/workflows/visual-template-regression-fix.yml").unlink()
          PY

      - name: Format changed sources
        run: npx prettier --write src/components/cover/layouts.ts src/components/cover/CoverBackground.tsx src/components/cv/archetype.ts src/components/cv/layout-options.css src/components/letter/LetterCanvas.tsx

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: repair dossier template visual regressions"
          git push origin HEAD:dev
