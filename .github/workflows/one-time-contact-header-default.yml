name: One-time contact header default migration

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-time-contact-header-default.yml

permissions:
  contents: write

jobs:
  migrate-default:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Make contact header the true default
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/lib/dossier-chrome.ts",
              '  headerMode: "compact",\n',
              '  headerMode: "contact",\n',
          )
          replace_once(
              "src/lib/dossier-chrome.ts",
              '    headerMode:\n      value.headerMode === "contact" || value.headerMode === "none" ? value.headerMode : "compact",\n',
              '    headerMode:\n      value.headerMode === "compact" ||\n      value.headerMode === "contact" ||\n      value.headerMode === "none"\n        ? value.headerMode\n        : fallback.headerMode,\n',
          )

          replace_once(
              "src/components/letter/types.ts",
              '    headerMode: "compact",\n',
              '    headerMode: "contact",\n',
          )
          replace_once(
              "src/components/letter/types.ts",
              '  const headerMode: LetterHeaderMode =\n    incoming.headerMode === "contact" || incoming.headerMode === "none"\n      ? incoming.headerMode\n      : "compact";\n',
              '  const headerMode: LetterHeaderMode =\n    incoming.headerMode === "compact" ||\n    incoming.headerMode === "contact" ||\n    incoming.headerMode === "none"\n      ? incoming.headerMode\n      : fallback.headerMode ?? "contact";\n',
          )

          replace_once(
              "tests/unit/dossier-chrome-sync.test.ts",
              '    expect(state.shared.headerMode).toBe("compact");\n',
              '    expect(state.shared.headerMode).toBe("contact");\n',
          )
          replace_once(
              "tests/unit/dossier-chrome-sync.test.ts",
              '    expect(cv.letter.headerMode).toBe("compact");\n',
              '    expect(cv.letter.headerMode).toBe("contact");\n',
          )
          PY

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dossier-chrome.ts src/components/letter/types.ts tests/unit/dossier-chrome-sync.test.ts
          git commit -m "Make contact header the default"
          git push origin HEAD:dev
