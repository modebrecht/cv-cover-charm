name: One-time Modern letter cleanup

on:
  push:
    branches:
      - feature/anschreiben-dossier
    paths:
      - .github/workflows/one-time-remove-modern-letter-bars.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anschreiben-dossier

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Modern cleanup
        run: python scripts/one-time-remove-modern-letter-bars.py

      - name: Verify decorative bars are gone
        shell: bash
        run: |
          ! grep -F 'left-[24mm] top-[18mm] h-[2mm] w-[10mm]' src/components/letter/LetterCanvas.tsx
          ! grep -F 'inset-x-0 bottom-0 h-[4mm]' src/components/letter/LetterCanvas.tsx
          grep -F 'right-[-20mm] top-[14mm] h-[62mm] w-[62mm] rounded-full' src/components/letter/LetterCanvas.tsx

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Unit tests
        run: bun test tests/unit

      - name: Lint changed file
        run: bunx eslint src/components/letter/LetterCanvas.tsx

      - name: Production build
        run: bun run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/anschreiben > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Run dossier regression suite
        run: npx playwright test tests/e2e/dossier-regression.spec.ts --reporter=line --workers=1

      - name: Commit passing cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-remove-modern-letter-bars.yml scripts/one-time-remove-modern-letter-bars.py
          git add src/components/letter/LetterCanvas.tsx
          git diff --cached --check
          git commit -m "Simplify Modern motivation-letter decoration"
          git push origin HEAD:feature/anschreiben-dossier

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then kill "$(cat /tmp/cv-cover-charm.pid)" || true; fi
