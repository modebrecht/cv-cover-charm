name: Add dossier-wide Brief template

on:
  push:
    branches:
      - dev
    paths:
      - .github/scripts/add-brief-dossier-template.py
      - .github/workflows/add-brief-dossier-template.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply Brief dossier template patch
        run: python .github/scripts/add-brief-dossier-template.py
      - name: Format touched files
        run: |
          npx --yes prettier@3.8.3 --write \
            src/components/cover/types.ts \
            src/components/letter/LetterTemplatePicker.tsx \
            src/components/cover/layouts-base.ts \
            src/components/cover/CoverBackground.tsx \
            src/components/cv/archetype.ts \
            tests/unit/dossier-sheet-background.test.tsx \
            tests/e2e/dossier-gallery.spec.ts
      - name: Commit Brief dossier template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Brief template across dossier"
          git push origin HEAD:dev
